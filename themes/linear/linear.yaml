Linear:
  # Dark port of the Rafael Design System (see DESIGN.md): true-black ground, neutral
  # surface ladder, Signal Orange #FF6B35 as the only brand accent, semantic colors for state.
  card-mod-theme: Linear
  card-mod-card: |
    mushroom-shape-icon {
      --icon-color: rgb(194, 194, 194) !important;
      --shape-color: rgba(194, 194, 194, 0.08) !important;
    }
    mushroom-chip, mushroom-template-chip, mushroom-entity-chip, mushroom-conditional-chip {
      --color: rgb(194, 194, 194) !important;
    }
    ha-state-icon, ha-icon, ha-svg-icon {
      color: rgb(194, 194, 194) !important;
    }
    mushroom-fan-card, mushroom-light-card, mushroom-climate-card, mushroom-cover-card, mushroom-media-player-card {
      --slider-color: #ff6b35 !important;
      --control-slider-color: #ff6b35 !important;
      --main-color: #ff6b35 !important;
      --rgb-state-fan: 255, 107, 53 !important;
      --rgb-state-light: 255, 107, 53 !important;
      --rgb-state-climate-cool: 255, 107, 53 !important;
      --rgb-state-media-player: 255, 107, 53 !important;
    }
    img, .entity-picture, state-badge, ha-entity-picture, .image, .picture {
      filter: grayscale(1) brightness(0.95) !important;
    }
  modes:
    dark:
      # --- base ---
      primary-color: "#ff6b35"
      accent-color: "#ff6b35"
      primary-background-color: "#000000"
      secondary-background-color: "#070707"
      divider-color: "rgba(255,255,255,0.1)"
      # --- text ---
      primary-text-color: "#ededed"
      secondary-text-color: "#c2c2c2"
      text-primary-color: "#ededed"
      disabled-text-color: "#5a5a60"
      # --- header ---
      app-header-background-color: "#000000"
      app-header-text-color: "#ededed"
      app-header-selection-bar-color: "#ff6b35"
      # --- sidebar ---
      sidebar-background-color: "#000000"
      sidebar-icon-color: "#c2c2c2"
      sidebar-text-color: "#c2c2c2"
      sidebar-selected-icon-color: "#ededed"
      sidebar-selected-text-color: "#ededed"
      sidebar-selected-background-color: "rgba(255,255,255,0.06)"
      # --- cards ---
      ha-card-background: "#141414"
      card-background-color: "#141414"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255,255,255,0.1)"
      ha-card-border-radius: "12px"
      ha-card-box-shadow: "none"
      mush-card-primary-font-weight: "400"
      mush-chip-height: "44px"
      # --- icons / states monochrome ---
      state-icon-color: "#c2c2c2"
      paper-item-icon-color: "#c2c2c2"
      state-light-on-color: "#ff6b35"
      state-light-off-color: "#5a5a60"
      state-active-color: "#ff6b35"
      state-fan-on-color: "#ff6b35"
      state-switch-active-color: "#ff6b35"
      state-unavailable-color: "#4a4a50"
      # --- controls monochrome ---
      switch-checked-color: "#ff6b35"
      switch-unchecked-color: "#4a4a50"
      slider-color: "#ff6b35"
      slider-secondary-color: "#3a3a40"
      paper-slider-active-color: "#ff6b35"
      paper-slider-knob-color: "#ff6b35"
      mdc-theme-primary: "#ff6b35"
      # --- alle Farbvariablen auf ein Grau mappen (mushroom + tiles) ---
      rgb-primary-color: "255,107,53"
      rgb-accent-color: "255,107,53"
      rgb-primary-text-color: "237,237,237"
      rgb-secondary-text-color: "194,194,194"
      rgb-white: "237,237,237"
      rgb-disabled: "90,90,96"
      # semantic state colors (danger, warning, available), dark variants
      rgb-red: "249,112,102"
      rgb-pink: "194,194,194"
      rgb-purple: "194,194,194"
      rgb-deep-purple: "194,194,194"
      rgb-indigo: "194,194,194"
      rgb-blue: "194,194,194"
      rgb-light-blue: "194,194,194"
      rgb-cyan: "194,194,194"
      rgb-teal: "194,194,194"
      rgb-green: "76,217,138"
      rgb-light-green: "194,194,194"
      rgb-lime: "194,194,194"
      rgb-yellow: "194,194,194"
      rgb-amber: "250,184,77"
      rgb-orange: "250,184,77"
      rgb-deep-orange: "194,194,194"
      rgb-brown: "194,194,194"
      rgb-grey: "194,194,194"
      rgb-blue-grey: "194,194,194"
      rgb-black: "194,194,194"
      # --- mushroom info/state colors ---
      rgb-state-media-player: "194,194,194"
      rgb-state-vacuum: "194,194,194"
      rgb-state-fan: "194,194,194"
      rgb-state-light: "237,237,237"
      rgb-state-climate-cool: "194,194,194"
      rgb-state-climate-heat: "194,194,194"
