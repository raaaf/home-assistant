Linear:
  # Dark port of the Rafael Design System (see DESIGN.md): true-black ground, neutral
  # surface ladder, Signal Orange #FF6B35 as the only brand accent, semantic colors for state.
  card-mod-theme: Linear
  # Colors come from theme variables, not card-mod, so the first render is already right
  # (card-mod applies after render and made icons flash in their default colors).
  card-mod-card: |
    img, .entity-picture, state-badge, ha-entity-picture, .image, .picture {
      filter: grayscale(1) brightness(0.95) !important;
    }
  modes:
    dark:
      # --- base ---
      primary-color: "#ff6b35"
      accent-color: "#ff6b35"
      primary-background-color: "#000000"
      secondary-background-color: "#070707"
      divider-color: "rgba(255,255,255,0.1)"
      # --- text ---
      primary-text-color: "#ededed"
      secondary-text-color: "#c2c2c2"
      text-primary-color: "#ededed"
      disabled-text-color: "#5a5a60"
      # --- header ---
      app-header-background-color: "#000000"
      app-header-text-color: "#ededed"
      app-header-selection-bar-color: "#ff6b35"
      # --- sidebar ---
      sidebar-background-color: "#000000"
      sidebar-icon-color: "#c2c2c2"
      sidebar-text-color: "#c2c2c2"
      sidebar-selected-icon-color: "#ededed"
      sidebar-selected-text-color: "#ededed"
      sidebar-selected-background-color: "rgba(255,255,255,0.06)"
      # --- cards ---
      ha-card-background: "#141414"
      card-background-color: "#141414"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255,255,255,0.1)"
      ha-card-border-radius: "12px"
      ha-card-box-shadow: "none"
      mush-card-primary-font-weight: "400"
      ha-tile-info-primary-font-weight: "400"
      mush-chip-font-weight: "500"
      mush-chip-height: "44px"
      # --- icons / states monochrome ---
      state-icon-color: "#c2c2c2"
      paper-item-icon-color: "#c2c2c2"
      state-light-on-color: "#ff6b35"
      state-light-off-color: "#5a5a60"
      state-active-color: "#ff6b35"
      state-fan-on-color: "#ff6b35"
      state-switch-active-color: "#ff6b35"
      state-unavailable-color: "#4a4a50"
      # --- controls monochrome ---
      switch-checked-color: "#ff6b35"
      switch-unchecked-color: "#4a4a50"
      slider-color: "#ff6b35"
      slider-secondary-color: "#3a3a40"
      paper-slider-active-color: "#ff6b35"
      paper-slider-knob-color: "#ff6b35"
      mdc-theme-primary: "#ff6b35"
      # --- state: inactive is grey, active is Signal Orange, problems are semantic ---
      state-inactive-color: "#c2c2c2"
      state-input_boolean-active-color: "#ff6b35"
      state-input_boolean-on-color: "#ff6b35"
      state-binary_sensor-active-color: "#ff6b35"
      state-binary_sensor-on-color: "#ff6b35"
      state-sensor-battery-high-color: "#c2c2c2"
      state-sensor-battery-medium-color: "#fab84d"
      state-sensor-battery-low-color: "#f97066"
      # HA named palette: decorative hues -> grey, semantic hues -> design system
      blue-color: "#c2c2c2"
