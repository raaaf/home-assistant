# Energy: tariff, grid and solar sensors, utility meters and cost parameters

template:
  # Strompreis PLAN-B Flow12 (ab 2025)
  - sensor:
      - name: "Strompreis aktuell"
        unique_id: strompreis_aktuell
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: "{{ states('input_number.strompreis_kwh') | float(0.2876) }}"
        icon: mdi:currency-eur

      - name: "Stromkosten heute"
        unique_id: stromkosten_heute
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        state: >-
          {% set preis = states('input_number.strompreis_kwh') | float(0.2876) %}
          {{ (states('sensor.taglicher_netzbezug') | float(0) * preis) | round(2) }}
        icon: mdi:cash
        availability: "{{ is_number(states('sensor.taglicher_netzbezug')) }}"

      - name: "Solar-Ersparnis heute"
        unique_id: solar_ersparnis_heute
        unit_of_measurement: "€"
        device_class: monetary
        state: >-
          {% set preis = states('input_number.strompreis_kwh') | float(0.2876) %}
          {{ (states('sensor.dtu_ac_daily_energy') | float(0) / 1000 * preis) | round(2) }}
        icon: mdi:piggy-bank
        availability: "{{ is_number(states('sensor.dtu_ac_daily_energy')) }}"

      - name: "Stromkosten Monat geschätzt"
        unique_id: stromkosten_monat_geschaetzt
        unit_of_measurement: "€"
        device_class: monetary
        state: >-
          {% set verbrauch_monat = states('sensor.monatlicher_netzbezug') | float(0) %}
          {% set tag_im_monat = now().day %}
          {% set tage_gesamt = ((now().replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1)).day %}
          {% set durchschnitt = verbrauch_monat / tag_im_monat if tag_im_monat > 0 else 0 %}
          {% set arbeitspreis = durchschnitt * tage_gesamt * (states('input_number.strompreis_kwh') | float(0.2876)) %}
          {% set grundpreis = states('input_number.grundpreis_strom_monat') | float(16.54) %}
          {{ (arbeitspreis + grundpreis) | round(2) }}
        icon: mdi:calendar-month
        availability: "{{ is_number(states('sensor.monatlicher_netzbezug')) }}"

  - sensor:
      - name: "Solarproduktion gestern"
        unique_id: solarproduktion_gestern
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {#
            Priority order for yesterday's solar production (kWh):
            1) UI helper input_number.solarproduktion_gestern saved at 23:55
            2) DTU daily energy statistics fallback (Wh -> kWh)
          #}
          {% set helper = states('input_number.solarproduktion_gestern') %}
          {% if helper not in ['unknown', 'unavailable', ''] and helper | float(0) > 0 %}
            {{ helper | float(0) | round(2) }}
          {% else %}
            {% set today = now().date() %}
            {% set yesterday = (today - timedelta(days=1)).isoformat() %}
            {% set stats = state_attr('sensor.dtu_ac_daily_energy', 'statistics') %}
            {% if stats %}
              {% set match = stats | selectattr('start', 'defined') | selectattr('start', 'search', yesterday) | list %}
              {% if match and match[0]['sum'] is defined %}
                {{ (match[0]['sum'] / 1000) | round(2) }}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}
          {% endif %}

      # Netz Einspeisung/Bezug (Phase-Based Calculation)
      - name: "Stromzähler Saldiert"
        unique_id: stromzahler_saldiert
        unit_of_measurement: "W"
        device_class: power
        icon: mdi:counter
        state: >
          {% set phase_a = states('sensor.strommesser_phase_a_active_power')|float(0) %}
          {% set phase_b = states('sensor.strommesser_phase_b_active_power')|float(0) %}
          {% set phase_c = states('sensor.strommesser_phase_c_active_power')|float(0) %}
          {{ (phase_a + phase_b + phase_c)|round(1) }}
        availability: >
          {{ states('sensor.strommesser_phase_a_active_power') not in ['unknown', 'unavailable']
             and states('sensor.strommesser_phase_b_active_power') not in ['unknown', 'unavailable']
             and states('sensor.strommesser_phase_c_active_power') not in ['unknown', 'unavailable'] }}

      - name: "Netzbezug"
        unique_id: netzbezug
        unit_of_measurement: "W"
        device_class: power
        icon: mdi:transmission-tower-import
        state: >
          {% set saldiert = states('sensor.stromzahler_saldiert')|float(0) %}
          {% if saldiert > 0 %}
            {{ saldiert }}
          {% else %}
            0
          {% endif %}
        availability: "{{ states('sensor.stromzahler_saldiert') not in ['unknown', 'unavailable'] }}"

      - name: "Einspeisung"
        unique_id: einspeisung
        unit_of_measurement: "W"
        device_class: power
        icon: mdi:transmission-tower-export
        state: >
          {% set saldiert = states('sensor.stromzahler_saldiert')|float(0) %}
          {% if saldiert < 0 %}
            {{ saldiert|abs }}
          {% else %}
            0
          {% endif %}
        availability: "{{ states('sensor.stromzahler_saldiert') not in ['unknown', 'unavailable'] }}"

      - name: "Hausverbrauch Gesamt"
        unique_id: hausverbrauch_gesamt
        unit_of_measurement: "W"
        device_class: power
        icon: mdi:home-lightning-bolt
        state: >
          {% set saldiert = states('sensor.stromzahler_saldiert')|float(0) %}
          {% set bkw = states('sensor.aqara_plug_02_power')|float(0) %}
          {# BKK nur addieren wenn EcoFlow einspeist; bei Netzladung steckt der
             Bezug schon in 'saldiert', sonst doppelt gezaehlt #}
          {% set ecoflow_laedt_aus_netz = states('sensor.stream_ac_pro_3683_power_grid')|float(0) > 5 %}
          {{ (saldiert + (0 if ecoflow_laedt_aus_netz else bkw))|round(1) }}
        availability: >
          {{ states('sensor.stromzahler_saldiert') not in ['unknown', 'unavailable']
             and states('sensor.aqara_plug_02_power') not in ['unknown', 'unavailable'] }}

      # Echter Tagesverbrauch per Energiebilanz (identisch zur Rechnung des
      # HA Energy Dashboards): Bezug - Einspeisung + Solar + Batterie-Entladung
      # - Batterie-Ladung. Enthaelt damit ALLE Lasten (Klima, Trockner, Heizung
      # etc.), nicht nur die Powercalc-Teilmenge.
      - name: "Verbrauch heute"
        unique_id: verbrauch_heute
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:home-lightning-bolt
        state: >
          {% set imp = states('sensor.taglicher_netzbezug')|float(0) %}
          {% set exp = states('sensor.tagliche_einspeisung')|float(0) %}
          {% set pv  = states('sensor.dtu_ac_daily_energy')|float(0) / 1000 %}
          {% set bd  = states('sensor.tagliche_batterieentladung')|float(0) %}
          {% set bc  = states('sensor.tagliche_batterieladung')|float(0) %}
          {{ [(imp - exp + pv + bd - bc), 0]|max|round(2) }}
        availability: >
          {{ states('sensor.taglicher_netzbezug') not in ['unknown', 'unavailable']
             and states('sensor.tagliche_einspeisung') not in ['unknown', 'unavailable']
             and states('sensor.dtu_ac_daily_energy') not in ['unknown', 'unavailable'] }}

      - name: "PV Eigenverbrauch Quote"
        unique_id: pv_eigenverbrauch_quote
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt
        state: >
          {% set pv_heute = states('sensor.solarproduktion_gestern')|float(0) %}
          {% set einspeisung_heute = state_attr('sensor.tagliche_einspeisung', 'last_period')|float(0) if state_attr('sensor.tagliche_einspeisung', 'last_period') is not none else 0 %}
          {% if pv_heute > 0 %}
            {{ ((1 - einspeisung_heute/pv_heute) * 100)|round(0) }}
          {% else %}
            0
          {% endif %}
        availability: >
          {{ states('sensor.solarproduktion_gestern') not in ['unknown', 'unavailable'] }}

utility_meter:
  # ac_energy_daily: REMOVED - sensor.dtu_ac_daily_energy from Hoymiles already resets daily
  # Use sensor.dtu_ac_daily_energy directly instead

  # Utility meters for grid import/export tracking
  taglicher_netzbezug:
    source: sensor.netzbezug_energie
    name: "Täglicher Netzbezug"
    cycle: daily
    offset:
      hours: 0
      minutes: 0

  tagliche_einspeisung:
    source: sensor.einspeisung_energie
    name: "Tägliche Einspeisung"
    cycle: daily
    offset:
      hours: 0
      minutes: 0

  monatlicher_netzbezug:
    source: sensor.netzbezug_energie
    name: "Monatlicher Netzbezug"
    cycle: monthly
    offset:
      days: 0

  monatliche_einspeisung:
    source: sensor.einspeisung_energie
    name: "Monatliche Einspeisung"
    cycle: monthly
    offset:
      days: 0

  monatliche_solarproduktion:
    source: sensor.dtu_ac_daily_energy
    name: "Monatliche Solarproduktion"
    cycle: monthly
    offset:
      days: 0

  # Batterie-Durchsatz (EcoFlow Stream) für die Hausverbrauchs-Bilanz
  tagliche_batterieladung:
    source: sensor.stream_ac_pro_3683_cumulative_energy_charge_wh
    name: "Tägliche Batterieladung"
    cycle: daily
    offset:
      hours: 0
      minutes: 0

  tagliche_batterieentladung:
    source: sensor.stream_ac_pro_3683_cumulative_energy_discharge_wh
    name: "Tägliche Batterieentladung"
    cycle: daily
    offset:
      hours: 0
      minutes: 0

  # Utility Meter für Energy müssen Integration Sensoren verwenden
  # Diese werden automatisch durch Home Assistant Energy Dashboard erstellt
  # Falls sie nicht existieren, können sie über Settings > Energy konfiguriert werden

input_number:
  # Energy cost parameters
  strompreis_kwh:
    name: "Strompreis pro kWh"
    min: 0.10
    max: 1.00
    step: 0.0001
    unit_of_measurement: "€/kWh"
    icon: mdi:currency-eur
    initial: 0.2876
  grundpreis_strom_monat:
    name: "Grundpreis Strom pro Monat"
    min: 0
    max: 50
    step: 0.01
    unit_of_measurement: "€"
    icon: mdi:currency-eur
    initial: 16.54
