# General: time sensors, device status binary sensors, visitor helpers and saved HomePod volumes

template:
  # Devices whose battery needs replacing (phones and Macs excluded), drives the dashboard to-do row
  - sensor:
      - name: "Batterien niedrig"
        unique_id: batterien_niedrig
        icon: mdi:battery-alert-variant-outline
        state: >
          {{ states.sensor | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | rejectattr('entity_id', 'search', 'iphone|ipad|macbook|watch')
             | selectattr('state', 'is_number') | map(attribute='state') | map('float')
             | select('lt', 15) | list | count }}
        attributes:
          geraete: >
            {% set ns = namespace(l=[]) %}
            {% for s in states.sensor | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'battery')
                 | rejectattr('entity_id', 'search', 'iphone|ipad|macbook|watch') %}
              {% if s.state | is_number and s.state | float < 15 %}
                {% set ns.l = ns.l + [s.name | replace(' Battery', '') | replace(' Batterie', '') ~ ' ' ~ s.state | int ~ ' %'] %}
              {% endif %}
            {% endfor %}
            {{ ns.l | join(' · ') }}
          # Plain device names, read by the maintenance to-do sync (helpers/maintenance_todo.yaml)
          namen: >
            {% set ns = namespace(l=[]) %}
            {% for s in states.sensor | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'battery')
                 | rejectattr('entity_id', 'search', 'iphone|ipad|macbook|watch') %}
              {% if s.state | is_number and s.state | float < 15 %}
                {% set ns.l = ns.l + [s.name | replace(' Battery', '') | replace(' Batterie', '')] %}
              {% endif %}
            {% endfor %}
            {{ ns.l }}

  # Time-based sensors
  - sensor:
      - name: "WakeUp Light Timestamp"
        unique_id: wakeup_light_timestamp
        device_class: timestamp
        state: >
          {% set target = 'input_datetime.aufwachzeit_arbeitstag' if is_state("binary_sensor.workday_sensor", "on") else 'input_datetime.aufwachzeit_freier_tag' %}
          {% set raw = states(target) %}
          {% if raw in ['unknown', 'unavailable', ''] %}
            {{ none }}
          {% else %}
            {% set parsed = as_datetime(raw, default=None) %}
            {% set time_str = parsed.strftime('%H:%M:%S') if parsed is not none else raw %}
            {{ today_at(time_str) }}
          {% endif %}
        availability: >
          {{ states('binary_sensor.workday_sensor') not in ['unknown', 'unavailable'] and
             states('input_datetime.aufwachzeit_arbeitstag') not in ['unknown', 'unavailable'] and
             states('input_datetime.aufwachzeit_freier_tag') not in ['unknown', 'unavailable'] }}

      - name: "Einschlafzeit Timestamp"
        unique_id: einschlafzeit_timestamp
        device_class: timestamp
        state: >
          {% set target = 'input_datetime.einschlafzeit_arbeitstag' if is_state("binary_sensor.tomorrow_workday_sensor", "on") else 'input_datetime.einschlafzeit_freier_tag' %}
          {% set raw = states(target) %}
          {% if raw in ['unknown', 'unavailable', ''] %}
            {{ none }}
          {% else %}
            {% set parsed = as_datetime(raw, default=None) %}
            {% set time_str = parsed.strftime('%H:%M:%S') if parsed is not none else raw %}
            {{ today_at(time_str) }}
          {% endif %}
        availability: >
          {{ states('binary_sensor.tomorrow_workday_sensor') not in ['unknown', 'unavailable'] and
             states('input_datetime.einschlafzeit_arbeitstag') not in ['unknown', 'unavailable'] and
             states('input_datetime.einschlafzeit_freier_tag') not in ['unknown', 'unavailable'] }}

  - binary_sensor:
      # Netzwerk-Infrastruktur
      - name: "Fritzbox 7590 AX Running"
        unique_id: fritzbox_7590_ax_running
        state: "on"
        device_class: running
        icon: mdi:router-wireless

      - name: "Fritzrepeater 1200 AX Running"
        unique_id: fritzrepeater_1200_ax_running
        state: "on"
        device_class: running
        icon: mdi:wifi-strength-4

      - name: "Fritzrepeater 2400 Running"
        unique_id: fritzrepeater_2400_running
        state: "on"
        device_class: running
        icon: mdi:wifi-strength-4

      # Smart Home Zentrale
      - name: "Synology DS720 Running"
        unique_id: synology_ds720_running
        state: "on"
        device_class: running
        icon: mdi:nas

      - name: "Nuki Bridge Running"
        unique_id: nuki_bridge_running
        state: "on"
        device_class: running
        icon: mdi:bridge

      - name: "HyperHDR Pi Running"
        unique_id: hyperhdr_pi_running
        state: "on"
        device_class: running
        icon: mdi:raspberry-pi

      # Überwachung
      - name: "Camera Schlafzimmer Running"
        unique_id: camera_schlafzimmer_running
        state: "on"
        device_class: running
        icon: mdi:camera

      - name: "Camera Wohnzimmer Running"
        unique_id: camera_wohnzimmer_running
        state: "on"
        device_class: running
        icon: mdi:camera

      # Haushaltsgeräte
      - name: "Wasserspender Running"
        unique_id: wasserspender_running
        state: "on"
        device_class: running
        icon: mdi:water-pump

      - name: "Futterspender Running"
        unique_id: futterspender_running
        state: "on"
        device_class: running
        icon: mdi:bowl-mix

      - name: "Kuehlschrank Running"
        unique_id: kuehlschrank_running
        state: "on"
        device_class: running
        icon: mdi:fridge

      # Zustandsabhängige Geräte
      - name: "Luefter Waschzimmer Active"
        unique_id: luefter_waschzimmer_active
        state: "{{ has_value('input_select.trockner') and is_state('input_select.trockner', 'Arbeitet') }}"
        device_class: running
        icon: mdi:fan
        availability: "{{ states('input_select.trockner') not in ['unknown', 'unavailable'] }}"

      # Mückenlampe reminder fired in the last 7 days, read by the maintenance to-do sync and the dashboard row
      - name: "Mückenlampe Schale leeren"
        unique_id: mueckenlampe_schale_leeren
        icon: mdi:delete-empty-outline
        state: >
          {% set t = state_attr('automation.benachrichtigung_muckenlampe_reinigen', 'last_triggered') %}
          {{ t is not none and now() - t < timedelta(days=7) }}

  # Set when "Benachrichtigung » Luftwäscher kein Wasser" fires (it also cuts the socket, so the socket state
  # cannot tell an empty tank apart), cleared once the Venta draws running power again. Trigger-based, so the
  # state survives restarts. Read by the maintenance to-do sync and the dashboard row
  - triggers:
      - trigger: event
        event_type: automation_triggered
        event_data:
          entity_id: automation.benachrichtigung_luftwascher_kein_wasser
        id: leer
      - trigger: numeric_state
        entity_id: sensor.steckdose_luftwascher_power
        above: input_number.luftwascher_leer_schwelle
        for:
          minutes: 2
        id: laeuft
    binary_sensor:
      - name: "Venta Wasser leer"
        unique_id: venta_wasser_leer
        icon: mdi:water-off-outline
        state: "{{ trigger.id == 'leer' }}"

input_boolean:
  haustur_besucher_inside:
    name: "Besucher ist im Haus"

input_datetime:
  tv_auto_off_time:
    name: "TV Auto-Off Zeitpunkt"
    has_date: true
    has_time: true

  haustur_eingang_zeit:
    name: "Eingangszeit Besucher"
    has_date: true
    has_time: true

  haustur_letzter_eingang:
    name: "Letzter Eingang über Haustür"
    has_date: true
    has_time: true

  party_start_time:
    name: "Party-Modus Startzeit"
    has_date: true
    has_time: true

input_text:
  haustur_besucher_dauer:
    name: "Besuchsdauer"
    initial: ""
    max: 100
