# Export der Live-Config aus .storage/lovelace.lovelace (Storage-Mode).
# Diese Datei wird von HA NICHT geladen, sie dient dem Upload per Raw-Editor.
views:
- theme: Linear
  title: Home
  id: home
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout_options:
    grid-template-columns: 10% 80% 10%
    grid-template-rows: auto
    grid-template-areas: |
      "left middle right"
    mediaquery:
      '(max-width: 1023px)':
        grid-template-columns: 0 100% 0
  badges: []
  cards:
  - type: custom:gap-card
    view_layout:
      grid:area: left
  - type: custom:layout-card
    view_layout:
      grid:area: middle
    layout_type: custom:masonry-layout
    layout:
      max_width: 1000
      width: 300
    cards:
    - type: custom:mushroom-title-card
      alignment: center
      title: |-
        {% set time = now().hour %}
        {% if (time >= 18) %}
         Guten Abend, {{user}}!
        {% elif (time >= 12) %}
         Guten Nachmittag, {{user}}!
        {% elif (time >= 5) %}
         Guten Morgen, {{user}}!
        {% else %}
         Hallo, {{user}}
        {% endif %}
      subtitle: Batzabutza
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: entity
        entity: sensor.temperatur_aussen
      - type: entity
        entity: sensor.what_to_wear_outside
        icon: mdi:tshirt-v
      - type: entity
        entity: person.rafael
        use_entity_picture: true
      - type: entity
        entity: person.alex
        use_entity_picture: true
      - type: entity
        entity: vacuum.s7_maxv
      - type: entity
        entity: sensor.count_lights_on
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
          above: 1200
        chip:
          type: template
          icon: mdi:molecule-co2
          content: '{{states(''sensor.qingping_air_monitor_lite_co2_carbon_dioxide'')}}'
          entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
      - type: conditional
        conditions:
        - entity: switch.sonoff_switch_01
          state: 'on'
        chip:
          type: template
          icon: mdi:heating-coil
          content: Badezimmer
          entity: switch.sonoff_switch_01
      - type: conditional
        conditions:
        - entity: climate.ac
          state: cool
        - entity: climate.ac
          state_not: unavailable
        - entity: climate.ac
          state_not: unknown
        chip:
          type: template
          icon: mdi:tailwind
          content: Klimaanlage
          entity: climate.ac
      - type: conditional
        conditions:
        - entity: switch.sonoff_switch_04
          state: 'on'
        chip:
          type: template
          icon: mdi:heating-coil
          content: Schlafzimmer
          entity: switch.sonoff_switch_04
      - type: conditional
        conditions:
        - entity: switch.sonoff_switch_05
          state: 'on'
        chip:
          type: template
          icon: mdi:heating-coil
          content: Wohnzimmer
          entity: switch.sonoff_switch_05
      - type: conditional
        conditions:
        - entity: switch.sonoff_switch_02
          state: 'on'
        chip:
          type: template
          icon: mdi:heating-coil
          content: Flur
          entity: switch.sonoff_switch_02
      - type: conditional
        conditions:
        - entity: switch.sonoff_switch_03
          state: 'on'
        chip:
          type: template
          icon: mdi:heating-coil
          content: Kinderzimmer
          entity: switch.sonoff_switch_03
      - type: conditional
        conditions:
        - entity: fan.kinderzimmer
          state: 'on'
        - entity: fan.kinderzimmer
          state_not: unavailable
        - entity: fan.kinderzimmer
          state_not: unknown
        chip:
          type: template
          icon: mdi:fan-auto
          content: Ventilator KZ
          entity: fan.kinderzimmer
      - type: conditional
        conditions:
        - entity: fan.schlafzimmer
          state: 'on'
        - entity: fan.schlafzimmer
          state_not: unavailable
        - entity: fan.schlafzimmer
          state_not: unknown
        chip:
          type: template
          icon: mdi:fan-auto
          content: Ventilator SZ
          entity: fan.schlafzimmer
      - type: conditional
        conditions:
        - entity: switch.luefter_badezimmer
          state: 'on'
        chip:
          type: template
          icon: mdi:fan-auto
          content: Badezimmer
          entity: switch.luefter_badezimmer
      - type: conditional
        conditions:
        - entity: fan.zhimi_vb4_bce4_air_purifier
          state: 'on'
        chip:
          type: template
          icon: mdi:fan-auto
          content: Luftreiniger WZ
          entity: fan.zhimi_vb4_bce4_air_purifier
      - type: conditional
        conditions:
        - entity: lock.nuki_wohnungstur_lock
          state: unlocked
        chip:
          type: template
          icon: mdi:door-open
          content: Wohnungstür aufgeschlossen
          entity: lock.nuki_wohnungstur_lock
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_07
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Büro
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_08
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Wohnzimmer
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_06
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Küche
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_02
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Balkon
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_04
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Wohnungstür ist offen!
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_01
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Schlafzimmer
      - type: conditional
        conditions:
        - entity: binary_sensor.aqara_contact_05
          state: 'on'
        chip:
          type: template
          icon: mdi:door-open
          content: Kinderzimmer
      - type: conditional
        conditions:
        - entity: input_select.waschmaschine
          state: Arbeitet
        chip:
          type: template
          icon: mdi:washing-machine
          content: WaMa arbeitet
      - type: conditional
        conditions:
        - entity: input_select.waschmaschine
          state: Fertig
        chip:
          type: template
          icon: mdi:washing-machine
          content: WaMa fertig
      - type: conditional
        conditions:
        - entity: input_select.trockner
          state: Arbeitet
        chip:
          type: template
          icon: mdi:tumble-dryer
          content: Trockner arbeitet
      - type: conditional
        conditions:
        - entity: input_select.trockner
          state: Fertig
        chip:
          type: template
          icon: mdi:tumble-dryer
          content: Trockner fertig
      - type: conditional
        conditions:
        - entity: sensor.192_168_178_118_queue_count
          state_not: unavailable
        - entity: sensor.192_168_178_118_queue_count
          state_not: unknown
        - condition: numeric_state
          entity: sensor.192_168_178_118_queue_count
          above: 0
        chip:
          type: template
          entity: sensor.192_168_178_118_speed
          icon: mdi:download
          content: '{{ states(''sensor.192_168_178_118_speed'') }} MB/s'
  - type: custom:gap-card
    view_layout:
      grid:area: right
  - type: custom:gap-card
    view_layout:
      grid:area: left
  - type: custom:layout-card
    view_layout:
      grid:area: middle
    layout_type: custom:masonry-layout
    layout:
      max_width: 1000
      width: 300
    cards:
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
        grid-auto-flow: row dense
        grid-gap: 16px
      cards:
      - square: false
        columns: 2
        type: grid
        title: Müllabfuhr
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.restmuell
          state_color: true
        - type: custom:mushroom-entity-card
          entity: sensor.bioabfall
          state_color: true
        - type: custom:mushroom-entity-card
          entity: sensor.altpapier
          state_color: true
          icon: mdi:delete-empty
        - type: custom:mushroom-entity-card
          entity: sensor.gelbersack
          state_color: true
          icon: mdi:delete-variant
      - type: grid
        title: Waschmaschine & Trockner
        square: false
        columns: 1
        cards:
        - type: custom:mushroom-template-card
          primary: Waschmaschine
          icon: mdi:washing-machine
          entity: switch.steckdose_waschmaschine
          secondary: '{{ states(''input_select.waschmaschine'') }}{{ '' · Strom an'' if is_state(''switch.steckdose_waschmaschine'',''on'') }}'
          tap_action:
            action: more-info
        - type: custom:mushroom-template-card
          primary: Trockner
          icon: mdi:tumble-dryer
          entity: switch.trockner
          secondary: '{{ states(''input_select.trockner'') }}{{ '' · Strom an'' if is_state(''switch.trockner'',''on'') }}'
          tap_action:
            action: more-info
      - type: vertical-stack
        cards:
        - type: custom:mushroom-title-card
          title: Heizung
        - type: custom:mushroom-template-card
          primary: Heizung Boost
          secondary: '{{ ''Aktiv'' if is_state(''timer.heizung_boost'', ''active'') else ''1,5h Boost starten'' }}'
          icon: mdi:radiator
          tap_action:
            action: perform-action
            perform_action: script.heizung_boost
          layout: horizontal
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:mushroom-entity-card
            entity: switch.sonoff_switch_03
            name: Kinderzimmer
            layout: horizontal
            icon: mdi:heating-coil
          - type: custom:mushroom-entity-card
            entity: switch.sonoff_switch_04
            name: Schlafzimmer
            layout: horizontal
            icon: mdi:heating-coil
          - type: custom:mushroom-entity-card
            entity: switch.sonoff_switch_05
            name: Wohnzimmer
            layout: horizontal
            icon: mdi:heating-coil
          - type: custom:mushroom-entity-card
            entity: switch.sonoff_switch_02
            name: Flur
            layout: horizontal
            icon: mdi:heating-coil
          - type: custom:mushroom-entity-card
            entity: switch.sonoff_switch_01
            name: Badezimmer
            layout: horizontal
            icon: mdi:heating-coil
      - type: grid
        title: Fenster / Türen
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_05
          name: Kinderzimmer
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_04
          name: Haustür
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_02
          name: Balkon
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_06
          name: Küche
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_07
          name: Büro (Alex)
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_01
          name: Schlafzimmer (Bett)
          layout: horizontal
          icon: mdi:door-open
        - type: custom:mushroom-entity-card
          entity: binary_sensor.aqara_contact_08
          name: Fenster
          layout: horizontal
          icon: mdi:door-open
      - type: grid
        title: Steckdosen
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: switch.wohnzimmer_steckdose
          name: TV Wohnzimmer
          layout: horizontal
        - type: custom:mushroom-entity-card
          entity: switch.steckdose_kuechengeraete
          name: Thermomix Licht
          layout: horizontal
        - type: custom:mushroom-entity-card
          entity: switch.aqara_plug_01
          name: Drucker
          layout: horizontal
        - type: custom:mushroom-entity-card
          entity: switch.kuchengerate
          name: Küchengeräte
          layout: horizontal
        - type: custom:mushroom-entity-card
          entity: switch.neo_plug_01
          name: TV Schlafzimmer
        - type: custom:mushroom-entity-card
          entity: switch.steckdose_avr
          name: Balkon Musik
        - type: custom:mushroom-entity-card
          entity: switch.aqara_plug_02
          name: BKK
        - type: custom:mushroom-entity-card
          entity: switch.neo_plug_02
          name: Kinderzimmer
      - type: grid
        title: Rollos
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-cover-card
          entity: cover.aqara_cover_01
          layout: horizontal
          name: Schlafzimmer (Bett)
        - type: custom:mushroom-cover-card
          entity: cover.aqara_cover_03
          layout: horizontal
          name: Büro (Alex)
        - type: custom:mushroom-cover-card
          entity: cover.ikea_cover_01
          layout: horizontal
          name: Badezimmer
        - type: custom:mushroom-cover-card
          entity: cover.aqara_cover_02
          layout: horizontal
          name: Kinderzimmer
        - type: custom:mushroom-cover-card
          entity: cover.rollo_balkon
          layout: horizontal
          name: Balkon
        - type: custom:mushroom-cover-card
          entity: cover.rollo_kueche
          layout: horizontal
          name: Küche
        - type: custom:mushroom-cover-card
          entity: cover.aqara_cover_04
          layout: horizontal
          name: Wohnzimmer
  - type: custom:gap-card
    view_layout:
      grid:area: right
  icon: mdi:home
- title: Licht
  theme: Linear
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout_options:
    grid-template-columns: 10% 80% 10%
    grid-template-rows: auto
    grid-template-areas: |
      "left middle right"
    mediaquery:
      '(max-width: 1023px)':
        grid-template-columns: 0 100% 0
  badges: []
  cards:
  - type: custom:gap-card
    view_layout:
      grid:area: left
  - type: vertical-stack
    view_layout:
      grid:area: middle
    cards:
    - type: custom:mushroom-title-card
      alignment: center
