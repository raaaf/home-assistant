- title: Klima
  path: graphs
  theme: Linear
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout_options:
    grid-template-columns: 10% 80% 10%
    grid-template-rows: auto
    grid-template-areas: |
      "left middle right"
    mediaquery:
      '(max-width: 1023px)':
        grid-template-columns: 0 100% 0
  badges: []
  cards:
  - type: custom:gap-card
    view_layout:
      grid:area: left
  - type: vertical-stack
    view_layout:
      grid:area: middle
    cards:
