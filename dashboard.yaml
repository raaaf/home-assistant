        secondary: '{{ states(''sensor.aqara_climate_02_temperature'') | float(0) | round(1) }} °C · {{ states(''sensor.aqara_climate_02_humidity'') | float(0) | round(0) }} %'
        icon: mdi:shower
    - type: custom:mushroom-title-card
      title: Luftqualität
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
