- type: sections
  title: Prusa MK4
  path: prusa
  icon: mdi:printer-3d
  subview: true
  back_path: /lovelace/zuhause
  theme: Linear
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Printer
      heading_style: title
      icon: mdi:printer-3d-nozzle
    - type: tile
      entity: switch.arbeitszimmer_prusa_mk4_pc_rafael
      name: Turn on printer
      icon: mdi:printer-3d-nozzle-off
      grid_options:
        columns: 12
      tap_action:
        action: toggle
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state:
        - unavailable
        - unknown
    - type: tile
      entity: sensor.prusa_mk4
      name: Status
      icon: mdi:printer-3d-nozzle
      grid_options:
        columns: 12
      state_content:
      - state
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unavailable
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unknown
    - type: picture-entity
      entity: camera.prusa_mk4_preview
      show_name: false
      show_state: false
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state: printing
    - type: tile
      entity: sensor.prusa_mk4_progress
      name: Progress
      icon: mdi:progress-clock
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state: printing
    - type: tile
      entity: sensor.prusa_mk4_print_finish
      name: Done
      icon: mdi:flag-checkered
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state: printing
    - type: tile
      entity: sensor.prusa_mk4_filename
      name: File
      icon: mdi:file-outline
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unavailable
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unknown
    - type: tile
      entity: sensor.prusa_mk4_nozzle_temperature
      name: Nozzle
      icon: mdi:printer-3d-nozzle-heat
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unavailable
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unknown
    - type: tile
      entity: sensor.prusa_mk4_heatbed_temperature
      name: Bed
      icon: mdi:heating-coil
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unavailable
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unknown
    - type: tile
      entity: button.prusa_mk4_pause_job
      name: Pause
      icon: mdi:pause
      grid_options:
        columns: 4
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.prusa_mk4_pause_job
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state: printing
    - type: tile
      entity: button.prusa_mk4_resume_job
      name: Resume
      icon: mdi:play
      grid_options:
        columns: 4
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.prusa_mk4_resume_job
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state: paused
    - type: tile
      entity: button.prusa_mk4_cancel_job
      name: Cancel
      icon: mdi:stop
      grid_options:
        columns: 4
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.prusa_mk4_cancel_job
        confirmation:
          text: Really cancel the print?
      visibility:
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unavailable
      - condition: state
        entity: sensor.prusa_mk4
        state_not: unknown
      - condition: state
        entity: sensor.prusa_mk4
        state_not: idle
      - condition: state
        entity: sensor.prusa_mk4
        state_not: finished
  - type: grid
    cards:
    - type: heading
      heading: Power & protection
      heading_style: title
      icon: mdi:power-plug
    - type: tile
      entity: switch.arbeitszimmer_prusa_mk4_pc_rafael
      name: Socket
      grid_options:
        columns: 6
      tap_action:
        action: toggle
    - type: tile
      entity: sensor.arbeitszimmer_prusa_mk4_power
      name: Power
      icon: mdi:flash
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.arbeitszimmer_prusa_mk4_overheating
      name: Overheating
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.arbeitszimmer_prusa_mk4_overpowering
      name: Overload
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.arbeitszimmer_prusa_mk4_energy
      name: Energy total
      icon: mdi:lightning-bolt
      grid_options:
        columns: 6
    - type: tile
      entity: button.arbeitszimmer_prusa_mk4_restart
      name: Restart socket
      icon: mdi:restart
      grid_options:
        columns: 6
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.arbeitszimmer_prusa_mk4_restart
        confirmation:
          text: Restart the socket?
