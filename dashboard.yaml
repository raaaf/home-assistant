        icon: mdi:molecule
        tap_action:
          action: more-info
    - type: custom:mushroom-title-card
      title: Steuerung
    - type: grid
      columns: 2
      square: false
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: climate.ac
          state:
          - 'off'
          - cool
          - heat
          - heat_cool
          - auto
          - dry
          - fan_only
        card:
          type: custom:mushroom-climate-card
          entity: climate.ac
          name: Klimaanlage
          show_temperature_control: true
          collapsible_controls: true
      - type: custom:mushroom-fan-card
