      - type: conditional
        conditions:
        - entity: light.alle_waschzimmer_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_waschzimmer_lichter
          content_info: name
          name: Wasch
    - type: custom:mushroom-title-card
      title: Szenen
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout_options:
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr))
        grid-gap: 8px
      cards:
      - type: custom:mushroom-entity-card
        entity: input_boolean.baden
        name: Baden
        layout: horizontal
        icon: mdi:bathtub
      - type: custom:mushroom-entity-card
        entity: input_boolean.kochen
        name: Kochen
        layout: horizontal
        icon: mdi:pot-steam
      - type: custom:mushroom-entity-card
        entity: input_boolean.sauna
        name: Sauna
        layout: horizontal
        icon: mdi:radiator
      - type: custom:mushroom-entity-card
        entity: input_boolean.schlafenszeit
        name: Schlafenszeit
        layout: horizontal
        icon: mdi:bed
      - type: custom:mushroom-entity-card
        entity: input_boolean.arbeit
        name: Arbeit
        layout: horizontal
        icon: mdi:briefcase
      - type: custom:mushroom-entity-card
        entity: input_boolean.gaming
        name: Gaming
        layout: horizontal
        icon: mdi:controller-classic
      - type: custom:mushroom-entity-card
        entity: input_boolean.movie
        name: Film
        layout: horizontal
        icon: mdi:movie-open
      - type: custom:mushroom-entity-card
        entity: input_boolean.party
        name: Party
        layout: horizontal
        icon: mdi:party-popper
      - type: custom:mushroom-entity-card
        entity: input_boolean.party_wohnzimmer
        name: Party WZ
        layout: horizontal
        icon: mdi:party-popper
      - type: custom:mushroom-entity-card
        entity: input_boolean.essen
        name: Essen
        layout: horizontal
        icon: mdi:silverware-fork-knife
      - type: custom:mushroom-entity-card
        entity: input_boolean.es_ist_dunkel
        name: Dunkel
        layout: horizontal
        icon: mdi:weather-night
      - type: custom:mushroom-entity-card
