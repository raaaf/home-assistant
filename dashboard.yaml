            }
      - type: custom:mushroom-light-card
        entity: light.alle_flur_lichter
        name: Flur
        icon: mdi:coat-rack
        show_brightness_control: true
        use_light_color: false
        collapsible_controls: true
        tap_action:
          action: toggle
        hold_action:
          action: navigate
          navigation_path: /lovelace/licht-flur
        card_mod:
          style: |
