# Export der Live-Config aus .storage/lovelace.lovelace (Storage-Mode).
# Diese Datei wird von HA NICHT geladen, sie dient dem Upload per Raw-Editor.
views:
- type: sections
  title: Zuhause
  path: zuhause
  icon: mdi:home
  theme: Linear
  max_columns: 2
  badges:
  - type: entity
    entity: person.rafael
    show_name: false
    show_entity_picture: true
  - type: entity
    entity: person.alex
    show_name: false
    show_entity_picture: true
  - type: entity
    entity: sensor.temperatur_aussen
    name: Außen
    show_name: false
    color: grey
  - type: entity
    entity: sensor.what_to_wear_outside
    icon: mdi:tshirt-v
    show_name: false
    color: grey
  - type: entity
    entity: sensor.count_lights_on
    icon: mdi:lightbulb-group
    show_name: false
    tap_action:
      action: navigate
      navigation_path: /lovelace/licht
    visibility:
    - condition: numeric_state
      entity: sensor.count_lights_on
      above: 0
  - type: entity
    entity: lock.nuki_wohnungstur_lock
    name: Wohnungstür offen
    show_name: true
    show_state: false
    color: amber
    visibility:
    - condition: state
      entity: lock.nuki_wohnungstur_lock
      state: unlocked
  - type: entity
    entity: binary_sensor.fenster_tueren
    name: Fenster offen
    show_name: true
    show_state: false
    color: amber
    visibility:
    - condition: state
      entity: binary_sensor.fenster_tueren
      state: 'on'
  - type: entity
    entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
    name: CO2
    icon: mdi:molecule-co2
    color: amber
    visibility:
    - condition: numeric_state
      entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
      above: 999
      below: 2000
  - type: entity
    entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
    name: CO2
    icon: mdi:molecule-co2
    color: red
    visibility:
    - condition: numeric_state
      entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
      above: 1999
  - type: entity
    entity: switch.sonoff_switch_05
    name: Heizung Wohnzimmer
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_05
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_04
    name: Heizung Schlafzimmer
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_04
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_03
    name: Heizung Kinderzimmer
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_03
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_02
    name: Heizung Flur
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_02
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_01
    name: Heizung Badezimmer
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_01
      state: 'on'
  - type: entity
    entity: input_select.waschmaschine
    name: Waschmaschine
    icon: mdi:washing-machine
    visibility:
    - condition: state
      entity: input_select.waschmaschine
      state: Fertig
    color: amber
  - type: entity
    entity: input_select.trockner
    name: Trockner
    icon: mdi:tumble-dryer
    visibility:
    - condition: state
      entity: input_select.trockner
      state: Fertig
    color: amber
  - type: entity
    entity: vacuum.s7_maxv
    name: Robbi
    visibility:
    - condition: state
      entity: vacuum.s7_maxv
      state: cleaning
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Zu erledigen
      heading_style: title
      icon: mdi:clipboard-check-outline
      badges:
      - type: entity
        entity: todo.wartung
        name: offen
        icon: mdi:format-list-checks
        tap_action:
          action: navigate
          navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Wasser in der Küche
      secondary: Wassermelder hat ausgelöst. Sofort nachsehen.
      icon: mdi:water-alert
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: binary_sensor.kuche_wasser_sensor
        state: 'on'
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Robbi
      secondary: '{% set ns = namespace(l=[]) %}{% set h = states(''sensor.s7_maxv_main_brush_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Hauptbürste'' ~ ('' überfällig'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_side_brush_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Seitenbürste'' ~ ('' überfällig'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_filter_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Filter'' ~ ('' überfällig'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_sensor_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Sensoren'' ~ ('' überfällig'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{{ ns.l | join('' · '') }}'
      icon: mdi:robot-vacuum
      icon_color: '{{ ''red'' if states(''sensor.s7_maxv_main_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_side_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_filter_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_sensor_time_left'') | float(999) < 0 else ''amber'' }}'
      color: '{{ ''red'' if states(''sensor.s7_maxv_main_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_side_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_filter_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_sensor_time_left'') | float(999) < 0 else ''amber'' }}'
      grid_options:
        columns: 12
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.s7_maxv_main_brush_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_side_brush_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_filter_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_sensor_time_left
          below: 10
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Robbi meldet einen Fehler
      secondary: '{{ states(''sensor.s7_maxv_vacuum_error'') }}'
      icon: mdi:robot-vacuum-alert
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: none
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: None
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: unknown
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: unavailable
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: ''
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Wasserspender-Filter
      secondary: '{% set d = states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | int(0) %}{{ ''jetzt wechseln'' if d <= 0 else ''in '' ~ d ~ '' Tagen wechseln'' }}'
      icon: mdi:water-pump
      icon_color: '{{ ''red'' if states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | float(0) <= 0 else ''amber'' }}'
      color: '{{ ''red'' if states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | float(0) <= 0 else ''amber'' }}'
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.mmgg_wi11_7a1c_filter_left_time_2
        below: 7.01
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Luftreiniger-Filter
      secondary: noch {{ states('sensor.zhimi_vb4_bce4_filter_life_level') | int(0) }} %, Ersatz bestellen
      icon: mdi:air-filter
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.zhimi_vb4_bce4_filter_life_level
        below: 10
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Batterien
      secondary: '{{ state_attr(''sensor.batterien_niedrig'',''geraete'') }}'
      icon: mdi:battery-alert-variant-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.batterien_niedrig
        above: 0
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Restmüll rausstellen
      secondary: Abholung {{ states('sensor.restmuell') | lower }}
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.restmuell
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Biotonne rausstellen
      secondary: Abholung {{ states('sensor.bioabfall') | lower }}
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.bioabfall
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Altpapier rausstellen
      secondary: Abholung {{ states('sensor.altpapier') | lower }}
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.altpapier
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Gelben Sack rausstellen
      secondary: Abholung {{ states('sensor.gelbersack') | lower }}
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.gelbersack
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Nichts zu tun
      secondary: Alles aufgefüllt und gewartet.
      icon: mdi:check-circle-outline
      icon_color: green
      color: green
      grid_options:
        columns: 12
      visibility:
      - condition: not
        conditions:
        - condition: or
          conditions:
          - condition: and
            conditions:
            - condition: state
              entity: binary_sensor.kuche_wasser_sensor
              state: 'on'
          - condition: and
            conditions:
            - condition: or
              conditions:
              - condition: numeric_state
                entity: sensor.s7_maxv_main_brush_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_side_brush_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_filter_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_sensor_time_left
                below: 10
          - condition: and
            conditions:
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: none
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: None
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: unknown
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: unavailable
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: ''
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.mmgg_wi11_7a1c_filter_left_time_2
              below: 7.01
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.zhimi_vb4_bce4_filter_life_level
              below: 10
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.batterien_niedrig
              above: 0
          - condition: and
            conditions:
            - condition: state
              entity: sensor.restmuell
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.bioabfall
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.altpapier
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.gelbersack
              state:
              - Morgen
              - Heute
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.wartung
  - type: grid
    cards:
    - type: heading
      heading: Empfehlungen
      heading_style: title
      icon: mdi:heart-pulse
    - type: custom:mushroom-template-card
      primary: Jetzt lüften
      secondary: CO2 {{ (states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide') | float(0) | round(0)) | string | replace('.',',') }} ppm · 10 Min. querlüften
      icon: mdi:window-open-variant
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
        above: 1999
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Bald lüften
      secondary: CO2 {{ (states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide') | float(0) | round(0)) | string | replace('.',',') }} ppm · Ziel unter 1000 · stoßlüften
      icon: mdi:window-open-variant
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
        above: 999
        below: 2000
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Wohnzimmer zu warm
      secondary: '{{ (states(''sensor.wohnzimmer_temperatur'') | float(0) | round(1)) | string | replace(''.'','','') }} °C · Ziel 20–23 · kurz lüften'
      icon: mdi:thermometer-high
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.wohnzimmer_temperatur
        above: 23
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Wohnzimmer zu kühl
      secondary: '{{ (states(''sensor.wohnzimmer_temperatur'') | float(0) | round(1)) | string | replace(''.'','','') }} °C · Ziel 20–23 · heizen'
      icon: mdi:thermometer-low
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.wohnzimmer_temperatur
        below: 20
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Wohnzimmer zu feucht
      secondary: '{{ (states(''sensor.wohnzimmer_luftfeuchtigkeit'') | float(0) | round(0)) | string | replace(''.'','','') }} % · Schimmelrisiko ab 60 · lüften'
