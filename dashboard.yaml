        collapsible_controls: true
        tap_action:
          action: toggle
        hold_action:
          action: navigate
          navigation_path: /lovelace/licht-wohnzimmer
        card_mod:
          style: |
            ha-card mushroom-shape-icon {
              {% if is_state(config.entity, 'on') %}--icon-color: #ff6b35 !important;{% endif %}
            }
