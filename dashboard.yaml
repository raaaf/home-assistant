# Export of the live config from .storage/lovelace.lovelace (storage mode).
# HA does NOT load this file; it is for upload via the raw configuration editor.
views:
- type: sections
  title: Home
  path: zuhause
  icon: mdi:home
  theme: Linear
  max_columns: 2
  badges:
  - type: entity
    entity: person.rafael
    show_name: false
    show_entity_picture: true
  - type: entity
    entity: person.alex
    show_name: false
    show_entity_picture: true
  - type: entity
    entity: sensor.temperatur_aussen
    name: Outside
    show_name: false
    color: grey
  - type: entity
    entity: sensor.what_to_wear_outside
    icon: mdi:tshirt-v
    show_name: false
    color: grey
  - type: entity
    entity: sensor.count_lights_on
    icon: mdi:lightbulb-group
    show_name: false
    tap_action:
      action: navigate
      navigation_path: /lovelace/licht
    visibility:
    - condition: numeric_state
      entity: sensor.count_lights_on
      above: 0
  - type: entity
    entity: lock.nuki_wohnungstur_lock
    name: Apartment door open
    show_name: true
    show_state: false
    color: amber
    visibility:
    - condition: state
      entity: lock.nuki_wohnungstur_lock
      state: unlocked
  - type: entity
    entity: binary_sensor.fenster_tueren
    name: Window open
    show_name: true
    show_state: false
    color: amber
    visibility:
    - condition: state
      entity: binary_sensor.fenster_tueren
      state: 'on'
  - type: entity
    entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
    name: CO2
    icon: mdi:molecule-co2
    color: red
    visibility:
    - condition: numeric_state
      entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
      above: 1200
  - type: entity
    entity: switch.sonoff_switch_05
    name: Heating living room
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_05
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_04
    name: Heating bedroom
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_04
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_03
    name: Heating kids' room
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_03
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_02
    name: Heating hallway
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_02
      state: 'on'
  - type: entity
    entity: switch.sonoff_switch_01
    name: Heating bathroom
    icon: mdi:radiator
    visibility:
    - condition: state
      entity: switch.sonoff_switch_01
      state: 'on'
  - type: entity
    entity: input_select.waschmaschine
    name: Washer
    icon: mdi:washing-machine
    visibility:
    - condition: state
      entity: input_select.waschmaschine
      state: Fertig
    color: amber
  - type: entity
    entity: input_select.trockner
    name: Dryer
    icon: mdi:tumble-dryer
    visibility:
    - condition: state
      entity: input_select.trockner
      state: Fertig
    color: amber
  - type: entity
    entity: vacuum.s7_maxv
    name: Robbi
    visibility:
    - condition: state
      entity: vacuum.s7_maxv
      state: cleaning
  sections:
  - type: grid
    cards:
    - type: heading
      heading: To do
      heading_style: title
      icon: mdi:clipboard-check-outline
      badges:
      - type: entity
        entity: todo.wartung
        name: open
        icon: mdi:format-list-checks
        tap_action:
          action: navigate
          navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Water in the kitchen
      secondary: Leak sensor triggered. Check now.
      icon: mdi:water-alert
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - - condition: state
          entity: binary_sensor.kuche_wasser_sensor
          state: 'on'
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Robbi
      secondary: '{% set ns = namespace(l=[]) %}{% set h = states(''sensor.s7_maxv_main_brush_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Main brush'' ~ ('' overdue'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_side_brush_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Side brush'' ~ ('' overdue'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_filter_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Filter'' ~ ('' overdue'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{% set h = states(''sensor.s7_maxv_sensor_time_left'') | float(999) %}{% if h < 10 %}{% set ns.l = ns.l + [''Sensors'' ~ ('' overdue'' if h < 0 else '' in '' ~ h | int ~ '' h'')] %}{% endif %}{{ ns.l | join('' · '') }}'
      icon: mdi:robot-vacuum
      icon_color: '{{ ''red'' if states(''sensor.s7_maxv_main_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_side_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_filter_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_sensor_time_left'') | float(999) < 0 else ''amber'' }}'
      color: '{{ ''red'' if states(''sensor.s7_maxv_main_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_side_brush_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_filter_time_left'') | float(999) < 0 or states(''sensor.s7_maxv_sensor_time_left'') | float(999) < 0 else ''amber'' }}'
      grid_options:
        columns: 12
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.s7_maxv_main_brush_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_side_brush_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_filter_time_left
          below: 10
        - condition: numeric_state
          entity: sensor.s7_maxv_sensor_time_left
          below: 10
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Robbi reports an error
      secondary: '{{ states(''sensor.s7_maxv_vacuum_error'') }}'
      icon: mdi:robot-vacuum-alert
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: none
      - condition: state
        entity: sensor.s7_maxv_vacuum_error
        state_not: unavailable
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Water dispenser filter
      secondary: '{% set d = states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | int(0) %}{{ ''replace now'' if d <= 0 else ''replace in '' ~ d ~ '' days'' }}'
      icon: mdi:water-pump
      icon_color: '{{ ''red'' if states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | float(0) <= 0 else ''amber'' }}'
      color: '{{ ''red'' if states(''sensor.mmgg_wi11_7a1c_filter_left_time_2'') | float(0) <= 0 else ''amber'' }}'
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.mmgg_wi11_7a1c_filter_left_time_2
        below: 7.01
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Air purifier filter
      secondary: '{{ states(''sensor.zhimi_vb4_bce4_filter_life_level'') | int(0) }} % left, order a replacement'
      icon: mdi:air-filter
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.zhimi_vb4_bce4_filter_life_level
        below: 10
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Batteries
      secondary: '{{ state_attr(''sensor.batterien_niedrig'',''geraete'') }}'
      icon: mdi:battery-alert-variant-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.batterien_niedrig
        above: 0
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Put out the waste
      secondary: '{% set s = states(''sensor.restmuell'') %}{{ ''Pickup '' ~ (''today'' if s == ''Heute'' else ''tomorrow'' if s == ''Morgen'' else s | replace(''in '',''in '') | replace('' Tagen'','' days'')) }}'
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.restmuell
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Put out the organic bin
      secondary: '{% set s = states(''sensor.bioabfall'') %}{{ ''Pickup '' ~ (''today'' if s == ''Heute'' else ''tomorrow'' if s == ''Morgen'' else s | replace(''in '',''in '') | replace('' Tagen'','' days'')) }}'
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.bioabfall
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Put out the paper
      secondary: '{% set s = states(''sensor.altpapier'') %}{{ ''Pickup '' ~ (''today'' if s == ''Heute'' else ''tomorrow'' if s == ''Morgen'' else s | replace(''in '',''in '') | replace('' Tagen'','' days'')) }}'
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.altpapier
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Put out the recycling
      secondary: '{% set s = states(''sensor.gelbersack'') %}{{ ''Pickup '' ~ (''today'' if s == ''Heute'' else ''tomorrow'' if s == ''Morgen'' else s | replace(''in '',''in '') | replace('' Tagen'','' days'')) }}'
      icon: mdi:trash-can-outline
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.gelbersack
        state:
        - Morgen
        - Heute
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
    - type: custom:mushroom-template-card
      primary: Nothing to do
      secondary: Everything is stocked and serviced.
      icon: mdi:check-circle-outline
      icon_color: green
      color: green
      grid_options:
        columns: 12
      visibility:
      - condition: not
        conditions:
        - condition: or
          conditions:
          - condition: and
            conditions:
            - - condition: state
                entity: binary_sensor.kuche_wasser_sensor
                state: 'on'
          - condition: and
            conditions:
            - condition: or
              conditions:
              - condition: numeric_state
                entity: sensor.s7_maxv_main_brush_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_side_brush_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_filter_time_left
                below: 10
              - condition: numeric_state
                entity: sensor.s7_maxv_sensor_time_left
                below: 10
          - condition: and
            conditions:
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: none
            - condition: state
              entity: sensor.s7_maxv_vacuum_error
              state_not: unavailable
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.mmgg_wi11_7a1c_filter_left_time_2
              below: 7.01
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.zhimi_vb4_bce4_filter_life_level
              below: 10
          - condition: and
            conditions:
            - condition: numeric_state
              entity: sensor.batterien_niedrig
              above: 0
          - condition: and
            conditions:
            - condition: state
              entity: sensor.restmuell
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.bioabfall
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.altpapier
              state:
              - Morgen
              - Heute
          - condition: and
            conditions:
            - condition: state
              entity: sensor.gelbersack
              state:
              - Morgen
              - Heute
      tap_action:
        action: navigate
        navigation_path: /lovelace/todo?entity_id=todo.wartung
  - type: grid
    cards:
    - type: heading
      heading: Recommendations
      heading_style: title
      icon: mdi:heart-pulse
    - type: custom:mushroom-template-card
      primary: Air out now
      secondary: CO2 {{ (states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide') | float(0) | round(0)) }} ppm · cross-ventilate 10 min
      icon: mdi:window-open-variant
      icon_color: red
      color: red
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
        above: 1999
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Air out soon
      secondary: CO2 {{ (states('sensor.qingping_air_monitor_lite_co2_carbon_dioxide') | float(0) | round(0)) }} ppm · target below 1000 · air out
      icon: mdi:window-open-variant
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.qingping_air_monitor_lite_co2_carbon_dioxide
        above: 999
        below: 2000
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: Living room too warm
      secondary: '{{ (states(''sensor.wohnzimmer_temperatur'') | float(0) | round(1)) }} °C · target 20–23 · air out briefly'
      icon: mdi:thermometer-high
      icon_color: amber
      color: amber
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.wohnzimmer_temperatur
        above: 23
      tap_action:
        action: none
    - type: custom:mushroom-template-card
