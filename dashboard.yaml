        secondary: '{{ states(''sensor.qingping_air_monitor_lite_co2_carbon_dioxide'') | float(0) | round(0) }} ppm'
        icon: mdi:molecule-co2
        tap_action:
          action: more-info
        card_mod:
          style: |
            {% set v = states(config.entity) | float(0) %}{% set c = '249,112,102' if v >= 1400 else ('250,184,77' if v >= 1000 else '') %}{% if c %}ha-card ha-tile-icon { --tile-icon-color: rgb({{ c }}) !important; }
            ha-card ha-tile-icon ha-state-icon { color: rgb({{ c }}) !important; }{% endif %}
      - type: custom:mushroom-template-card
        entity: sensor.pm2_5_gesamt
        primary: PM2.5
        secondary: '{{ states(''sensor.pm2_5_gesamt'') | float(0) | round(1) }} µg/m³'
        icon: mdi:air-filter
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.pm10_gesamt
        primary: PM10
        secondary: '{{ states(''sensor.pm10_gesamt'') | float(0) | round(1) }} µg/m³'
        icon: mdi:grain
