          content_info: name
          name: Küche
      - type: conditional
        conditions:
        - entity: light.alle_schlafzimmer_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_schlafzimmer_lichter
          content_info: name
          name: Büro Alex
      - type: conditional
        conditions:
        - entity: light.alle_arbeitszimmer_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_arbeitszimmer_lichter
          content_info: name
          name: Schlafzimmer
      - type: conditional
        conditions:
        - entity: light.alle_kinderzimmer_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_kinderzimmer_lichter
          content_info: name
          name: Kinderzimmer
      - type: conditional
        conditions:
        - entity: light.alle_badezimmer_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_badezimmer_lichter
          content_info: name
          name: Bad
      - type: conditional
        conditions:
        - entity: light.alle_flur_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_flur_lichter
          content_info: name
          name: Flur
      - type: conditional
        conditions:
        - entity: light.alle_balkon_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_balkon_lichter
          content_info: name
          name: Balkon
      - type: conditional
        conditions:
        - entity: light.alle_ankleide_lichter
          state: 'on'
        chip:
          type: entity
          entity: light.alle_ankleide_lichter
          content_info: name
