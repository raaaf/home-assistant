fade_volume:
  alias: Fade Volume
  mode: parallel
  max: 20
  fields:
    target_player:
      name: Target media player
      description: Target media player of volume fade.
      required: true
      example: media_player.wohnzimmer_homepod
      selector:
        entity:
          domain: media_player
    target_volume:
      name: Target volume
      description: Volume the media play will be at the end of the fade duration.
      required: true
      default: 0.5
      example: '0.5'
      selector:
        number:
          max: 1
          min: 0
          step: 0.01
          mode: slider
    duration:
      name: Fade duration
      description: Length of time in seconds the fade should take.
      required: true
      default: 5
      example: '5'
      selector:
        number:
          mode: box
          min: 0
          max: 100000
          unit_of_measurement: s
    curve:
      name: Fade curve algorithm
      description: Shape of the fade curve to apply.
      required: true
      default: logarithmic
      example: logarithmic
      selector:
        select:
          options:
          - logarithmic
          - bezier
          - linear
  variables:
    min_step_size: 0.01
    start_volume: >-
      {% set current = state_attr(target_player, 'volume_level') | float(0) %}
      {{ [current, 0] | max }}
    volume_diff: '{{ (target_volume | float(0)) - (start_volume | float(0)) }}'
    volume_based_steps: '{{ ((volume_diff | float(0) | abs) / min_step_size) | int(1) }}'
    time_based_steps: '{{ [duration / 30, 10] | max | int }}'
    total_steps: '{{ [[volume_based_steps, time_based_steps] | min, 1] | max }}'
  sequence:
  - alias: "Prüfe ob Player verfügbar ist"
    condition: template
    value_template: >-
      {{ states(target_player) not in ['unavailable', 'unknown'] }}
  - if:
    - condition: template
      value_template: '{{ (start_volume | float(0)) < 0.01 and (volume_diff | float(0)) > 0 }}'
    then:
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: '{{ target_player }}'
      data:
        volume_level: 0
    - delay: '00:00:00.5'
  - repeat:
      while:
      - condition: template
        value_template: >-
          {{ repeat.index <= total_steps and
             states(target_player) not in ['unavailable', 'unknown'] }}
      sequence:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: '{{ target_player }}'
        data:
          volume_level: >-
            {% set sv = start_volume | float(0) %}
            {% set vd = volume_diff | float(0) %}
            {% set progress = repeat.index / total_steps %}
            {% if progress >= 1 %}
              {{ target_volume }}
            {% elif curve == 'logarithmic' %}
              {% set log_value = (progress * progress * progress) %}
              {{ (sv + log_value * vd) | round(3) }}
            {% elif curve == 'bezier' %}
              {% set bezier_value = progress * progress * (3 - 2 * progress) %}
              {{ (sv + bezier_value * vd) | round(3) }}
            {% else %}
              {{ (sv + progress * vd) | round(3) }}
            {% endif %}
      - delay:
          milliseconds: '{{ ((duration * 1000) / total_steps) | int }}'
  - action: media_player.volume_set
    continue_on_error: true
    target:
      entity_id: '{{ target_player }}'
    data:
      volume_level: '{{ target_volume }}'
  - action: system_log.write
    data:
      message: 'Fade completed: {{ target_player }}  from {{ start_volume }} to {{
        target_volume }}  in {{ duration }}s using {{ curve }} curve

        '
      level: debug
  icon: mdi:tune-vertical
  description: Smooth volume fading with multiple curve options
scene_enable_adaptive_lighting:
  alias: 'Szene » Adaptive Beleuchtung aktivieren'
  description: Aktiviert adaptive Beleuchtung für einen Raum mit Konflikt-Prüfung
  icon: mdi:lightbulb-auto
  mode: parallel
  max: 10
  fields:
    room:
      description: Raumname (arbeitszimmer, wohnzimmer, schlafzimmer, etc.)
      example: wohnzimmer
      required: true
      selector:
        text:
    exclude_scenes:
      description: Liste der Szenen, die NICHT aktiv sein dürfen (optional)
      example: "movie,party,cooking"
      required: false
      default: ""
      selector:
        text:
  sequence:
  - variables:
      switch_entity: "switch.adaptive_lighting_{{ room }}"
      scenes_to_check: "{{ exclude_scenes.split(',') if exclude_scenes else [] }}"
  - alias: Prüfe ob Switch existiert
    if:
    - condition: template
      value_template: "{{ has_value(switch_entity) }}"
    then: []
    else:
    - action: system_log.write
      data:
        message: "⚠️ Adaptive lighting switch {{ switch_entity }} does not exist for room {{ room }}"
        level: warning
    - stop: "Switch entity does not exist"
  - alias: Prüfe Szenen-Konflikte
    if:
    - condition: template
      value_template: >
        {% set conflicts = namespace(found=false) %}
        {% for scene in scenes_to_check %}
          {% set scene_entity = 'input_boolean.' ~ scene.strip() %}
          {% if has_value(scene_entity) and is_state(scene_entity, 'on') %}
            {% set conflicts.found = true %}
          {% endif %}
        {% endfor %}
        {{ not conflicts.found }}
    then:
    - action: switch.turn_on
      target:
        entity_id: "{{ switch_entity }}"
    - action: logbook.log
      data:
        name: "Adaptive Beleuchtung"
        message: "Adaptive Beleuchtung {{ room }} aktiviert"
        domain: script
scene_disable_adaptive_lighting:
  alias: 'Szene » Adaptive Beleuchtung deaktivieren'
  description: Deaktiviert adaptive Beleuchtung für einen Raum
  icon: mdi:lightbulb-off
  mode: parallel
  max: 10
  fields:
    room:
      description: Raumname (arbeitszimmer, wohnzimmer, schlafzimmer, etc.)
      example: wohnzimmer
      required: true
      selector:
        text:
  sequence:
  - variables:
      switch_entity: "switch.adaptive_lighting_{{ room }}"
  - alias: Prüfe ob Switch existiert
    if:
    - condition: template
      value_template: "{{ has_value(switch_entity) }}"
    then:
    - action: switch.turn_off
      target:
        entity_id: "{{ switch_entity }}"
    else:
    - action: system_log.write
      data:
        message: "⚠️ Adaptive lighting switch {{ switch_entity }} does not exist for room {{ room }}"
        level: warning
    - stop: "Switch entity does not exist"
scene_enable_motion_automations:
  alias: 'Szene » Motion-Automationen aktivieren'
  description: Aktiviert Motion-Automationen für einen Raum mit Konflikt-Prüfung
  icon: mdi:motion-sensor
  mode: parallel
  max: 10
  fields:
    automations:
      description: Liste der Automation-Entity-IDs (komma-getrennt)
      example: "automation.motion_wohnzimmer,automation.motion_esstisch"
      required: true
      selector:
        text:
    exclude_scenes:
      description: Liste der Szenen, die NICHT aktiv sein dürfen (optional)
      example: "movie,party,cooking"
      required: false
      default: ""
      selector:
        text:
    exclude_players:
      description: >-
        Media-Player, die NICHT spielen duerfen (optional). exclude_scenes prueft nur
        input_booleans; Geraete-Gates wie der laufende AppleTV brauchen dieses Feld,
        sonst muss jede Aufrufstelle die Bedingung selbst nachbauen.
      example: "media_player.appletv"
      required: false
      default: ""
      selector:
        text:
  sequence:
  - variables:
      automation_list: "{{ automations.split(',') }}"
      scenes_to_check: "{{ exclude_scenes.split(',') if exclude_scenes else [] }}"
      players_to_check: "{{ exclude_players.split(',') if exclude_players else [] }}"
  - alias: Prüfe Szenen- und Geraete-Konflikte
    if:
    - condition: template
      value_template: >
        {% set conflicts = namespace(found=false) %}
        {% for scene in scenes_to_check %}
          {% set scene_entity = 'input_boolean.' ~ scene.strip() %}
          {% if has_value(scene_entity) and is_state(scene_entity, 'on') %}
            {% set conflicts.found = true %}
          {% endif %}
        {% endfor %}
        {% for player in players_to_check %}
          {% if is_state(player.strip(), 'playing') %}
            {% set conflicts.found = true %}
          {% endif %}
        {% endfor %}
        {{ not conflicts.found }}
    then:
    - repeat:
        for_each: "{{ automation_list }}"
        sequence:
        - alias: Aktiviere Automation wenn sie existiert
          if:
          - condition: template
            value_template: "{{ has_value(repeat.item.strip()) }}"
          then:
          - action: automation.turn_on
            target:
              entity_id: "{{ repeat.item.strip() }}"
          else:
          - action: system_log.write
            data:
              message: "⚠️ Motion automation {{ repeat.item.strip() }} does not exist"
              level: warning
    - action: logbook.log
      data:
        name: "Motion Automationen"
        message: "Motion-Automationen aktiviert: {{ automations }}"
        domain: script
scene_disable_motion_automations:
  alias: 'Szene » Motion-Automationen deaktivieren'
  description: Deaktiviert Motion-Automationen für einen Raum
  icon: mdi:motion-sensor-off
  mode: parallel
  max: 10
  fields:
    automations:
      description: Liste der Automation-Entity-IDs (komma-getrennt)
      example: "automation.motion_wohnzimmer,automation.motion_esstisch"
      required: true
      selector:
        text:
  sequence:
  - variables:
      automation_list: "{{ automations.split(',') }}"
  - repeat:
      for_each: "{{ automation_list }}"
      sequence:
      - alias: Deaktiviere Automation wenn sie existiert
        if:
        - condition: template
          value_template: "{{ has_value(repeat.item.strip()) }}"
        then:
        - action: automation.turn_off
          target:
            entity_id: "{{ repeat.item.strip() }}"
          data:
            stop_actions: true
        else:
        - action: system_log.write
          data:
            message: "⚠️ Motion automation {{ repeat.item.strip() }} does not exist"
            level: warning
reload_media_players:
  alias: Reload Media Players
  description: Aktualisiert den Status aller Media Player
  icon: mdi:refresh
  mode: single
  sequence:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - media_player.appletv
      - media_player.wohnzimmer
      - media_player.denon_avr_x3200w
      - media_player.arbeitszimmer
      - media_player.schlafzimmer
      - media_player.homepod_badezimmer
      - media_player.homepod_kinderzimmer
      - media_player.homepod_wohnzimmer
      - media_player.kuche

heizung_boost:
  alias: Heizung Boost
  description: Toggle für manuellen 1,5h Heizungsboost mit Verifikation
  icon: mdi:radiator
  mode: single
  sequence:
  - variables:
      heating_switches:
      - switch.sonoff_switch_03
      - switch.sonoff_switch_04
      - switch.sonoff_switch_05
  - if:
    - condition: state
      entity_id: timer.heizung_boost
      state: active
    then:
    - action: timer.cancel
      target:
        entity_id: timer.heizung_boost
    - action: script.turn_off_with_retry
      data:
        target_entities: "{{ heating_switches }}"
        retry_delay: 3
        max_retries: 1
    - action: logbook.log
      data:
        name: Heizung Boost
        message: "Boost manuell gestoppt"
        domain: climate
    else:
    - action: switch.turn_on
      target:
        entity_id: "{{ heating_switches }}"
    - action: timer.start
      target:
        entity_id: timer.heizung_boost
    - action: logbook.log
      data:
        name: Heizung Boost
        message: "1,5h Boost gestartet"
        domain: climate

turn_on_with_retry:
  alias: "Gerät einschalten mit Retry"
  description: >-
    Schaltet ein Gerät ein und wiederholt den Versuch falls es nicht reagiert.
    Funktioniert mit allen Domains (switch, humidifier, fan, etc.).
  icon: mdi:replay
  mode: parallel
  max: 10
  fields:
    target_entity:
      description: Entity ID des Geräts
      example: switch.steckdose_luftwascher
      required: true
      selector:
        entity:
    retry_delay:
      description: Wartezeit zwischen Versuchen in Sekunden
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: s
    max_retries:
      description: Maximale Anzahl Wiederholungen
      default: 1
      selector:
        number:
          min: 1
          max: 5
  sequence:
  - action: homeassistant.turn_on
    target:
      entity_id: "{{ target_entity }}"
  - repeat:
      count: "{{ max_retries | int(1) }}"
      sequence:
      - delay:
          seconds: "{{ retry_delay | int(5) }}"
      - condition: template
        value_template: "{{ is_state(target_entity, 'off') }}"
      - action: homeassistant.turn_on
        target:
          entity_id: "{{ target_entity }}"

turn_off_with_retry:
  alias: "Gerät ausschalten mit Retry"
  description: >-
    Schaltet ein oder mehrere Geräte aus und wiederholt den Versuch für
    Geräte die nicht reagiert haben. Akzeptiert eine einzelne Entity oder
    eine Liste von Entities.
  icon: mdi:replay
  mode: parallel
  max: 10
  fields:
    target_entities:
      description: Entity ID(s) — einzelne Entity oder Liste
      example: switch.sonoff_switch_05
      required: true
      selector:
        entity:
          multiple: true
    retry_delay:
      description: Wartezeit zwischen Versuchen in Sekunden
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: s
    max_retries:
      description: Maximale Anzahl Wiederholungen
      default: 1
      selector:
        number:
          min: 1
          max: 5
  sequence:
  - variables:
      entities_list: >-
        {% if target_entities is string %}
          {{ [target_entities] }}
        {% else %}
          {{ target_entities }}
        {% endif %}
  - action: homeassistant.turn_off
    target:
      entity_id: "{{ entities_list }}"
  - repeat:
      count: "{{ max_retries | int(1) }}"
      sequence:
      - delay:
          seconds: "{{ retry_delay | int(3) }}"
      - variables:
          still_on: >-
            {{ entities_list | select('is_state', 'on') | list }}
      - condition: template
        value_template: "{{ still_on | length > 0 }}"
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ still_on }}"

reset_sleep_modes:
  alias: "AL Sleep Modes zurücksetzen"
  description: Deaktiviert Sleep-Mode für alle 10 Adaptive-Lighting-Räume
  icon: mdi:weather-sunny
  mode: single
  sequence:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.adaptive_lighting_sleep_mode_ankleide
      - switch.adaptive_lighting_sleep_mode_arbeitszimmer
      - switch.adaptive_lighting_sleep_mode_badezimmer
      - switch.adaptive_lighting_sleep_mode_balkon
      - switch.adaptive_lighting_sleep_mode_flur
      - switch.adaptive_lighting_sleep_mode_kinderzimmer
      - switch.adaptive_lighting_sleep_mode_kueche
      - switch.adaptive_lighting_sleep_mode_waschzimmer
      - switch.adaptive_lighting_sleep_mode_wohnzimmer
      - switch.adaptive_lighting_sleep_mode_schlafzimmer

notify_critical:
  alias: "Critical Notification senden"
  description: >
    Helper fuer einheitliche Critical Alerts an beide iPhones via notify.family.
    Parameter: title (required), message (required), tag (optional),
    group (optional fuer iOS Notification-Gruppierung).
  icon: mdi:alert
  mode: parallel
  max: 10
  fields:
    title:
      description: "Titel der Notification"
      required: true
    message:
      description: "Text der Notification"
      required: true
    tag:
      description: "Tag fuer Replace statt Stapeln auf dem iPhone"
      required: false
      default: "critical_alert"
    group:
      description: "iOS Notification-Gruppe (optional)"
      required: false
  sequence:
  - action: notify.family
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      data: >
        {%- set payload = {
          'tag': tag | default('critical_alert'),
          'push': {
            'interruption-level': 'critical',
            'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}
          }
        } -%}
        {%- if group is defined and group -%}
          {{- dict(payload, group=group) -}}
        {%- else -%}
          {{- payload -}}
        {%- endif -%}

lock_wohnungstuer_safe:
  alias: "Wohnungstür sicher verriegeln"
  description: >
    Robuste Verriegelung mit bis zu 3 Retries und Handling für
    unavailable/unknown sowie physisch offene Tür. Sendet nur dann
    eine Critical Notification, wenn der Lock nach 3 Versuchen nicht
    schließt (kein False Positive bei offener Tür).
  icon: mdi:lock-check
  mode: queued
  max: 3
  fields:
    context_message:
      description: "Kurzer Kontext für Logbook und Notification"
      required: false
      default: "automatische Verriegelung"
  sequence:
  - choose:
    - alias: "Bereits verriegelt, nichts zu tun"
      conditions:
      - condition: state
        entity_id: lock.nuki_wohnungstur_lock
        state: locked
      sequence:
      - action: logbook.log
        data:
          name: "Wohnungstür"
          message: "Bereits verriegelt ({{ context_message }})"
          domain: lock
    - alias: "Tür physisch offen, kein Lock möglich"
      conditions:
      - condition: state
        entity_id: lock.nuki_wohnungstur_lock
        state: open
      sequence:
      - action: logbook.log
        data:
          name: "Wohnungstür"
          message: "Tür physisch offen, Verriegelung übersprungen ({{ context_message }})"
          domain: lock
    default:
    - alias: "Warte bis Lock erreichbar (max 30 Sek)"
      if:
      - condition: template
        value_template: "{{ states('lock.nuki_wohnungstur_lock') in ['unavailable', 'unknown'] }}"
      then:
      - wait_template: "{{ states('lock.nuki_wohnungstur_lock') not in ['unavailable', 'unknown'] }}"
        timeout: "00:00:30"
        continue_on_timeout: true
    - alias: "Erneuter Open-Check nach Reconnect"
      if:
      - condition: state
        entity_id: lock.nuki_wohnungstur_lock
        state: open
      then:
      - action: logbook.log
        data:
          name: "Wohnungstür"
          message: "Tür physisch offen nach Reconnect, Verriegelung übersprungen ({{ context_message }})"
          domain: lock
      - stop: "Tür offen, kein Lock-Versuch"
    - alias: "Lock-Versuch mit bis zu 3 Retries"
      repeat:
        sequence:
        - if:
          - condition: state
            entity_id: lock.nuki_wohnungstur_lock
            state: unlocked
          then:
          - action: lock.lock
            target:
              entity_id: lock.nuki_wohnungstur_lock
            continue_on_error: true
            data: {}
          - alias: "Warte auf Verriegelung (max 20 Sek)"
            wait_template: "{{ is_state('lock.nuki_wohnungstur_lock', 'locked') }}"
            timeout: "00:00:20"
            continue_on_timeout: true
        - alias: "Bei unavailable kurz warten, dann neuer Versuch"
          if:
          - condition: template
            value_template: "{{ states('lock.nuki_wohnungstur_lock') in ['unavailable', 'unknown'] }}"
          then:
          - wait_template: "{{ states('lock.nuki_wohnungstur_lock') not in ['unavailable', 'unknown'] }}"
            timeout: "00:00:15"
            continue_on_timeout: true
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: lock.nuki_wohnungstur_lock
            state: locked
          - condition: state
            entity_id: lock.nuki_wohnungstur_lock
            state: open
          - condition: template
            value_template: "{{ repeat.index >= 3 }}"
    - alias: "Ergebnis bewerten"
      choose:
      - alias: "Erfolg"
        conditions:
        - condition: state
          entity_id: lock.nuki_wohnungstur_lock
          state: locked
        sequence:
        - action: logbook.log
          data:
            name: "Wohnungstür"
            message: "Erfolgreich verriegelt ({{ context_message }})"
            domain: lock
      - alias: "Tür wurde während Versuch geöffnet"
        conditions:
        - condition: state
          entity_id: lock.nuki_wohnungstur_lock
          state: open
        sequence:
        - action: logbook.log
          data:
            name: "Wohnungstür"
            message: "Tür während Verriegelung geöffnet, abgebrochen ({{ context_message }})"
            domain: lock
      default:
      - action: script.notify_critical
        data:
          tag: door_lock_fail
          title: "Türverriegelung fehlgeschlagen"
          message: >-
            Die Wohnungstür konnte nach 3 Versuchen nicht verriegelt werden
            (Status: {{ states('lock.nuki_wohnungstur_lock') }}, {{ context_message }}).
            Bitte manuell prüfen.

homepods_mute:
  alias: HomePods stummschalten
  description: >-
    Setzt alle HomePods auf 0%. Jedes Geraet wird einzeln und parallel
    angesprochen, damit ein haengendes Geraet die anderen nicht blockiert.
    Immer per script.turn_on (fire-and-forget) aufrufen: pyatv wirft bei
    toter Verbindung einen TimeoutError, den continue_on_error nicht faengt.
  icon: mdi:volume-mute
  mode: restart
  sequence:
  - parallel:
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.homepod_wohnzimmer
      data:
        volume_level: 0.0
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.arbeitszimmer
      data:
        volume_level: 0.0
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.kuche
      data:
        volume_level: 0.0
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.homepod_badezimmer
      data:
        volume_level: 0.0
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.homepod_kinderzimmer
      data:
        volume_level: 0.0
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.schlafzimmer
      data:
        volume_level: 0.0

homepod_wake:
  alias: HomePod aufwecken
  description: >-
    Weckt einen einzelnen HomePod nach einer Vorlaufzeit. Ein turn_on auf alle
    sechs Geraete in einem Aufruf hat am 11.08. um 06:20:00 sekundengenau einen
    apple_tv-Disconnect-Burst ueber alle Geraete ausgeloest, deshalb einzeln und
    versetzt. Immer per script.turn_on (fire-and-forget) aufrufen: pyatv wirft
    bei toter Verbindung einen TimeoutError, den continue_on_error nicht faengt.
  icon: mdi:speaker-wireless
  mode: parallel
  max: 10
  fields:
    target_player:
      name: Target media player
      description: HomePod der aufgeweckt werden soll.
      required: true
      example: media_player.kuche
      selector:
        entity:
          domain: media_player
    start_delay:
      name: Start delay
      description: Wartezeit vor dem turn_on, um die Geraete zu staffeln.
      required: false
      default: 0
      example: '5'
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: s
          mode: box
  sequence:
  - delay:
      seconds: "{{ start_delay | default(0) | int }}"
  - action: media_player.turn_on
    continue_on_error: true
    target:
      entity_id: "{{ target_player }}"
  - delay:
      seconds: 3
  - action: homeassistant.update_entity
    continue_on_error: true
    target:
      entity_id: "{{ target_player }}"

movie_motion_restore:
  alias: 'Szene » Film Motion wiederherstellen'
  description: Reaktiviert die waehrend des Films deaktivierten Motion-Automationen
  icon: mdi:motion-sensor
  mode: single
  sequence:
  - action: script.scene_enable_motion_automations
    data:
      automations: "automation.motion_kuche_2"
      exclude_scenes: "kochen,abwaschen,party,party_wohnzimmer"
  - action: script.scene_enable_motion_automations
    data:
      automations: "automation.motion_esstisch"
      exclude_scenes: "essen"
  - action: script.scene_enable_motion_automations
    data:
      automations: "automation.motion_spieletisch"
      exclude_scenes: ""
  - action: script.scene_enable_motion_automations
    data:
      automations: "automation.motion_flur_wohnung"
      exclude_scenes: "party,party_wohnzimmer"

scene_stop_rgb_effect:
  alias: 'Szene » Hue-Effekt stoppen und Lichter ausschalten'
  description: >-
    Beendet einen laufenden Hue-Effekt, setzt die RGB-Lichter zurueck in den
    color_temp-Modus (sonst starten sie beim naechsten Mal wieder farbig) und
    schaltet danach die Raumlichter aus.
  icon: mdi:palette-off
  mode: parallel
  max: 10
  fields:
    rgb_lights:
      description: RGB-Lichter, deren Effekt gestoppt und zurueckgesetzt wird
      required: true
      selector:
        object:
    off_lights:
      description: Lichter, die danach ausgeschaltet werden
      required: true
      selector:
        object:
  sequence:
  - alias: "Hue-Effekt stoppen"
    action: light.turn_on
    target:
      entity_id: "{{ rgb_lights }}"
    data:
      effect: stop_effect
  - alias: "RGB-Lichter zurueck in den color_temp-Modus"
    action: light.turn_on
    target:
      entity_id: "{{ rgb_lights }}"
    data:
      color_temp_kelvin: 2700
      brightness_pct: 1
  - delay:
      milliseconds: 500
  - alias: "Lichter ausschalten"
    action: light.turn_off
    target:
      entity_id: "{{ off_lights }}"
    data:
      transition: 5

restore_leselicht:
  alias: 'Szene » Leselicht wiederherstellen'
  description: Schaltet das Leselicht wieder ein, wenn der Schalter aktiv ist
  icon: mdi:book-open-variant
  mode: parallel
  max: 10
  sequence:
  - condition: state
    entity_id: input_boolean.leselicht
    state: 'on'
  - delay:
      milliseconds: 500
  - action: light.turn_on
    target:
      entity_id: light.ikea_light_19_wand_2
    data:
      brightness_pct: 100
      color_temp_kelvin: 4000

luftreiniger_auto_modus:
  alias: 'Luftreiniger » Auto-Modus setzen wenn noetig'
  description: Setzt den Xiaomi Luftreiniger auf Auto, falls er in einem anderen Preset steht
  icon: mdi:air-purifier
  mode: parallel
  max: 10
  sequence:
  - if:
    - condition: template
      value_template: "{{ state_attr('fan.zhimi_vb4_bce4_air_purifier', 'preset_mode') != 'Auto' }}"
    then:
    - action: fan.set_preset_mode
      target:
        entity_id: fan.zhimi_vb4_bce4_air_purifier
      data:
        preset_mode: Auto

al_set_manual_control:
  alias: 'AL » Manual Control setzen oder loeschen'
  description: >-
    Markiert die Weisslicht-Gruppen eines oder mehrerer Raeume als manuell
    gesteuert (oder loescht die Markierung). Diese Zuordnung Raum -> Weisslicht-
    Gruppe ist die einzige AUSFUEHRENDE Kopie, damit sie nicht in jeder Szene
    erneut gepflegt werden muss. Zwei weitere Kopien derselben Entity-Menge
    existieren bewusst und lassen sich nicht ersetzen: der state-Trigger des
    Party-Weisslicht-Waechters in scenes/activities.yaml (Trigger nehmen keine
    Templates) und die Blink-Lichter der Tuerklingel in notifications/alerts.yaml
    (andere Lichtmenge). Aendert sich eine Weisslicht-Gruppe, alle drei anfassen.
    adaptive_lighting.set_manual_control akzeptiert pro Aufruf nur einen Switch,
    daher die Schleife.
  icon: mdi:hand-back-right
  mode: parallel
  max: 10
  fields:
    rooms:
      description: Liste der Raumnamen (wohnzimmer, kueche, flur, schlafzimmer, ankleide, kinderzimmer)
      required: true
      selector:
        object:
    manual_control:
      description: true = als manuell markieren, false = Markierung loeschen
      required: true
      selector:
        boolean:
  sequence:
  - variables:
      room_lights:
        wohnzimmer:
        - light.ikea_light_18_wand_1
        - light.ikea_light_19_wand_2
        - light.ikea_light_20_wand_3
        - light.ikea_light_21_wand_4
        - light.ikea_light_22_wand_5
        - light.ikea_light_23_wand_6
        - light.philips_light_19_2
        - light.philips_light_20_3
        kueche:
        - light.ikea_light_14_decke_1
        - light.ikea_light_15_decke_2
        flur:
        - light.ikea_light_07_decke_1
        - light.ikea_light_08_decke_2
        - light.ikea_light_09_decke_3
        - light.ikea_light_10_decke_4
        - light.ikea_light_11_decke_5
        - light.ikea_light_12_decke_6
        schlafzimmer:
        - light.ikea_light_16_1
        - light.ikea_light_17_2
        ankleide:
        - light.ikea_light_01
        - light.ikea_light_02
        kinderzimmer:
        - light.ikea_light_13
  - repeat:
      for_each: "{{ rooms }}"
      sequence:
      - alias: "Unbekannten Raum melden statt lights: None zu senden"
        if:
        - condition: template
          value_template: "{{ repeat.item not in room_lights }}"
        then:
        - action: system_log.write
          data:
            message: "al_set_manual_control: Raum {{ repeat.item }} nicht in room_lights"
            level: warning
        else:
        - action: adaptive_lighting.set_manual_control
          data:
            entity_id: "switch.adaptive_lighting_{{ repeat.item }}"
            lights: "{{ room_lights[repeat.item] }}"
            manual_control: "{{ manual_control }}"

al_min_brightness_setzen:
  alias: "AL » min_brightness je Raum setzen"
  description: >-
    Die Zuordnung der Tages-Mindesthelligkeit je Raum. Sie steht bewusst nur an dieser einen
    Stelle, weil sie an zwei Zeitpunkten gebraucht wird: beim Start durch
    "System » Adaptive Lighting Settings nach Neustart" (automations_new/system/core.yaml)
    und beim Aufwachen durch "Adaptive Lighting » Morning Reset"
    (automations_new/lighting/day_night.yaml). Zwei Kopien liefen sonst auseinander, ohne dass
    es jemandem auffaellt.
  mode: single
  sequence:
    - repeat:
        for_each:
          - schalter:
              - switch.adaptive_lighting_ankleide
              - switch.adaptive_lighting_arbeitszimmer
              - switch.adaptive_lighting_kinderzimmer
            wert: 10
          - schalter:
              - switch.adaptive_lighting_flur
              - switch.adaptive_lighting_kueche
              - switch.adaptive_lighting_wohnzimmer
            wert: 20
          - schalter:
              - switch.adaptive_lighting_badezimmer
              - switch.adaptive_lighting_schlafzimmer
              - switch.adaptive_lighting_waschzimmer
            wert: 30
          - schalter:
              - switch.adaptive_lighting_balkon
            wert: 40
        sequence:
          - action: adaptive_lighting.change_switch_settings
            data:
              entity_id: "{{ repeat.item.schalter }}"
              min_brightness: "{{ repeat.item.wert }}"
              use_defaults: current
