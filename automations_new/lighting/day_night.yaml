---
# Lighting - Day Night.Yaml
# Generated by automation splitter - 3 automations
# Part of Home Assistant configuration

- id: '1645377860470'
  alias: State » Tag/Nacht
  description: Steuert Tag/Nacht-Übergänge mit Alarm, Beleuchtung und adaptiver Beleuchtung
  triggers:
  - trigger: time
    at: sensor.wakeup_light_timestamp
    id: wakeup
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: -3.5
    id: sun
  - trigger: time
    at: sensor.einschlafzeit_timestamp
    id: einschlafzeit
  - trigger: time
    at: '23:00:00'
    id: schlafenszeit
  - trigger: homeassistant
    event: start
    id: restart
  conditions: []
  actions:
  - choose:
    - alias: Nach Neustart - Schlafenszeit-Zustand korrigieren
      conditions:
      - condition: trigger
        id: restart
      - condition: template
        value_template: >-
          {% set einschlafzeit = states('sensor.einschlafzeit_timestamp') %}
          {% set wakeup = states('sensor.wakeup_light_timestamp') %}
          {% if einschlafzeit in ['unknown', 'unavailable'] or wakeup in ['unknown', 'unavailable'] %}
            false
          {% else %}
            {% set sleep_dt = as_datetime(einschlafzeit) %}
            {% set wake_dt = as_datetime(wakeup) %}
            {% set n = now() %}
            {% if n >= wake_dt and n < sleep_dt %}
              true
            {% else %}
              false
            {% endif %}
          {% endif %}
      sequence:
      - alias: Schlafenszeit deaktivieren (nach Neustart - es ist Tageszeit)
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.schlafenszeit
      - alias: Nachtlicht deaktivieren
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nachtlicht
      - alias: Sleep Mode für alle Räume deaktivieren
        action: script.reset_sleep_modes
    - alias: Aufwachen - Alarm deaktivieren und sanftes Licht
      conditions:
      - condition: trigger
        id: wakeup
      sequence:
      - alias: "Wakeup-Flag setzen (verhindert konkurrierenden schlafenszeit-aus Volume-Fade)"
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wakeup_active
      - alias: Schlafenszeit beenden
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.schlafenszeit
      - alias: Nachtlicht deaktivieren
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nachtlicht
      - alias: Sleep Mode für alle Räume deaktivieren
        action: script.reset_sleep_modes
      - alias: "Kurz warten bis AL neue Werte berechnet hat"
        delay:
          seconds: 3
      - alias: "Manual Control für alle Räume zurücksetzen (Sleep-Transition löscht false positives)"
        action: adaptive_lighting.set_manual_control
        data:
          entity_id:
          - switch.adaptive_lighting_ankleide
          - switch.adaptive_lighting_arbeitszimmer
          - switch.adaptive_lighting_badezimmer
          - switch.adaptive_lighting_balkon
          - switch.adaptive_lighting_flur
          - switch.adaptive_lighting_kinderzimmer
          - switch.adaptive_lighting_kueche
          - switch.adaptive_lighting_waschzimmer
          - switch.adaptive_lighting_wohnzimmer
          - switch.adaptive_lighting_schlafzimmer
          manual_control: false
      - alias: "Abend-Szenen zurücksetzen (verhindert verwaiste Motion-Deaktivierungen)"
        action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.movie
          - input_boolean.party
          - input_boolean.party_wohnzimmer
          - input_boolean.gaming
      - alias: "Warte auf Szenen-Cleanup Kaskade (Party/Party-WZ haben eigene Off-Handler)"
        delay:
          seconds: 5
      - alias: "Flur und Arbeitszimmer Motion sicherstellen (Sicherheitsnetz für Film/Gaming)"
        action: automation.turn_on
        target:
          entity_id:
          - automation.motion_flur_wohnung
          - automation.arbeitszimmer_motion
      - alias: Sanftes Aufwachlicht wenn jemand da ist
        if:
        - alias: Jemand ist zu Hause
          condition: template
          value_template: "{{ states('input_boolean.alle_sind_weg') == 'off' }}"
        then:
        - alias: Motion-Automationen für Wake-Up Räume deaktivieren
          # Achtung, gekreuzte entity_ids nach Room-Swap:
          # automation.motion_schlafzimmer = "Motion » Arbeitszimmer" = physisches Schlafzimmer (Bett/TV/Decke)
          # automation.arbeitszimmer_motion = "Motion » Schlafzimmer" = Alex' Büro
          action: automation.turn_off
          target:
            entity_id:
            - automation.motion_schlafzimmer
            - automation.arbeitszimmer_motion
            - automation.kinderzimmer_motion
          data:
            stop_actions: true
        # fire-and-forget: continue_on_error faengt den pyatv-TimeoutError nicht
        # ab. Am 18.08. hat ein haengender HomePod hier den ganzen Wakeup-Lauf
        # gekillt (Licht-Fade und wakeup_active-Reset liefen nie).
        - alias: "Alle HomePods auf 0% setzen vor dem Aufwach-Fade (fire-and-forget)"
          action: script.turn_on
          target:
            entity_id: script.homepods_mute
        - alias: "AL für Wakeup-Räume aus (sonst faengt Adaptive Lighting den turn_on/Fade ab und haelt die Lampen dunkel)"
          action: switch.turn_off
          target:
            entity_id:
            - switch.adaptive_lighting_arbeitszimmer
            - switch.adaptive_lighting_kinderzimmer
        - alias: "Aufwachlichter auf 1% setzen als Startpunkt für den Fade"
          action: light.turn_on
          target:
            entity_id:
            - light.alle_schlafzimmer_aufwachlichter
            - light.alle_kinderzimmer_lichter
          data:
            brightness_pct: 1
            transition: 0
        - alias: "Schlafzimmer und Kinderzimmer über 30 Minuten auf 100% hochfahren"
          action: light.turn_on
          continue_on_error: true
          target:
            entity_id:
            - light.alle_schlafzimmer_aufwachlichter
            - light.alle_kinderzimmer_lichter
          data:
            brightness_pct: 100
            transition: 1800
        # fire-and-forget via script.turn_on: ein pyatv-TimeoutError (kein
        # HomeAssistantError, continue_on_error greift nicht) darf den
        # Wakeup-Lauf nicht mehr abbrechen. Das delay unten wartet ohnehin.
        - alias: "HomePods über 30 Minuten mitsynchronisieren (fire-and-forget)"
          action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.homepod_wohnzimmer
              target_volume: 0.35
              duration: 1800
              curve: linear
        - action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.arbeitszimmer
              target_volume: 0.50
              duration: 1800
              curve: linear
        - action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.kuche
              target_volume: 0.50
              duration: 1800
              curve: linear
        - action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.homepod_badezimmer
              target_volume: 0.50
              duration: 1800
              curve: linear
        - action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.homepod_kinderzimmer
              target_volume: 0.50
              duration: 1800
              curve: linear
        - action: script.turn_on
          target:
            entity_id: script.fade_volume
          data:
            variables:
              target_player: media_player.schlafzimmer
              target_volume: 0.45
              duration: 1800
              curve: linear
        - alias: "Warten bis Aufwachlicht abgeschlossen (30 Minuten)"
          delay: "00:30:00"
        - alias: "Warte bis 08:00 Uhr"
          delay:
            seconds: >-
              {% set target_time = today_at('08:00:00') %}
              {% set now_time = now() %}
              {% if now_time < target_time %}
                {{ (target_time - now_time).total_seconds() | int }}
              {% else %}
                0
              {% endif %}
        - alias: "08:00 Uhr: Aufwachlichter ausschalten"
          action: light.turn_off
          target:
            entity_id:
            - light.alle_schlafzimmer_aufwachlichter
            - light.alle_kinderzimmer_lichter
        - alias: "AL für Wakeup-Räume wieder an (Lichter sind aus, AL adaptiert ab naechstem Einschalten normal)"
          action: switch.turn_on
          target:
            entity_id:
            - switch.adaptive_lighting_arbeitszimmer
            - switch.adaptive_lighting_kinderzimmer
        - alias: Motion-Automationen für Wake-Up Räume wieder aktivieren
          action: automation.turn_on
          target:
            entity_id:
            - automation.kinderzimmer_motion
            - automation.arbeitszimmer_motion
        # Nicht bei laufendem AppleTV, sonst schaltet
        # "Licht » Schlafzimmer TV Ambilight" die Automation gleich wieder ab.
        - alias: Schlafzimmer-Motion mit Szenen- und AppleTV-Pruefung
          action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_schlafzimmer"
            exclude_scenes: "movie,party,party_wohnzimmer"
            exclude_players: "media_player.appletv"
        - alias: "08:00 Uhr: Musik auf Taglautstärke setzen (nur spielende HomePods)"
          parallel:
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.homepod_wohnzimmer', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.homepod_wohnzimmer
                  data:
                    volume_level: 0.35
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.kuche', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.kuche
                  data:
                    volume_level: 0.50
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.homepod_badezimmer', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.homepod_badezimmer
                  data:
                    volume_level: 0.50
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.homepod_kinderzimmer', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.homepod_kinderzimmer
                  data:
                    volume_level: 0.50
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.arbeitszimmer', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.arbeitszimmer
                  data:
                    volume_level: 0.50
            - if:
                - condition: template
                  value_template: "{{ is_state('media_player.schlafzimmer', 'playing') }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: media_player.schlafzimmer
                  data:
                    volume_level: 0.45
        - alias: "08:00 Uhr: Wohnungstür entsperren"
          action: lock.unlock
          continue_on_error: true
          target:
            entity_id: lock.nuki_wohnungstur_lock
      - alias: "Wakeup-Flag zuruecksetzen (auch wenn niemand zuhause war)"
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wakeup_active
    - alias: Sonnenaufgang - Schlafenszeit beenden (Fallback)
      conditions:
      - condition: trigger
        id: sun
      - condition: state
        entity_id: input_boolean.schlafenszeit
        state: 'on'
      # Nur als Notnetz, wenn die Weckzeit schon erreicht ist. Verhindert, dass die
      # fruehe Sommer-Daemmerung (~04:46) die Schlafenszeit vor der echten Weckzeit
      # (06:30) beendet und damit AC/Ventilator-Praesenzgate wegreisst.
      - alias: Weckzeit bereits erreicht (oder Weckzeit unbekannt)
        condition: template
        value_template: >-
          {{ states('sensor.wakeup_light_timestamp') in ['unknown', 'unavailable']
             or now() >= as_datetime(states('sensor.wakeup_light_timestamp')) }}
      sequence:
      - alias: Schlafenszeit automatisch beenden bei Sonnenaufgang
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.schlafenszeit
      - alias: Nachtlicht deaktivieren
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nachtlicht
      - alias: Sleep Mode für alle Räume deaktivieren
        action: script.reset_sleep_modes
    - alias: Einschlafzeit - Schlafmodus aktivieren
      conditions:
      - condition: trigger
        id: einschlafzeit
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      sequence:
      - alias: Schlafenszeit aktivieren
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.schlafenszeit
      - alias: Automation-Zeitfenster auf nächste Dämmerung setzen
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.automation_lauft_nicht_vor
        data:
          timestamp: '{{ (state_attr(''sun.sun'', ''next_dusk'')|as_datetime).timestamp()
            }}'
      - alias: Automation-Zeitfenster auf nächste Morgendämmerung setzen
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.automation_lauft_erst_ab
        data:
          timestamp: '{{ (state_attr(''sun.sun'', ''next_dawn'')|as_datetime).timestamp()
            }}'
    - alias: 23:00 Uhr - Kompletter Nachtmodus
      conditions:
      - condition: trigger
        id: schlafenszeit
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      sequence:
      # Ankleide bleibt bewusst aussen vor: dort sucht man nachts Kleidung,
      # Sleep Mode waere zu dunkel. script.reset_sleep_modes schaltet sie
      # morgens trotzdem mit aus, das ist harmlos.
      - alias: Sleep Mode für alle Räume ausser Ankleide aktivieren
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_sleep_mode_badezimmer
          - switch.adaptive_lighting_sleep_mode_balkon
          - switch.adaptive_lighting_sleep_mode_flur
          - switch.adaptive_lighting_sleep_mode_kueche
          - switch.adaptive_lighting_sleep_mode_waschzimmer
          - switch.adaptive_lighting_sleep_mode_wohnzimmer
          - switch.adaptive_lighting_sleep_mode_kinderzimmer
          - switch.adaptive_lighting_sleep_mode_arbeitszimmer
          - switch.adaptive_lighting_sleep_mode_schlafzimmer
      - alias: Hauptlichter in Schlaf-/Kinderzimmern ausschalten
        action: light.turn_off
        target:
          entity_id:
          - light.alle_kinderzimmer_lichter
          - light.alle_schlafzimmer_lichter
          - light.alle_arbeitszimmer_lichter
  mode: queued
  max: 3
- id: es_ist_dunkel_toggle
  alias: Helper » Dunkel – an/aus je nach Sonnenstand
  description: Schaltet den Boolean ein bei Sonnenuntergang und aus bei Sonnenaufgang.
  triggers:
  - event: sunset
    id: sunset
    trigger: sun
    offset: 00:30:00
  - event: sunrise
    id: sunrise
    trigger: sun
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - target:
          entity_id: input_boolean.es_ist_dunkel
        action: input_boolean.turn_on
        data: {}
    - conditions:
      - condition: trigger
        id: sunrise
      sequence:
      - target:
          entity_id: input_boolean.es_ist_dunkel
        action: input_boolean.turn_off
        data: {}
  mode: single
- id: adaptive_lighting_dynamic_sunset
  alias: Adaptive Lighting » Fade Over 30 Minutes When Schlafenszeit Starts
  description: When schlafenszeit activates, fade lights over 30 minutes
  triggers:
  # Trigger when schlafenszeit turns ON
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    from: 'off'
    to: 'on'
    id: schlafenszeit_on
  conditions: []
  actions:
  - alias: Start 30-minute fade-down when schlafenszeit activates
    action: adaptive_lighting.change_switch_settings
    target:
      entity_id:
      - switch.adaptive_lighting_arbeitszimmer
      - switch.adaptive_lighting_ankleide
      - switch.adaptive_lighting_badezimmer
      - switch.adaptive_lighting_balkon
      - switch.adaptive_lighting_flur
      - switch.adaptive_lighting_kinderzimmer
      - switch.adaptive_lighting_kueche
      - switch.adaptive_lighting_schlafzimmer
      - switch.adaptive_lighting_waschzimmer
      - switch.adaptive_lighting_wohnzimmer
    data:
      # Start transition now
      min_sunset_time: >-
        {{ now().strftime('%H:%M:%S') }}
      # End transition 30 minutes from now
      max_sunset_time: >-
        {{ (now() + timedelta(minutes=30)).strftime('%H:%M:%S') }}
      # Alle Räume auf dasselbe Abendniveau: 2200K bei 40 % bis zum Nachtmodus um 23:00.
      # max_brightness wird hier bewusst NICHT gesetzt: es gehoert
      # "Licht » Tageshelligkeit nach Aussenlicht" allein, und abends klebt die
      # Kurve ohnehin am unteren Ende, die Obergrenze ist dort wirkungslos.
      min_brightness: 40
  mode: single
- id: al_tageshelligkeit_nach_aussenlicht
  alias: Licht » Tageshelligkeit nach Aussenlicht
  description: >-
    Setzt die Obergrenze der AL-Helligkeitskurve nach der gemessenen Aussenhelligkeit.
    Der Sonnenstand allein kann das nicht: um 13 Uhr bei Regen ist es drinnen dunkel,
    die Kurve steht aber auf demselben Plateau wie bei Sonne. Gemessen wird draussen
    (Balkon), nicht im Raum, sonst entsteht ein Regelkreis: Licht an, Lux steigt,
    Helligkeit runter, Lux faellt, Helligkeit hoch.
    Flur und Ankleide sind bewusst nicht dabei, die messen ganztags 2 bis 71 lx.
    Fuer sie ist Aussenhelligkeit kein Signal, sie haben feste Werte aus system/core.yaml.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
    id: start
  - alias: Nach dem Morgen-Reset sofort neu setzen
    trigger: state
    entity_id: input_boolean.schlafenszeit
    from: 'on'
    to: 'off'
  conditions:
  - alias: Nicht waehrend der Schlafenszeit, dort gehoert die Kurve dem Abend-Fade
    condition: state
    entity_id: input_boolean.schlafenszeit
    state: 'off'
  - alias: >-
      Keine Szene aktiv. Film, Kochen und Essen setzen max_brightness selbst
      (40, 100, 70) und wuerden sonst binnen fuenf Minuten ueberschrieben. Beim
      Szenenende schreibt der jeweilige Reset den Helferwert direkt an AL, die
      Modulation ist danach sofort wieder korrekt.
    condition: state
    entity_id: binary_sensor.any_scene_active
    state: 'off'
  actions:
  - alias: Nach einem Neustart warten bis die AL-Schalter da sind
    if:
    - condition: trigger
      id: start
    then:
    - delay: "00:00:45"
  - variables:
      # Fallback 2000 wie im Safe-Sensor selbst: fehlt die Entity ganz, gilt "heller Tag",
      # also die niedrigste Obergrenze. Zu dunkel ist der teurere Fehler als zu hell.
      lux: "{{ states('sensor.balkon_motion_illuminance_safe') | float(2000) }}"
      # Vier grobe Stufen statt einer stetigen Kurve: bei stetiger Rechnung wuerde
      # jede Wolke die Helligkeit nachziehen. Die Schwellen stammen aus sieben Tagen
      # Messung am Balkon (Mittag 1147, Abend 480, Nacht 1 lx).
      stufe: >-
        {% if lux >= 1000 %}70
        {% elif lux >= 600 %}80
        {% elif lux >= 300 %}90
        {% else %}100{% endif %}
      aktuell: "{{ states('input_number.al_tagesmax_helligkeit') | int(0) }}"
  # Der AL-Aufruf laeuft bewusst UNBEDINGT, nicht nur bei geaenderter Stufe: die Szenen
  # (Film, Kochen, Essen) schreiben max_brightness direkt an AL, ohne den Helfer
  # nachzufuehren. Waere der Aufruf hinter der Aenderungspruefung, bliebe ein Raum nach
  # einer Szene auf dem Szenenwert haengen, solange sich draussen nichts tut.
  - alias: Obergrenze auf die Raeume mit Tageslicht anwenden
    action: adaptive_lighting.change_switch_settings
    data:
      entity_id:
      - switch.adaptive_lighting_wohnzimmer
      - switch.adaptive_lighting_kueche
      - switch.adaptive_lighting_badezimmer
      - switch.adaptive_lighting_kinderzimmer
      - switch.adaptive_lighting_waschzimmer
      - switch.adaptive_lighting_arbeitszimmer
      - switch.adaptive_lighting_schlafzimmer
      - switch.adaptive_lighting_balkon
      max_brightness: "{{ stufe | int }}"
      use_defaults: current
  - alias: Helfer und Logbuch nur bei echtem Stufenwechsel
    if:
    - condition: template
      value_template: "{{ stufe | int != aktuell }}"
    then:
    - alias: Neue Stufe merken (Szenen-Resets lesen diesen Wert)
      action: input_number.set_value
      target:
        entity_id: input_number.al_tagesmax_helligkeit
      data:
        value: "{{ stufe | int }}"
    - alias: Wechsel im Logbuch festhalten
      action: logbook.log
      data:
        name: Tageshelligkeit
        message: >-
          Aussen {{ lux | round(0) }} lx, Obergrenze {{ aktuell }} -> {{ stufe | int }} %

- id: adaptive_lighting_morning_reset
  alias: Adaptive Lighting » Morning Reset to Default Sunset Times
  description: Resets adaptive lighting to conservative default times in the morning
  triggers:
  # Reset at sunrise or when sleep mode ends
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    from: 'on'
    to: 'off'
    id: sleep_mode_ended
  - trigger: sun
    event: sunrise
    id: sunrise
  conditions: []
  actions:
  # Split into three calls to preserve room-specific min_brightness values
  - alias: "Sonnenzeiten und Farbtemperatur zurueck auf Tageswerte (alle Raeume gleich)"
    action: adaptive_lighting.change_switch_settings
    data:
      entity_id:
      - switch.adaptive_lighting_ankleide
      - switch.adaptive_lighting_arbeitszimmer
      - switch.adaptive_lighting_badezimmer
      - switch.adaptive_lighting_balkon
      - switch.adaptive_lighting_flur
      - switch.adaptive_lighting_kinderzimmer
      - switch.adaptive_lighting_kueche
      - switch.adaptive_lighting_schlafzimmer
      - switch.adaptive_lighting_waschzimmer
      - switch.adaptive_lighting_wohnzimmer
      min_sunset_time: "20:00:00"
      max_sunset_time: "20:30:00"
      max_color_temp: 4000
      use_defaults: current
  - alias: "min_brightness je Raum (Zuordnung liegt im Skript, siehe scripts.yaml)"
    action: script.al_min_brightness_setzen
  mode: single
