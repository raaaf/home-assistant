# Scenes - Media Volume.yaml
# Scene-based HomePod volume control
# Part of Home Assistant configuration

- id: 'scene_homepod_volume_control'
  alias: 'Scenen » HomePod Lautstärke'
  description: >
    Passt die HomePod-Lautstärke an aktive Szenen an. Die Zielwerte kommen
    allein aus script.homepod_volume_apply (Tabelle dort); beim Szenenende
    wird der Tabellenwert wiederhergestellt, nachts werden Player ohne
    verbleibende Überschreibung zusätzlich gestoppt.
  triggers:
    - trigger: state
      entity_id: input_boolean.schlafenszeit
      to: 'on'
      id: schlafenszeit-an
    - trigger: state
      entity_id: input_boolean.schlafenszeit
      to: 'off'
      id: schlafenszeit-aus
    - trigger: state
      entity_id: input_boolean.kochen
      to: 'on'
      id: kochen-an
    - trigger: state
      entity_id: input_boolean.kochen
      to: 'off'
      id: kochen-aus
    - trigger: state
      entity_id: input_boolean.essen
      to: 'on'
      id: essen-an
    - trigger: state
      entity_id: input_boolean.essen
      to: 'off'
      id: essen-aus
    - trigger: state
      entity_id: input_boolean.baden
      to: 'on'
      id: baden-an
    - trigger: state
      entity_id: input_boolean.baden
      to: 'off'
      id: baden-aus
    - trigger: state
      entity_id: input_boolean.sauna
      to: 'on'
      id: sauna-an
    - trigger: state
      entity_id: input_boolean.sauna
      to: 'off'
      id: sauna-aus
    - trigger: state
      entity_id: input_boolean.party_wohnzimmer
      to: 'on'
      id: party-wz-an
    - trigger: state
      entity_id: input_boolean.party_wohnzimmer
      to: 'off'
      id: party-wz-aus
    - trigger: state
      entity_id: input_boolean.party
      to: 'on'
      id: party-an
    - trigger: state
      entity_id: input_boolean.party
      to: 'off'
      id: party-aus
  conditions:
    - condition: or
      conditions:
        - alias: Szenen- und Schlafenszeit-Wechsel ohne Gate
          condition: not
          conditions:
            - condition: trigger
              id:
                - schlafenszeit-an
                - schlafenszeit-aus
        - alias: Schlafenszeit-Lautstärke nur ohne aktive Szene setzen
          condition: and
          conditions:
            - condition: trigger
              id: schlafenszeit-an
            - condition: state
              entity_id: binary_sensor.any_scene_active
              state: 'off'
        - alias: Zurück auf Tageswerte nur ohne Aufwachroutine und ohne Szene
          condition: and
          conditions:
            - condition: trigger
              id: schlafenszeit-aus
            - condition: state
              entity_id:
                - input_boolean.wakeup_active
                - input_boolean.kochen
                - input_boolean.essen
                - input_boolean.baden
                - input_boolean.sauna
                - input_boolean.party_wohnzimmer
                - input_boolean.party
              state: 'off'
  actions:
    # Per trigger: which players, fade seconds, playing guard, stop at night.
    # Scene starts act on playing players only; scene ends restore the table
    # level even on idle players (otherwise an idle HomePod stays at party level).
    - variables:
        plan:
          schlafenszeit-an: {fade: 60, playing: false, stop: false}
          schlafenszeit-aus: {fade: 60, playing: false, stop: false}
          kochen-an: {players: [media_player.kuche], fade: 0, playing: true, stop: false}
          kochen-aus: {players: [media_player.kuche], fade: 0, playing: false, stop: true}
          essen-an: {players: [media_player.homepod_wohnzimmer], fade: 0, playing: true, stop: false}
          essen-aus: {players: [media_player.homepod_wohnzimmer], fade: 0, playing: false, stop: true}
          baden-an: {players: [media_player.homepod_badezimmer], fade: 0, playing: true, stop: false}
          baden-aus: {players: [media_player.homepod_badezimmer], fade: 0, playing: false, stop: true}
          sauna-an: {players: [media_player.homepod_badezimmer], fade: 0, playing: true, stop: false}
          sauna-aus: {players: [media_player.homepod_badezimmer], fade: 0, playing: false, stop: true}
          party-wz-an:
            players: [media_player.homepod_wohnzimmer, media_player.kuche]
            fade: 0
            playing: true
            stop: false
          party-wz-aus:
            players: [media_player.homepod_wohnzimmer, media_player.kuche]
            fade: 0
            playing: false
            stop: true
          party-an: {fade: 0, playing: true, stop: false}
          party-aus: {fade: 0, playing: false, stop: true}
        step: "{{ plan[trigger.id] }}"
    - action: script.turn_on
      target:
        entity_id: script.homepod_volume_apply
      data:
        variables:
          # Without players the script uses all six.
          players: "{{ step.players | default(none) }}"
          fade: "{{ step.fade }}"
          only_if_playing: "{{ step.playing }}"
          stop_at_night: "{{ step.stop }}"
  mode: restart
