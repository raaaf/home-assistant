# Scenes - Activities.Yaml
# Generated by automation splitter - 3 automations
# Part of Home Assistant configuration

- id: '1722519061740'
  alias: Scenen » Gäste
  description: Deaktiviert bestimmte Automationen im Gästemodus für mehr Privatsphäre
  triggers:
  - entity_id: input_boolean.guest_or_away
    to: 'on'
    for:
      minutes: 1
    id: gäste-an
    trigger: state
  - entity_id: input_boolean.guest_or_away
    to: 'off'
    for:
      minutes: 1
    id: gäste-aus
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.lock_door_after_guest
    id: timer-abgelaufen
    trigger: event
  - event: start
    id: reconcile
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: gäste-an
        - condition: and
          conditions:
          - condition: trigger
            id: reconcile
          - condition: state
            entity_id: input_boolean.guest_or_away
            state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id:
          - automation.helper_workday_musik  # Helper » Workday Musik - Automatic workday music
        data: {}
      - target:
          entity_id:
          - switch.wohnzimmer_steckdose
          - switch.kuchengerate
        action: switch.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: gäste-aus
        - condition: and
          conditions:
          - condition: trigger
            id: reconcile
          - condition: state
            entity_id: input_boolean.guest_or_away
            state: 'off'
      sequence:
      - target:
          entity_id:
          - automation.helper_workday_musik  # Helper » Workday Musik - Automatic workday music
        action: automation.turn_on
      - target:
          entity_id:
          - switch.wohnzimmer_steckdose
          - switch.kuchengerate
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: timer-abgelaufen
      - condition: state
        entity_id: lock.nuki_wohnungstur_lock
        state: unlocked
      - condition: template
        value_template: "{{ has_value('lock.nuki_wohnungstur_lock') }}"
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'on'
      - condition: template
        value_template: "{{ has_value('input_boolean.alle_sind_weg') }}"
      sequence:
      - target:
          entity_id: lock.nuki_wohnungstur_lock
        action: lock.lock
      - action: logbook.log
        data:
          name: Tür automatisch verschlossen
          message: Nach Ablauf des Timers automatisch verschlossen
          domain: automation
  mode: single
- id: '1737546608146'
  alias: Scenen » Party
  description: Aktiviert Party-Modus in allen Räumen mit dynamischer Beleuchtung und
    deaktivierten Bewegungsmeldern
  triggers:
  - entity_id:
    - input_boolean.party
    to: 'on'
    id: 'on'
    trigger: state
  - entity_id:
    - input_boolean.party
    to: 'off'
    id: 'off'
    trigger: state
  conditions: []
  # Eine Liste fuer beide Richtungen: laufen mark und clear auseinander, bleiben
  # Raeume dauerhaft als manuell markiert und AL adaptiert sie nie wieder.
  variables:
    party_raeume:
    - wohnzimmer
    - kueche
    - flur
    - schlafzimmer
    - ankleide
    - kinderzimmer
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      # 1. Disable motion automations FIRST (stop new triggers)
      - alias: "Disable motion automations"
        action: automation.turn_off
        target:
          entity_id:
          - automation.motion_kuche_2  # Kitchen motion
          - automation.motion_flur_wohnung  # Hallway motion
          - automation.arbeitszimmer_motion  # Office motion
          - automation.motion_schlafzimmer  # Bedroom motion
          - automation.motion_badezimmer_gross  # Bathroom motion
          - automation.kinderzimmer_motion  # Kids room motion
          - automation.motion_haustur_flur  # Front door motion
          - automation.motion_spieletisch  # Game table motion
      - alias: "Deaktiviere Esstisch-Motion wenn nicht gegessen wird"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.essen
            state: 'off'
          sequence:
          - action: automation.turn_off
            target:
              entity_id: automation.motion_esstisch
      # 2. Mark white-only lights as manual control (prevents AL from touching them)
      - alias: "Weisslicht-Gruppen als manuell markieren"
        action: script.al_set_manual_control
        data:
          manual_control: true
          rooms: "{{ party_raeume }}"
      # 3. Disable AL switches (prevents any adaptation)
      - alias: "Disable adaptive lighting"
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_wohnzimmer
          - switch.adaptive_lighting_kueche
          - switch.adaptive_lighting_badezimmer
          - switch.adaptive_lighting_kinderzimmer
          - switch.adaptive_lighting_arbeitszimmer
          - switch.adaptive_lighting_flur
          - switch.adaptive_lighting_schlafzimmer
          - switch.adaptive_lighting_waschzimmer
          - switch.adaptive_lighting_balkon
      # 4. Wait for in-flight commands to complete
      - alias: "Wait for in-flight commands"
        delay:
          milliseconds: 500
      # 5. Turn off ALL lights (clean slate)
      - alias: "Turn off all lights"
        action: light.turn_off
        data:
          transition: 5
        target:
          entity_id:
          - light.alle_wohnzimmer_lichter
          - light.alle_kuche_lichter
          - light.alle_flur_lichter
          - light.alle_schlafzimmer_lichter
          - light.alle_ankleide_lichter
          - light.alle_badezimmer_lichter
          - light.alle_kinderzimmer_lichter
      - alias: "Leselicht wiederherstellen falls aktiv"
        action: script.restore_leselicht
      # 6. Start Hue effect on RGB lights ONLY
      - alias: "Start Hue effect: colorloop (Party global)"
        action: light.turn_on
        target:
          entity_id:
          - light.alle_wohnzimmer_rgb_lichter
          - light.alle_kuche_rgb_lichter
          - light.alle_flur_rgb_lichter
          - light.alle_schlafzimmer_rgb_lichter
          - light.alle_badezimmer_rgb_lichter
          - light.alle_kinderzimmer_rgb_lichter
        data:
          effect: colorloop
          brightness_pct: 100
          transition: 10
    - conditions:
      - condition: trigger
        id: 'off'
      - condition: state
        entity_id: input_boolean.party_wohnzimmer
        state: 'off'
      sequence:
      - alias: "Hue-Effekt stoppen und Lichter ausschalten"
        action: script.scene_stop_rgb_effect
        data:
          rgb_lights:
          - light.alle_wohnzimmer_rgb_lichter
          - light.alle_kuche_rgb_lichter
          - light.alle_flur_rgb_lichter
          - light.alle_schlafzimmer_rgb_lichter
          - light.alle_badezimmer_rgb_lichter
          - light.alle_kinderzimmer_rgb_lichter
          off_lights:
          - light.alle_wohnzimmer_lichter
          - light.alle_kuche_lichter
          - light.alle_flur_lichter
          - light.alle_schlafzimmer_lichter
          - light.alle_ankleide_lichter
          - light.alle_badezimmer_lichter
          - light.alle_kinderzimmer_lichter
      - delay:
          seconds: 6
      # Clear manual control flags before re-enabling AL
      - alias: "Manual-Control-Markierungen loeschen"
        action: script.al_set_manual_control
        data:
          manual_control: false
          rooms: "{{ party_raeume }}"
      - alias: "Adaptive Lighting mit Konflikt-Pruefung reaktivieren"
        parallel:
        - action: script.scene_enable_adaptive_lighting
          data:
            room: "wohnzimmer"
            exclude_scenes: "party_wohnzimmer,movie"
        - action: script.scene_enable_adaptive_lighting
          data:
            room: "kueche"
            exclude_scenes: "kochen,movie,party_wohnzimmer"
        - action: script.scene_enable_adaptive_lighting
          data:
            room: "badezimmer"
            exclude_scenes: "sauna,baden"
      - alias: "Uebrige Raeume bedingungslos reaktivieren"
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_kinderzimmer
          - switch.adaptive_lighting_arbeitszimmer
          - switch.adaptive_lighting_flur
          - switch.adaptive_lighting_schlafzimmer
          - switch.adaptive_lighting_waschzimmer
          - switch.adaptive_lighting_balkon
      - alias: "Motion-Automationen mit Konflikt-Pruefung reaktivieren"
        parallel:
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_kuche_2"
            exclude_scenes: "movie,kochen,essen,party_wohnzimmer"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_flur_wohnung"
            exclude_scenes: "movie,party_wohnzimmer"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.arbeitszimmer_motion"
            exclude_scenes: "arbeit,gaming"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_esstisch"
            exclude_scenes: "essen,movie,party_wohnzimmer"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_spieletisch"
            exclude_scenes: "movie,party_wohnzimmer"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_badezimmer_gross"
            exclude_scenes: "sauna,baden"
      - alias: "Re-enable bedroom motion if gaming/schlafenszeit is off and no TV playing"
        action: script.scene_enable_motion_automations
        data:
          automations: "automation.motion_schlafzimmer"
          exclude_scenes: "gaming,schlafenszeit"
          exclude_players: "media_player.appletv"
      - alias: "Re-enable kinderzimmer motion if schlafenszeit is off"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.schlafenszeit
            state: 'off'
          sequence:
          - action: automation.turn_on
            target:
              entity_id: automation.kinderzimmer_motion  # Kids room motion
      - alias: "Re-enable front door motion"
        action: automation.turn_on
        target:
          entity_id: automation.motion_haustur_flur  # Front door motion
    default: []
  mode: restart
# "Szene » Arbeit" removed - now handled by arbeitszimmer.yaml with blueprint bypass

# Guardian automation to prevent white-only lights from turning on during party mode
- id: 'party_white_light_guardian'
  alias: 'Party » Weisslicht Wächter'
  description: Schaltet Weiss-Lichter sofort aus wenn sie während Party eingeschaltet werden
  mode: queued
  max: 20
  triggers:
  - trigger: state
    entity_id:
    # Wohnzimmer
    - light.ikea_light_18_wand_1
    - light.ikea_light_19_wand_2
    - light.ikea_light_20_wand_3
    - light.ikea_light_21_wand_4
    - light.ikea_light_22_wand_5
    - light.ikea_light_23_wand_6
    # Küche
    - light.ikea_light_14_decke_1
    - light.ikea_light_15_decke_2
    # Flur
    - light.ikea_light_07_decke_1
    - light.ikea_light_08_decke_2
    - light.ikea_light_09_decke_3
    - light.ikea_light_10_decke_4
    - light.ikea_light_11_decke_5
    - light.ikea_light_12_decke_6
    # Schlafzimmer
    - light.ikea_light_16_1
    - light.ikea_light_17_2
    # Ankleide
    - light.ikea_light_01
    - light.ikea_light_02
    # Kinderzimmer
    - light.ikea_light_13
    to: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.party
      state: 'on'
    - condition: state
      entity_id: input_boolean.party_wohnzimmer
      state: 'on'
  - alias: "Leselicht nicht ausschalten"
    condition: template
    value_template: >
      {{ trigger.entity_id != 'light.ikea_light_19_wand_2' or
         is_state('input_boolean.leselicht', 'off') }}
  actions:
  - action: light.turn_off
    target:
      entity_id: "{{ trigger.entity_id }}"
    data:
      transition: 1

- id: party_auto_timer
  alias: Scenen » Party Auto-Timer
  description: Warnung nach 3h, Auto-Aus nach 3h15min
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.party
    to: 'on'
    for: "03:00:00"
    id: warn
  - trigger: state
    entity_id: input_boolean.party
    to: 'on'
    for: "03:15:00"
    id: stop
  - trigger: state
    entity_id: input_boolean.party
    to: 'on'
    id: started
  - trigger: homeassistant
    event: start
    id: reconcile
  conditions: []
  variables:
    party_elapsed: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.party_start_time'), 0)) | int(0) }}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: started
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.party_start_time
        data:
          datetime: "{{ now().isoformat() }}"
    - conditions:
      - condition: trigger
        id: reconcile
      - condition: state
        entity_id: input_boolean.party
        state: 'on'
      - condition: template
        value_template: "{{ party_elapsed >= 10800 and party_elapsed < 11700 }}"
      sequence:
      - action: notify.family
        data:
          title: "Party-Modus"
          message: "Party läuft seit 3 Stunden. In 15 Minuten wird automatisch deaktiviert."
          data:
            tag: party_timer
            push:
              interruption-level: time-sensitive
    - conditions:
      - condition: trigger
        id: reconcile
      - condition: state
        entity_id: input_boolean.party
        state: 'on'
      - condition: template
        value_template: "{{ party_elapsed >= 11700 }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party
      - action: notify.family
        data:
          title: "Party-Modus beendet"
          message: "Automatisch deaktiviert nach 3 Stunden 15 Minuten."
          data:
            tag: party_timer
    - conditions:
      - condition: trigger
        id: warn
      sequence:
      - action: notify.family
        data:
          title: "Party-Modus"
          message: "Party läuft seit 3 Stunden. In 15 Minuten wird automatisch deaktiviert."
          data:
            tag: party_timer
            push:
              interruption-level: time-sensitive
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party
      - action: notify.family
        data:
          title: "Party-Modus beendet"
          message: "Automatisch deaktiviert nach 3 Stunden 15 Minuten."
          data:
            tag: party_timer
