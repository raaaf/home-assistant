# Helpers - Automation.Yaml
# Generated by automation splitter - 6 automations
# Part of Home Assistant configuration

- id: '1733060000001'
  alias: Helper » HomePod Pre-Wake
  description: 'Weckt alle HomePods 10 Minuten vor der Aufwachzeit auf, damit sie für
    die Musik-Automation bereit sind.

    '
  triggers:
  - trigger: template
    value_template: >
      {% set wake_time = states('sensor.wakeup_light_timestamp') %}
      {% if wake_time not in ['unknown', 'unavailable', 'none'] %}
        {% set wake_dt = as_datetime(wake_time) %}
        {% if wake_dt is not none %}
          {% set pre_wake = wake_dt - timedelta(minutes=10) %}
          {{ now() >= pre_wake and now() < wake_dt }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}
    id: pre-wake
  conditions:
  - condition: state
    entity_id: input_boolean.alle_sind_weg
    state: 'off'
  - condition: template
    value_template: "{{ has_value('input_boolean.alle_sind_weg') }}"
  - condition: time
    after: 04:50:00
    before: '10:00:00'
  actions:
  # Je Geraet ein eigener fire-and-forget-Lauf, um 5 s versetzt. Ein einzelner
  # turn_on auf alle sechs HomePods gleichzeitig hat am 11.08. um 06:20:00
  # sekundengenau einen Disconnect-Burst ueber alle apple_tv-Geraete ausgeloest.
  # Getrennte Laeufe heissen ausserdem: ein haengendes Geraet blockiert die
  # anderen nicht, und der pyatv-TimeoutError kann die Automation nicht killen.
  - action: script.turn_on
    alias: "HomePods versetzt aufwecken (fire-and-forget)"
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.arbeitszimmer
        start_delay: 0
  - action: script.turn_on
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.schlafzimmer
        start_delay: 5
  - action: script.turn_on
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.homepod_badezimmer
        start_delay: 10
  - action: script.turn_on
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.homepod_kinderzimmer
        start_delay: 15
  - action: script.turn_on
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.homepod_wohnzimmer
        start_delay: 20
  - action: script.turn_on
    target:
      entity_id: script.homepod_wake
    data:
      variables:
        target_player: media_player.kuche
        start_delay: 25
  - action: logbook.log
    data:
      name: HomePod Pre-Wake
      message: 'HomePods aufgeweckt um {{ now().strftime(''%H:%M'') }} - 10 Min vor Wakeup-Zeit'
      domain: automation
  mode: single

- id: '1696241451967'
  alias: Helper » Workday Musik
  description: 'Startet sanfte Musik zum Aufwachen an Werktagen. Nutzt alle HomePods
    (5 Minis + 1 großer) in einer Gruppe.

    '
  triggers:
  - at: sensor.wakeup_light_timestamp
    trigger: time
    id: wakeup-time
  conditions:
  - condition: state
    entity_id: input_boolean.alle_sind_weg
    state: 'off'
  - condition: template
    value_template: "{{ has_value('input_boolean.alle_sind_weg') }}"
  - condition: time
    after: 05:00:00
    before: '10:00:00'
  actions:
  # Apple Home startet die Wiedergabe unzuverlaessig (19.08.2026: Timeout ohne
  # Playback, 18.08. ok). Darum bis zu 3 Trigger-Pulse, bis ein HomePod spielt.
  # Kein automation-level "variables" fuer den Playing-Check: das wird nur einmal
  # beim Trigger gerendert und wuerde dauerhaft false bleiben.
  - alias: "HomeKit-Trigger pulsen bis Musik spielt (max. 3 Versuche)"
    repeat:
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.werktag_aufwachen
          - input_boolean.werktag_musik
      - delay: 00:00:05
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.werktag_musik
          - input_boolean.werktag_aufwachen
      - alias: "Warten bis Musik spielt"
        wait_template: "{{ ['media_player.arbeitszimmer', 'media_player.schlafzimmer', 'media_player.homepod_badezimmer', 'media_player.homepod_kinderzimmer', 'media_player.homepod_wohnzimmer', 'media_player.kuche'] | select('is_state', 'playing') | list | length > 0 }}"
        timeout: 00:00:25
        continue_on_timeout: true
      until:
      - condition: template
        value_template: "{{ wait.completed or repeat.index >= 3 }}"
  # wait.completed der letzten Iteration ist das Ergebnis der Schleife.
  - variables:
      musik_laeuft: "{{ wait.completed | default(false) }}"
  # Kein eigener Volume-Fade mehr: den 30-Minuten-Fade der HomePods macht
  # "State » Tag/Nacht" (Wakeup); zwei parallele Fades auf dieselben Player
  # liefen gegeneinander.
  - alias: "Ergebnis ehrlich protokollieren"
    action: logbook.log
    data:
      name: Guten Morgen Musik
      message: >-
        {% if musik_laeuft %}Wakeup Musik gestartet um {{
        as_timestamp(states('sensor.wakeup_light_timestamp')) |
        timestamp_custom('%H:%M') }} (Fade uebernimmt Tag/Nacht) - Laeuft: {{
        state_attr('media_player.homepod_wohnzimmer', 'media_title') |
        default('Apple Home Musik') }}{% else %}FEHLGESCHLAGEN: Apple Home hat
        nach 3 Versuchen keine Wiedergabe gestartet{% endif %}
      domain: automation
  - alias: "Bei Fehlschlag benachrichtigen"
    if:
    - condition: template
      value_template: "{{ not musik_laeuft }}"
    then:
    - action: notify.rafael
      data:
        title: Wakeup-Musik fehlgeschlagen
        message: Apple Home hat nach 3 Versuchen keine Wiedergabe gestartet.
  mode: single
