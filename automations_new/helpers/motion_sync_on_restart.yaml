# Helpers - Motion Sync On Restart.Yaml
# Syncs the physical bedroom pair (motion_schlafzimmer, AL arbeitszimmer) with scene booleans after HA restart.
# All other rooms are handled by Helper » Motion/AL Sollzustand (room_policy.yaml).
# Part of Home Assistant configuration

- id: '1738000000001'
  alias: Helper » Sync Motion & Adaptive Lighting After Restart
  description: 'Deckt nach einem Neustart nur noch das physische Schlafzimmer ab (Schlafzimmer-Bewegungsmelder und Adaptive Beleuchtung Arbeitszimmer). Alle übrigen Räume erledigt Helper » Motion/AL Sollzustand.'
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - delay:
      seconds: 30
  # ADAPTIVE LIGHTING SYNC
  - alias: "Disable office adaptive lighting if gaming active"
    choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.gaming
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_arbeitszimmer
  # MOTION AUTOMATION SYNC
  - alias: "Disable bedroom motion if gaming mode is active"
    choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.gaming
        state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.motion_schlafzimmer  # Bedroom motion
        data: {}
  - alias: "Disable bedroom motion if party mode is active"
    choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.party
        state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.motion_schlafzimmer  # Bedroom motion
        data: {}
  mode: single
