# Notifications - Monitoring.Yaml
# Generated by automation splitter - 5 automations
# Part of Home Assistant configuration

- id: '1645110903677'
  alias: Notification » Es gibt nicht erreichbare Geräte
  description: Sendet werktags um 10 Uhr eine E-Mail bei nicht erreichbaren Geräten
  use_blueprint:
    path: gmlupatelli/unavailable_entities_notification.yaml
    input:
      time: '10:00:00'
      actions:
      - action: notify.rafael
        data:
          title: "Nicht erreichbare Geräte"
          message: '{{entities}}'
      - action: persistent_notification.create
        data:
          title: "Nicht erreichbare Geräte"
          message: '{{entities}}'
          notification_id: unavailable_entities
      monday_enabled: true
      tuesday_enabled: true
      wednesday_enabled: true
      thursday_enabled: true
      friday_enabled: true
      saturday_enabled: false
      sunday_enabled: false
- id: '1665868733806'
  alias: Notification » Luftfeuchtigkeit 15:00
  description: Sendet tägliche Benachrichtigung bei Luftfeuchtigkeit über 60%
  use_blueprint:
    path: migsun/high-humidity-level-detection-notification-for-all-humidity-sensors.yaml
    input:
      threshold: 60
      time: '15:00:00'
      actions:
      - action: notify.family
        data:
          title: Luftfeuchtigkeit
          message: '{{sensors}}'
      exclude:
        entity_id:
        - sensor.aqara_climate_05_humidity
        - sensor.tuya_climate_01_humidity
- id: '1726065861905'
  alias: Notifications » Niedriger Batteriestand
  description: Benachrichtigt bei niedrigem Batteriestand (unter 10%) von Geräten
  use_blueprint:
    path: Blackshome/low-battery-notifications-and-actions.yaml
    input:
      include_time: time_enabled
      time: '10:00:00'
      include_persistent_notification: enable_persistent_notification
      battery_level: 10
- id: '1754557053144'
  alias: Helper » Unbekannte Geräte reparieren
  description: Versucht Geräte mit 'unknown' Status zu reaktivieren
  triggers:
  - minutes: 0
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - variables:
      unknown_devices: "{{ states | selectattr('state', 'eq', 'unknown') \n   | rejectattr('domain',\
        \ 'in', ['automation', 'script', 'scene']) \n   | list }}\n"
      unknown_count: '{{ unknown_devices | length }}'
  - condition: template
    value_template: "{{ unknown_count | int > 0 }}"
  - action: system_log.write
    data:
      message: Found {{ unknown_count }} devices with unknown state - attempting recovery
      level: info
  - if:
    - condition: template
      value_template: '{{ unknown_devices | selectattr(''entity_id'', ''match'', ''.*_motion_.*|.*_kontaktsensor_.*'') | list | length > 0 }}'
    then:
    - action: homeassistant.update_entity
      target:
        entity_id: "{{ unknown_devices | selectattr('entity_id', 'match', '.*_motion_.*|.*_kontaktsensor_.*') | map(attribute='entity_id') | list }}"
  - if:
    - condition: template
      value_template: '{{ unknown_devices | selectattr(''domain'', ''eq'', ''cover'')
        | list | length > 0 }}

        '
    then:
    - action: cover.stop_cover
      target:
        entity_id: "{{ unknown_devices \n   | selectattr('domain', 'eq', 'cover')\
          \ \n   | map(attribute='entity_id') \n   | list }}\n"
      continue_on_error: true
    - action: homeassistant.update_entity
      target:
        entity_id: "{{ unknown_devices \n   | selectattr('domain', 'eq', 'cover')\
          \ \n   | map(attribute='entity_id') \n   | list }}\n"
  - if:
    - condition: state
      entity_id: sensor.luftfeuchtigkeit_aussen
      state: unknown
    - condition: template
      value_template: "{{ (now() - states.sensor.luftfeuchtigkeit_aussen.last_changed).total_seconds() > 300 }}"
    - condition: template
      value_template: " {% set last = this.attributes.last_triggered %}\n    {{ last is none or (now() - last).total_seconds()\
        \ > 3600 }}"
    then:
    - action: system_log.write
      data:
        message: Außensensor offline - prüfe Batterie!
        level: warning
    - action: notify.rafael
      data:
        title: "Außensensor offline"
        message: "Der Außensensor liefert keine Daten. Bitte Batterie prüfen."
    - action: persistent_notification.create
      data:
        title: "Außensensor offline"
        message: "Der Außensensor liefert keine Daten. Bitte die Batterie des Sensors überprüfen."
        notification_id: aussensensor_offline
  mode: single
- id: '1725893400001'
  alias: Security » Haustür Überwachung
  description: Überwacht Haustür bei Abwesenheit und trackt Besuchsdauer
  triggers:
    - entity_id: binary_sensor.aqara_contact_04
      from: 'off'
      to: 'on'
      id: door_opened
      trigger: state
    - entity_id: input_boolean.alle_sind_weg
      from: 'on'
      to: 'off'
      id: resident_returned
      trigger: state
  conditions: []
  actions:
    - variables:
        beide_weg: "{{ has_value('input_boolean.alle_sind_weg') and is_state('input_boolean.alle_sind_weg', 'on') }}"
        besucher_inside: "{{ has_value('input_boolean.haustur_besucher_inside') and is_state('input_boolean.haustur_besucher_inside', 'on') }}"
        aktueller_zeitstempel: "{{ now() }}"
        formatierte_zeit: "{{ now().strftime('%A, %H:%M Uhr, %d.%m.%Y') }}"
    - choose:
        - alias: "Tür öffnet sich - beide sind weg"
          conditions:
            - condition: trigger
              id: door_opened
            - condition: template
              value_template: "{{ beide_weg }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not besucher_inside }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.haustur_besucher_inside
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.haustur_eingang_zeit
                  data:
                    datetime: "{{ aktueller_zeitstempel }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.haustur_letzter_eingang
              data:
                datetime: "{{ aktueller_zeitstempel }}"
            - action: script.notify_critical
              data:
                tag: door_security
                group: security_alerts
                title: "SICHERHEITSALARM, Haustür geöffnet"
                message: >
                  Die Haustür wurde um {{ formatierte_zeit }} geöffnet,
                  obwohl niemand zuhause ist!
            - action: system_log.write
              data:
                message: >
                  SECURITY: Haustür geöffnet bei Abwesenheit um {{ aktueller_zeitstempel }}
                level: warning
        - alias: "Bewohner kommt zurück - Besuchsüberwachung beenden"
          conditions:
            - condition: trigger
              id: resident_returned
            - condition: template
              value_template: "{{ besucher_inside }}"
          sequence:
            - variables:
                eingang_zeit: "{{ states('input_datetime.haustur_eingang_zeit') }}"
                besuchsdauer_sekunden: >
                  {{ (as_timestamp(now()) - as_timestamp(states('input_datetime.haustur_eingang_zeit'))) | int }}
                besuchsdauer_minuten: "{{ (besuchsdauer_sekunden / 60) | round(1) }}"
                besuchsdauer_stunden: "{{ (besuchsdauer_sekunden / 3600) | round(1) }}"
                formatierte_dauer: >
                  {% if besuchsdauer_sekunden < 60 %}
                    {{ besuchsdauer_sekunden }} Sekunden
                  {% elif besuchsdauer_sekunden < 3600 %}
                    {{ besuchsdauer_minuten }} Minuten
                  {% else %}
                    {{ besuchsdauer_stunden }} Stunden
                  {% endif %}
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.haustur_besucher_inside
            - action: input_text.set_value
              target:
                entity_id: input_text.haustur_besucher_dauer
              data:
                value: "{{ formatierte_dauer }}"
            - action: system_log.write
              data:
                message: >
                  SECURITY: Besuchsüberwachung durch Rückkehr eines Bewohners beendet. Dauer seit Türöffnung: {{ formatierte_dauer }}
                level: info
        - alias: "Tür öffnet sich - jemand kommt nach Hause"
          conditions:
            - condition: trigger
              id: door_opened
            - condition: template
              value_template: "{{ not beide_weg }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.haustur_letzter_eingang
              data:
                datetime: "{{ aktueller_zeitstempel }}"
            - action: system_log.write
              data:
                message: "INFO: Haustür geöffnet - jemand ist zuhause"
                level: info
  mode: restart
- id: '1754557053145'
  alias: Notification » Bewegungsmelder ausgefallen
  description: Benachrichtigt wenn kritische Bewegungsmelder länger als 30 Minuten nicht verfügbar sind
  triggers:
  - entity_id:
    - binary_sensor.ikea_motion_09
    - binary_sensor.ikea_motion_03_occupancy
    - binary_sensor.ikea_motion_07
    - binary_sensor.ikea_motion_06
    - binary_sensor.tuya_motion_03_motion_presence
    - binary_sensor.tuya_motion_02_presence
    - binary_sensor.tuya_motion_01_presence
    - binary_sensor.ikea_motion_02
    to:
    - unavailable
    - unknown
    for:
      minutes: 30
    trigger: state
  conditions: []
  actions:
  - variables:
      sensor_name: '{{ trigger.to_state.name }}'
      sensor_id: '{{ trigger.entity_id }}'
      duration: '{{ relative_time(trigger.from_state.last_changed) }}'
  - parallel:
    - action: script.notify_critical
      data:
        tag: motion_sensor_failure
        group: system_alerts
        title: "Bewegungsmelder ausgefallen"
        message: "{{ sensor_name }} ist seit {{ duration }} nicht verfügbar ({{ sensor_id }})"
    - action: persistent_notification.create
      data:
        title: "Bewegungsmelder ausgefallen, {{ sensor_name }}"
        message: >
          Sensor: {{ sensor_name }} ({{ sensor_id }})
          Status: {{ trigger.to_state.state }}
          Ausgefallen seit: {{ duration }}
          Bitte prüfen: Batterie, Zigbee-Verbindung, Position
        notification_id: "motion_sensor_{{ sensor_id | replace('.', '_') }}"
  - action: logbook.log
    data:
      name: Bewegungsmelder ausgefallen
      message: '{{ sensor_name }} ({{ sensor_id }}) ist seit {{ duration }} nicht verfügbar'
      domain: automation
  mode: queued
  max: 10
- id: '1754557053146'
  alias: Helper » Bewegungsmelder-Recovery nach Neustart
  description: Meldet kritische Bewegungsmelder, die beim Start oder Reconcile länger als 30 Minuten nicht verfügbar sind
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: "/30"
  variables:
    stale_sensors: >
      {% set cutoff = now() - timedelta(minutes=30) %}
      {{ expand([
        'binary_sensor.ikea_motion_09',
        'binary_sensor.ikea_motion_03_occupancy',
        'binary_sensor.ikea_motion_07',
        'binary_sensor.ikea_motion_06',
        'binary_sensor.tuya_motion_03_motion_presence',
        'binary_sensor.tuya_motion_02_presence',
        'binary_sensor.tuya_motion_01_presence',
        'binary_sensor.ikea_motion_02'
      ]) | selectattr('state', 'in', ['unavailable', 'unknown'])
         | selectattr('last_changed', 'lt', cutoff)
         | map(attribute='entity_id') | list }}
  conditions:
  - condition: template
    value_template: "{{ stale_sensors | count > 0 }}"
  actions:
  - repeat:
      for_each: "{{ stale_sensors }}"
      sequence:
      - variables:
          sensor_id: "{{ repeat.item }}"
          sensor_name: "{{ state_attr(repeat.item, 'friendly_name') or repeat.item }}"
          duration: "{{ relative_time(states[repeat.item].last_changed) }}"
      - parallel:
        - action: script.notify_critical
          data:
            tag: motion_sensor_failure
            group: system_alerts
            title: "Bewegungsmelder ausgefallen"
            message: "{{ sensor_name }} ist seit {{ duration }} nicht verfügbar ({{ sensor_id }})"
        - action: persistent_notification.create
          data:
            title: "Bewegungsmelder ausgefallen, {{ sensor_name }}"
            message: >
              Sensor: {{ sensor_name }} ({{ sensor_id }})
              Status: {{ states(repeat.item) }}
              Ausgefallen seit: {{ duration }}
              Bitte prüfen: Batterie, Zigbee-Verbindung, Position
            notification_id: "motion_sensor_{{ sensor_id | replace('.', '_') }}"
  mode: single
- id: 'appletv_wohnzimmer_watchdog'
  alias: Helper » AppleTV Wohnzimmer Watchdog
  description: >-
    Laeuft Movie-Mode ueber den AppleTV-Eingang (CBL/SAT), waehrend HA den
    Wohnzimmer-AppleTV als off/unavailable sieht, ist die apple_tv-Verbindung
    eingefroren. Dann Config-Entry neu laden, damit der TV-Timer den AppleTV
    spaeter schlafen legen kann (sonst weckt er per CEC alles wieder auf).
  triggers:
  - trigger: state
    entity_id: input_boolean.movie
    to: 'on'
    for: "00:05:00"
    id: movie-start
  - trigger: time_pattern
    minutes: "/30"
    id: check
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  - condition: state
    entity_id: input_boolean.movie
    state: 'on'
  - condition: template
    value_template: "{{ states('media_player.wohnzimmer') in ['off', 'unavailable', 'unknown'] }}"
  - condition: template
    value_template: >
      {{ trigger.id != 'startup' or
         as_timestamp(now()) - as_timestamp(states.media_player.wohnzimmer.last_changed, 0) >= 300 }}
  - alias: "Denon spielt vom AppleTV-Eingang"
    condition: template
    value_template: "{{ state_attr('media_player.denon_avr_x3200w', 'source') == 'CBL/SAT' }}"
  actions:
  - action: homeassistant.reload_config_entry
    target:
      entity_id: media_player.wohnzimmer
  - action: notify.admin_only
    data:
      title: "AppleTV Watchdog"
      message: "AppleTV Wohnzimmer war eingefroren (Movie-Mode aktiv, Entity {{ states('media_player.wohnzimmer') }}). Integration neu geladen."
  - action: persistent_notification.create
    data:
      title: "AppleTV Watchdog"
      message: "AppleTV-Wohnzimmer-Verbindung war waehrend Movie-Mode eingefroren und wurde neu geladen."
      notification_id: appletv_watchdog
  mode: single
- id: 'homepod_unavailable_recovery'
  alias: Helper » HomePod-Recovery nach Neustart
  description: Lädt beim Start oder Reconcile HomePod-Config-Entries neu, die länger als 15 Minuten nicht verfügbar sind
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: "/15"
  variables:
    stale_homepods: >
      {% set cutoff = now() - timedelta(minutes=15) %}
      {{ expand([
        'media_player.homepod_wohnzimmer',
        'media_player.homepod_badezimmer',
        'media_player.homepod_kinderzimmer',
        'media_player.arbeitszimmer',
        'media_player.schlafzimmer',
        'media_player.kuche'
      ]) | selectattr('state', 'eq', 'unavailable')
         | selectattr('last_changed', 'lt', cutoff)
         | map(attribute='entity_id') | list }}
  conditions:
  - condition: template
    value_template: "{{ stale_homepods | count > 0 }}"
  actions:
  - repeat:
      for_each: "{{ stale_homepods }}"
      sequence:
      - action: homeassistant.reload_config_entry
        continue_on_error: true
        target:
          entity_id: "{{ repeat.item }}"
      - action: logbook.log
        data:
          name: HomePod-Recovery
          message: "{{ repeat.item }} war beim Start länger als 15 Minuten unavailable, Config-Entry neu geladen."
          domain: automation
  mode: single
- id: 'homepod_unavailable_watchdog'
  alias: Helper » HomePod Watchdog
  description: >-
    Bleibt ein HomePod laenger als 15 Minuten unavailable, ist die
    pyatv-Verbindung tot und kommt oft erst mit einem Reload des
    Config-Entries wieder (gleiches Muster wie der AppleTV-Watchdog,
    aber ohne Movie-Kopplung). Normales Standby ist "paused"/"standby",
    nicht "unavailable", darum keine Fehlalarme im Alltag.
  triggers:
  - trigger: state
    entity_id:
    - media_player.homepod_wohnzimmer
    - media_player.homepod_badezimmer
    - media_player.homepod_kinderzimmer
    - media_player.arbeitszimmer
    - media_player.schlafzimmer
    - media_player.kuche
    to: 'unavailable'
    for: "00:15:00"
  actions:
  - action: homeassistant.reload_config_entry
    continue_on_error: true
    target:
      entity_id: "{{ trigger.entity_id }}"
  - action: logbook.log
    data:
      name: HomePod Watchdog
      message: "{{ trigger.entity_id }} war 15 Min unavailable, Config-Entry neu geladen."
      domain: automation
  - alias: "Push nur wenn der Reload nicht geholfen hat"
    delay: 00:02:00
  - if:
    - condition: template
      value_template: "{{ states(trigger.entity_id) == 'unavailable' }}"
    then:
    - action: notify.admin_only
      data:
        title: "HomePod Watchdog"
        message: "{{ trigger.entity_id }} ist trotz Reload weiter unavailable."
  mode: queued
  max: 6
- id: 'appletv_disconnect_logger'
  alias: Helper » AppleTV Disconnect Logger
  description: >-
    Schreibt jedes apple_tv-Logevent mit Zeitstempel ins Logbook. Noetig, weil
    system_log/list dedupliziert, beim Neustart geleert wird und auf diesem
    System keine aktuelle home-assistant.log auf dem Share liegt. Erst damit
    sind Periodizitaet und Korrelation der Disconnects auswertbar.
  triggers:
  - trigger: event
    event_type: system_log_event
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.name == 'homeassistant.components.apple_tv' }}"
  actions:
  - action: logbook.log
    data:
      name: AppleTV
      message: >-
        {{ trigger.event.data.level }} | {{ (trigger.event.data.message | first) | truncate(200, true) }}
  mode: queued
  max: 50
