# System - Core.Yaml
# Generated by automation splitter - 2 automations
# Part of Home Assistant configuration

- id: '1642085317177'
  alias: Helpers » Fenster / Türen
  description: Push beim Verlassen des Hauses und bei offenen Fenstern unter kritischen Bedingungen
  mode: restart
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: input_boolean.alle_sind_weg
    to: 'on'
    id: leaving
  - trigger: state
    entity_id: binary_sensor.fenster_tueren
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: critical_open
  conditions: []
  actions:
  - variables:
      open_elements: "{{ expand(state_attr('binary_sensor.fenster_tueren', 'entity_id'))\
        \ \n   | selectattr('state', 'in', ['on', 'open']) \n   | map(attribute='name')\
        \ | join(', ') | default('Unbekannt', true) }}\n"
      is_cold_outside: '{{ states(''sensor.temperatur_aussen'') | float(20) < 5 }}

        '
      is_bad_weather: "{{ states('weather.fuerth_bayern') in ['rainy', 'snowy', 'windy']\
        \ or \n   states('sensor.luftfeuchtigkeit_aussen') | float(50) > 85 }}\n"
      heating_active: '{{ (has_value(''climate.ac'') and is_state(''climate.ac'', ''heat''))
        or (states.switch | selectattr(''entity_id'', ''match'', ''switch.heizung_'')
        | selectattr(''state'', ''eq'', ''on'') | list | count > 0) }}

        '
      is_critical_situation: '{{ is_cold_outside or (is_bad_weather and heating_active)
        }}

        '
  - choose:
    - alias: Benachrichtigung beim Verlassen des Hauses
      conditions:
      - condition: trigger
        id: leaving
      - alias: Fenster/Türen sind offen
        condition: state
        entity_id: binary_sensor.fenster_tueren
        state: 'on'
      sequence:
      - alias: Push-Benachrichtigung beim Verlassen
        action: notify.family
        continue_on_error: true
        data:
          title: "Fenster oder Türen noch offen"
          message: 'Beim Verlassen des Hauses: {{ open_elements }} {% if is_cold_outside
            %}(Außentemperatur: {{ states(''sensor.temperatur_aussen'') }}°C){% endif
            %}{% if is_bad_weather %} - Schlechtes Wetter!{% endif %}'
          data:
            priority: high
            tag: fenster_tueren_verlassen
      - alias: Verlassen mit offenen Fenstern loggen
        action: logbook.log
        data:
          name: Fenster/Türen beim Verlassen
          message: 'Haus verlassen mit offenen Fenstern/Türen: {{ open_elements }}

            '
    - alias: Fenster/Türen offen bei kritischen Bedingungen - Push (nur wenn zuhause)
      conditions:
      - condition: trigger
        id: critical_open
      - alias: Jemand ist zuhause
        condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      - alias: Nur bei Kaelte oder Schlechtwetter mit laufender Heizung
        condition: template
        value_template: '{{ is_critical_situation }}'
      sequence:
      - alias: Push-Benachrichtigung bei kritischen Bedingungen
        action: notify.family
        continue_on_error: true
        data:
          title: "Fenster oder Türen offen"
          message: 'Seit 10 Minuten offen: {{ open_elements }}{% if is_cold_outside
            %} (Außentemperatur: {{ states(''sensor.temperatur_aussen'') }}°C){% endif
            %}{% if is_bad_weather %} - Schlechtes Wetter!{% endif %}'
          data:
            tag: fenster_tueren_kritisch
      - alias: Kritische Warnung in Logbuch eintragen
        action: logbook.log
        data:
          name: Fenster/Türen Warnung
          message: 'Seit 10 Min offen bei kritischen Bedingungen: {{ open_elements }}.
            Außentemp {{ states(''sensor.temperatur_aussen'') }}°C, Wetter {{ states(''weather.fuerth_bayern'')
            }}, Heizung {{ ''an'' if heating_active else ''aus'' }}

            '
- id: '1740754575040'
  alias: System » Zentrale Fehlerbehandlung
  description: >-
    Schreibt Warnungen und Fehler aus dem System-Log ins Logbuch. Nur Logbuch,
    keine Pushes. Bekanntes Verbindungsrauschen (Cowboy, Denon, AppleTV, MQTT)
    wird ausgefiltert.
  triggers:
  - event_type: system_log_event
    trigger: event
  - entity_id:
    - input_text.fehlerprotokoll
    trigger: state
  conditions:
  - "{{ trigger.platform == 'event' or (trigger.platform == 'state'
      and trigger.to_state.state != trigger.from_state.state) }}"
  actions:
  - variables:
      error_message: "{% if trigger.platform == 'event' %}{% set message = trigger.event.data.message | default('Unbekannter Systemfehler') %}{% if message is string %}{{ message }}{% else %}{{ message | join('\\n') }}{% endif %}{% else %}{{ trigger.to_state.state }}{% endif %}"
      error_severity: "{% if trigger.platform == 'event' %}{{ {'CRITICAL': 'Kritisch', 'ERROR': 'Kritisch', 'WARNING': 'Warnung', 'WARN': 'Warnung'}.get(trigger.event.data.level | default('INFO') | upper, 'Info') }}{% else %}Info{% endif %}"
      error_entity: "{% if trigger.platform == 'event' %}{{ trigger.event.data.source | default('unbekannt') }}{% else %}{{ trigger.entity_id | default('unbekannt') }}{% endif %}"
      is_self_generated: >-
        {% if trigger.platform != 'event' %}
          false
        {% else %}
          {% set details = (
            (trigger.event.data.message | default('') | string) ~ ' ' ~
            (trigger.event.data.exception | default('') | string) ~ ' ' ~
            (trigger.event.data.name | default('') | string) ~ ' ' ~
            (trigger.event.data.source | default('') | string)
          ) | lower %}
          {{ ('system » zentrale fehlerbehandlung' in details
              or 'automation.system_zentrale_fehlerbehandlung' in details)
             and 'logbook.log' in details }}
        {% endif %}
      ist_rauschen: >-
        {% if trigger.platform != 'event' %}
          false
        {% else %}
          {% set details = (
            (trigger.event.data.message | default('') | string) ~ ' ' ~
            (trigger.event.data.source | default('') | string)
          ) | lower %}
          {{ details is search(
               'cowboy api|denon avr receiver|connection (lost to|was re-established to)|'
               ~ 'mqtt disconnect|connection reset by peer|is available again') }}
        {% endif %}
  - alias: "Eigene Meldungen und bekanntes Verbindungsrauschen ignorieren"
    condition: template
    value_template: "{{ not (is_self_generated | bool) and not (ist_rauschen | bool) }}"
  - data:
      name: Systemfehler
      message: '{{ error_severity }}: {{ error_message }} ({{ error_entity }})'
    action: logbook.log
  mode: queued
  max: 10

- id: '1733679600000'
  alias: System » Z2M OTA Updates
  description: Checks for and triggers Zigbee2MQTT OTA firmware updates daily at 19:30
  mode: single
  triggers:
    - trigger: time_pattern
      hours: '19'
      minutes: '30'
  conditions: []
  actions:
    - alias: Get list of Z2M devices needing an update
      variables:
        update_entities: >
          {{ integration_entities('mqtt')
             | select('match', '^update\\.')
             | select('is_state', 'on')
             | reject('is_state_attr', 'in_progress', true)
             | list }}
    - alias: Run OTA update on devices with updates
      repeat:
        for_each: '{{ update_entities }}'
        sequence:
          - alias: Get Z2M device name from entity
            variables:
              triggered_entity: '{{ repeat.item }}'
              device_name: >
                {{ repeat.item | replace('update.', '') | regex_replace('_firmware$|_update$', '') }}
          - alias: Send MQTT message to Z2M to request update
            action: mqtt.publish
            data:
              qos: '0'
              retain: false
              topic: zigbee2mqtt/bridge/request/device/ota_update/update
              payload: '{"id": "{{ device_name }}"}'
          - alias: Wait a minute for the Z2M update to start
            wait_template: "{{ is_state_attr(triggered_entity, 'in_progress', true) }}"
            timeout: '00:01:00'
            continue_on_timeout: true
          - alias: Handle OTA start result
            if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - alias: Wait up to 1 hour for the OTA upgrade to finish
                wait_template: "{{ is_state_attr(triggered_entity, 'in_progress', false) }}"
                timeout: '01:00:00'
                continue_on_timeout: true
              - alias: Log OTA completion result
                if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - action: logbook.log
                    data:
                      name: Z2M OTA Update
                      message: 'Firmware update completed for {{ device_name }}'
                else:
                  - action: logbook.log
                    data:
                      name: Z2M OTA Update
                      message: 'Firmware update timed out for {{ device_name }}'
            else:
              - action: logbook.log
                data:
                  name: Z2M OTA Update
                  message: 'Firmware update did not start for {{ device_name }}'

- id: '1740930000000'
  alias: System » Adaptive Lighting Settings nach Neustart
  description: >
    Stellt optimierte AL-Einstellungen nach jedem HA-Neustart wieder her.
    Hintergrund: AL speichert Konfiguration in Config Entries (nicht YAML),
    daher müssen Änderungen via change_switch_settings nach Neustarts neu gesetzt werden.
    Änderungen: separate_turn_on_commands=true (IKEA fade-in: sendet ON, dann brightness separat),
    send_split_delay=300 (300ms Pause zwischen ON und brightness für IKEA),
    initial_transition=2 (2s fade beim Einschalten),
    take_over_control_mode=pause_changed (pausiert nur geänderte Attribute).
    adapt_only_on_bare_turn_on bleibt false - true verursacht 100% Helligkeit beim Einschalten
    via Automationen mit expliziten Werten (wird als manual_control fehlinterpretiert).
    Sleep Mode = 2200K @ 15% (Kueche/Arbeitszimmer-Slug 50%, Balkon 40%, Wohnzimmer/Bad/Flur 30%, Kinderzimmer 5%, Schlafzimmer-Slug 1%),
    CCT-Lichter fallen auf sleep_color_temp 2200K zurueck.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - alias: Kurz warten bis AL-Switches bereit sind
      delay: "00:00:30"
    - alias: AL-Einstellungen für alle Räume setzen
      repeat:
        for_each:
        - schalter: switch.adaptive_lighting_wohnzimmer
          sleep_brightness: 20
        - schalter: switch.adaptive_lighting_kueche
          sleep_brightness: 20
        - schalter: switch.adaptive_lighting_schlafzimmer
          sleep_brightness: 1
        - schalter: switch.adaptive_lighting_kinderzimmer
          sleep_brightness: 5
        - schalter: switch.adaptive_lighting_badezimmer
          sleep_brightness: 10
        - schalter: switch.adaptive_lighting_waschzimmer
          sleep_brightness: 20
        - schalter: switch.adaptive_lighting_arbeitszimmer
          sleep_brightness: 15
        - schalter: switch.adaptive_lighting_ankleide
          sleep_brightness: 20
        - schalter: switch.adaptive_lighting_flur
          sleep_brightness: 10
        - schalter: switch.adaptive_lighting_balkon
          sleep_brightness: 40
        sequence:
        - action: adaptive_lighting.change_switch_settings
          continue_on_error: true
          data:
            entity_id: "{{ repeat.item.schalter }}"
            separate_turn_on_commands: true
            send_split_delay: 300
            initial_transition: 2
            take_over_control_mode: pause_changed
            adapt_only_on_bare_turn_on: false
            sleep_rgb_or_color_temp: color_temp
            sleep_color_temp: 2200
            sleep_brightness: "{{ repeat.item.sleep_brightness }}"
            skip_redundant_commands: false
            include_config_in_attributes: false
            # Ab hier die Felder, die frueher nur in adaptive_lighting.yaml standen und
            # damit ausschliesslich im Config Entry lebten. AL liest das YAML nach dem
            # ersten Import nie wieder, also driftete der Config Entry unbemerkt und nach
            # jedem Neustart galten rund 30 Sekunden lang alte Werte. Werte stammen aus dem
            # Snapshot vom 28.08.2026, sind also verhaltensneutral uebernommen.
            #
            # WICHTIG, am 28.08.2026 einzeln durchgetestet: `interval` ist das einzige
            # dieser Felder, das `change_switch_settings` ABLEHNT (switch.py schliesst
            # interval, name und lights explizit aus). Ein abgelehntes Feld laesst den
            # GANZEN Aufruf mit "extra keys not allowed" scheitern und damit auch alle
            # Felder danach, also niemals `interval` hier ergaenzen. Sein Wert (300 s)
            # lebt allein im Config Entry, nachzulesen im Snapshot unter
            # docs/plans/snapshots/2026-08-28-al-snapshot.json.
            # Die Feldliste in services.yaml ist NICHT das Schema, sie beschreibt nur die
            # UI-Maske: max_sunset_time und andere fehlen dort und funktionieren trotzdem.
            #
            # max_brightness steht bewusst nicht hier: das gehoert
            # "Licht » Tageshelligkeit nach Aussenlicht" (acht Raeume) und den festen
            # Werten weiter unten (Flur, Ankleide).
            transition: 10
            brightness_mode: tanh
            take_over_control: true
            intercept: true
            multi_light_intercept: true
            min_color_temp: 2200
            max_color_temp: 4000
            min_sunrise_time: "05:00:00"
            max_sunrise_time: "07:00:00"
            min_sunset_time: "20:00:00"
            max_sunset_time: "20:30:00"
            adapt_delay: 1
            detect_non_ha_changes: false
            only_once: false
            prefer_rgb_color: false
            sleep_transition: 10
            use_defaults: current
    - alias: "transition_until_sleep: ueberall an, nur der Balkon aus (aussen, kein Uebergang noetig)"
      repeat:
        for_each:
          - schalter: [switch.adaptive_lighting_ankleide, switch.adaptive_lighting_arbeitszimmer, switch.adaptive_lighting_badezimmer, switch.adaptive_lighting_flur, switch.adaptive_lighting_kinderzimmer, switch.adaptive_lighting_kueche, switch.adaptive_lighting_schlafzimmer, switch.adaptive_lighting_waschzimmer, switch.adaptive_lighting_wohnzimmer]
            wert: true
          - schalter: [switch.adaptive_lighting_balkon]
            wert: false
        sequence:
          - action: adaptive_lighting.change_switch_settings
            data:
              entity_id: "{{ repeat.item.schalter }}"
              transition_until_sleep: "{{ repeat.item.wert }}"
              use_defaults: current
    - alias: "min_brightness je Raum (Zuordnung liegt im Skript, siehe scripts.yaml)"
      action: script.al_min_brightness_setzen
    - alias: "autoreset_control_seconds je Raum (drei Gruppen, aus dem Snapshot)"
      repeat:
        for_each:
          - schalter: [switch.adaptive_lighting_arbeitszimmer, switch.adaptive_lighting_kinderzimmer, switch.adaptive_lighting_kueche, switch.adaptive_lighting_schlafzimmer, switch.adaptive_lighting_wohnzimmer]
            wert: 3600
          - schalter: [switch.adaptive_lighting_ankleide, switch.adaptive_lighting_balkon, switch.adaptive_lighting_waschzimmer]
            wert: 7200
          - schalter: [switch.adaptive_lighting_badezimmer, switch.adaptive_lighting_flur]
            wert: 900
        sequence:
          - action: adaptive_lighting.change_switch_settings
            data:
              entity_id: "{{ repeat.item.schalter }}"
              autoreset_control_seconds: "{{ repeat.item.wert }}"
              use_defaults: current
    - alias: Flur und Ankleide feste Tagesobergrenze (kein Tageslicht, Aussenlicht ist dort kein Signal)
      action: adaptive_lighting.change_switch_settings
      data:
        entity_id: switch.adaptive_lighting_flur
        max_brightness: 80
        use_defaults: current
    - alias: Ankleide volle Obergrenze (dort wird Kleidung gesucht)
      action: adaptive_lighting.change_switch_settings
      data:
        entity_id: switch.adaptive_lighting_ankleide
        max_brightness: 100
        use_defaults: current
    - alias: Abschluss loggen
      action: logbook.log
      data:
        name: Adaptive Lighting Setup
        message: >
          AL-Einstellungen nach Neustart gesetzt (10 Räume):
          separate_turn_on_commands=true, send_split_delay=300, initial_transition=2,
          take_over_control_mode=pause_changed, adapt_only_on_bare_turn_on=false,
          skip_redundant_commands=false, include_config_in_attributes=false,
          sleep_color_temp=2200 @ raumbezogener sleep_brightness (Balkon 40, Kueche/Wohnzimmer/Waschzimmer/Ankleide 20, Bett 15, Bad/Flur 10, Kinderzimmer 5, Stehlampe 1),
          dazu 16 gemeinsame Felder (transition, brightness_mode, take_over_control, intercept,
          multi_light_intercept, Farbtemperaturen, Sonnenzeiten, adapt_delay, sleep_transition)
          sowie min_brightness, autoreset_control_seconds und transition_until_sleep je Raumgruppe.
          Nicht gesetzt: interval (Service lehnt es ab, lebt im Config Entry) und max_brightness
          (gehoert der Tageshelligkeits-Automation bzw. den festen Werten fuer Flur und Ankleide)
