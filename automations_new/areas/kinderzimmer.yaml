# Areas - Kinderzimmer.Yaml
# Generated by automation splitter - 4 automations
# Part of Home Assistant configuration

- id: '1692710690350'
  alias: Motion » Kinderzimmer
  description: Bewegungsgesteuerte Beleuchtung im Kinderzimmer mit Nachtlicht-Modus
    und Helligkeitssensor
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.tuya_motion_02_presence
      light_switch:
        entity_id: light.alle_kinderzimmer_lichter
      include_ambient: ambient_enabled
      ambient_light_sensor: sensor.kinderzimmer_illuminance_safe
      include_night_lights: night_lights_enabled
      night_lights:
        entity_id: light.alle_kinderzimmer_nachtlichter
      include_light_control:
      - use_brightness
      - use_transition
      light_transition_on: 2
      light_transition_off: 10
      include_night_light_control:
      - use_night_brightness
      - use_brightness
      - use_transition
      night_light_transition_on: 2
      night_light_transition_off: 10
      night_lights_after_time: '19:00:00'
      night_lights_before_time: 05:30:00
      time_delay: 0
      night_time_delay: 0
      night_lights_conditions:
      - entity_state_enabled
      night_lights_entity_state:
      - input_boolean.schlafenszeit
      - input_boolean.nachtlicht
      include_sun: sun_disabled
      night_light_brightness: 5
      # 2200K statt RGB-Amber: sonst setzt die Blueprint erst Rot und Adaptive
      # Lighting korrigiert eine Sekunde spaeter auf 2200K, sichtbar als Farbsprung.
      include_night_light_colour_control: use_colour_temperature
      night_light_colour_temperature: 2200
      ambient_light_value: 200
      ambient_light_high_value: 300
      # Bypass motion turn-off when manual control is active
      include_bypass:
      - bypass_enabled_stop
      motion_bypass_lights_stop:
      - binary_sensor.kinderzimmer_manual_control
- id: '1722519561150'
  alias: Helper » Dynamische Kinder-Schlafzeiten
  description: >-
    Setzt täglich die Einschlafzeit: Ende der bürgerlichen Dämmerung, frühestens 19:00,
    spätestens 20:00 (vor freien Tagen 21:00). Aufwachen immer 07:00.
  triggers:
  - at: 00:10:00
    trigger: time
  conditions: []
  actions:
  - variables:
      basis_einschlaf_schultag: '20:00:00'
      basis_einschlaf_wochenende: '21:00:00'
      # Aufwachen immer 07:00, kein Unterschied Schultag/Wochenende (17.09.2026)
      basis_aufwach_schultag: 07:00:00
      basis_aufwach_wochenende: 07:00:00
      helligkeit_draussen: '{% if has_value(''sensor.ikea_motion_03_illuminance'') %}{{ states(''sensor.ikea_motion_03_illuminance'') | float(100)
        }}{% else %}100{% endif %}'
      wetter: '{% if has_value(''weather.fuerth_bayern'') %}{{ states(''weather.fuerth_bayern'') }}{% else %}sunny{% endif %}'
      sonnenuntergang_zeit: "{% set su = state_attr('sun.sun', 'next_setting') %}\
        \ {% if su %}\n  {{ (su | as_datetime | as_local).strftime('%H:%M') }}\n{%\
        \ else %}\n  20:00\n{% endif %}\n"
      # Kein Saison-Offset mehr beim Aufwachen: immer 07:00
      saison_offset_aufwach: 0
      # Gesamt-Offsets berechnen (in Minuten)
      gesamt_offset_aufwach: >-
        {{ saison_offset_aufwach | int(0) }}
      # Finale Zeiten berechnen
      # Einschlafen, sobald es dunkel ist (Ende der buergerlichen Daemmerung), aber nicht
      # vor 19:00 und nicht nach der Basiszeit. Um 00:10 ist next_dusk die Daemmerung von heute.
      # Ersetzt am 02.10.2026 die festen Saison-, Sonnenuntergangs- und Temperatur-Offsets.
      daemmerung_heute: >-
        {% set d = state_attr('sun.sun', 'next_dusk') %}
        {{ (d | as_datetime | as_local).strftime('%H:%M:%S') if d else basis_einschlaf_schultag }}
      einschlaf_schultag_final: >-
        {{ [[daemmerung_heute, '19:00:00'] | max, basis_einschlaf_schultag] | min }}
      einschlaf_wochenende_final: >-
        {{ [[daemmerung_heute, '19:00:00'] | max, basis_einschlaf_wochenende] | min }}
      aufwach_schultag_final: >-
        {% set base = today_at(basis_aufwach_schultag) %}
        {{ (base + timedelta(minutes=gesamt_offset_aufwach | int(0))).strftime('%H:%M:%S') }}
      aufwach_wochenende_final: >-
        {% set base = today_at(basis_aufwach_wochenende) %}
        {{ (base + timedelta(minutes=gesamt_offset_aufwach | int(0))).strftime('%H:%M:%S') }}
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.einschlafzeit_arbeitstag
    data:
      time: '{{ einschlaf_schultag_final }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.einschlafzeit_freier_tag
    data:
      time: '{{ einschlaf_wochenende_final }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.aufwachzeit_arbeitstag
    data:
      time: '{{ aufwach_schultag_final }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.aufwachzeit_freier_tag
    data:
      time: '{{ aufwach_wochenende_final }}'
  - action: logbook.log
    data:
      name: Schlafenszeiten angepasst
      message: 'Schultage: schlafen {{ einschlaf_schultag_final[:5] }} / aufstehen
        {{ aufwach_schultag_final[:5] }} - Wochenende: schlafen {{ einschlaf_wochenende_final[:5]
        }} / aufstehen {{ aufwach_wochenende_final[:5] }}'
      domain: automation
  mode: single
- id: 'kinderzimmer_motion_schlafenszeit'
  alias: Helper » Kinderzimmer Motion bei Schlafenszeit
  description: Deaktiviert Bewegungsmelder während Schlafenszeit
  triggers:
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    to: 'on'
    id: sleep_start
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    to: 'off'
    id: sleep_end
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_start
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.kinderzimmer_motion
        data:
          stop_actions: true
    - conditions:
      - condition: trigger
        id: sleep_end
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.kinderzimmer_motion
  mode: single
- id: 'kinderzimmer_nachtlichter_schlafenszeit'
  alias: Licht » Kinderzimmer Nachtlichter bei Schlafenszeit
  description: >-
    Schlafenszeit an: Govee Sternenprojektor (H60B0) an, zum Einschlafen.
    Um Mitternacht geht der Govee aus. Sobald der Govee ausgeht (Mitternacht
    oder sein App-Timer), uebernimmt das Yeelight Nachtlicht bis Schlafenszeit
    aus. Beginnt die Schlafenszeit erst nach Mitternacht, faellt der Govee weg
    und die Yeelight leuchtet direkt. Beide bekommen bewusst turn_on ohne
    Parameter: der Govee laedt dann die in der Govee-App gesetzte
    Sternen-Szene, die ueber die lokale Schnittstelle nicht waehlbar ist, die
    Yeelight ihren letzten Zustand.
  triggers:
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    to: 'on'
    id: sleep_start
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    to: 'off'
    id: sleep_end
  - trigger: time
    at: '00:00:00'
    id: midnight
  - trigger: state
    entity_id: light.h60b0
    from: 'on'
    to: 'off'
    id: govee_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_start
      - condition: time
        after: '12:00:00'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.h60b0
    - conditions:
      - condition: trigger
        id: sleep_start
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.kinderzimmer_kinderzimmer_nachtlicht
    - conditions:
      - condition: trigger
        id: midnight
      - condition: state
        entity_id: input_boolean.schlafenszeit
        state: 'on'
      sequence:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.h60b0
    - conditions:
      - condition: trigger
        id: govee_off
      - condition: state
        entity_id: input_boolean.schlafenszeit
        state: 'on'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.kinderzimmer_kinderzimmer_nachtlicht
    - conditions:
      - condition: trigger
        id: sleep_end
      sequence:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
          - light.kinderzimmer_kinderzimmer_nachtlicht
          - light.h60b0
  mode: queued
