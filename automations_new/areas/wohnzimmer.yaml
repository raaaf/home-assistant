# Areas - Wohnzimmer.Yaml
# Generated by automation splitter - 7 automations
# Part of Home Assistant configuration

- id: '1642114646798'
  alias: Wohnzimmer » Film
  description: Aktiviert Kinomodus mit Ambilight wenn Medien abgespielt werden
  triggers:
  - entity_id:
    - media_player.denon_avr_x3200w
    to: 'off'
    for:
      seconds: 20
    id: 'off'
    from: 'on'
    trigger: state
  - entity_id: media_player.wohnzimmer
    from:
    - 'off'
    - idle
    - standby
    - paused
    to: playing
    for:
      seconds: 5
    id: 'on'
    trigger: state
  - entity_id:
    - media_player.denon_avr_x3200w
    attribute: source
    to: Game
    id: game-on
    trigger: state
  - entity_id:
    - media_player.denon_avr_x3200w
    attribute: source
    to: CBL/SAT
    id: movie-on
    trigger: state
  - entity_id:
    - media_player.wohnzimmer
    from: playing
    to: paused
    for:
      hours: 0
      minutes: 0
      seconds: 15
    id: paused
    trigger: state
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id:
            - movie-on
            - game-on
            - 'off'
            - paused
        - condition: template
          value_template: "{{ has_value('media_player.wohnzimmer') }}"
  actions:
  - choose:
    - alias: "Movie oder Game Start"
      conditions:
      - condition: template
        value_template: "{{ trigger.id in ['on', 'game-on', 'movie-on'] }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.movie
      - action: adaptive_lighting.change_switch_settings
        target:
          entity_id:
          - switch.adaptive_lighting_wohnzimmer
          - switch.adaptive_lighting_kueche
        data:
          max_brightness: 40
          min_brightness: 5
      - alias: "Deaktiviere Küchen-Motion wenn nicht gekocht oder abgewaschen wird"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.kochen
            state: 'off'
          - condition: state
            entity_id: input_boolean.abwaschen
            state: 'off'
          sequence:
          - action: script.scene_disable_motion_automations
            data:
              automations: "automation.motion_kuche_2"
      - alias: "Deaktiviere Spieletisch-Motion"
        action: automation.turn_off
        target:
          entity_id: automation.motion_spieletisch
      - alias: "Deaktiviere Esstisch-Motion wenn nicht gegessen wird"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.essen
            state: 'off'
          sequence:
          - action: automation.turn_off
            target:
              entity_id: automation.motion_esstisch
      - action: light.turn_off
        data:
          transition: 6
        target:
          entity_id: light.alle_wohnzimmer_nachtlichter
      - alias: "Turn off living room lights (conditionally skip dining table)"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.essen
            state: 'off'
          sequence:
          - action: light.turn_off
            data:
              transition: 6
            target:
              entity_id: light.alle_wohnzimmer_lichter
        default:
        - action: light.turn_off
          data:
            transition: 6
          target:
            entity_id: light.alle_wohnzimmer_lichter_ohne_esstisch
      - alias: "Turn off kitchen lights if not cooking or dishwashing"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.kochen
            state: 'off'
          - condition: state
            entity_id: input_boolean.abwaschen
            state: 'off'
          sequence:
          - action: light.turn_off
            data:
              transition: 6
            target:
              entity_id: light.alle_kuche_lichter
      - alias: "Turn off hallway lights if not cooking or dishwashing"
        if:
        - condition: state
          entity_id: input_boolean.kochen
          state: 'off'
        - condition: state
          entity_id: input_boolean.abwaschen
          state: 'off'
        then:
        - action: light.turn_off
          data:
            transition: 6
          target:
            entity_id: light.alle_flur_lichter
        - alias: "Deaktiviere Flur-Motion"
          action: automation.turn_off
          target:
            entity_id: automation.motion_flur_wohnung
      - alias: "Leselicht wiederherstellen falls aktiv"
        action: script.restore_leselicht
      - alias: "Ambilight mit Retry einschalten (HyperHDR-Verbindung bricht beim Filmstart oft kurz ab)"
        repeat:
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hyperhdr
            data:
              effect: USB Capture
              brightness_pct: 50
          - wait_template: "{{ is_state('light.hyperhdr', 'on') }}"
            timeout: '00:00:20'
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: light.hyperhdr
              state: 'on'
            - condition: template
              value_template: "{{ repeat.index >= 6 }}"
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - target:
          entity_id: input_boolean.movie
        data: {}
        action: input_boolean.turn_off
      - alias: "Brightness-Reset, immer, mit dem zur Tageszeit passenden Minimum"
        # Frueher lief dieser Reset nur ausserhalb der Schlafenszeit. Endete ein Film nach
        # 23 Uhr, blieben Wohnzimmer und Kueche auf min_brightness 5 und max_brightness 40
        # haengen, bis der Morgen-Reset sie einsammelte. Beobachtet am 27.08.2026: die
        # AL-Kurve war eine flache Linie, weil der Abend-Fade das Minimum und die Film-Szene
        # das Maximum auf denselben Wert gedrueckt hatten.
        # Jetzt laeuft der Reset immer und setzt das Minimum, das gerade gelten soll:
        # 40 waehrend der Schlafenszeit (identisch zum Abend-Fade), sonst 10.
        action: adaptive_lighting.change_switch_settings
        target:
          entity_id:
          - switch.adaptive_lighting_wohnzimmer
          - switch.adaptive_lighting_kueche
        data:
          max_brightness: "{{ states('input_number.al_tagesmax_helligkeit') | int(100) }}"
          # 20 ist der Tageswert fuer Wohnzimmer und Kueche (siehe Startup-Automation und
          # Morgen-Reset), 40 der Abendwert des Fades. Frueher stand hier 10, das gehoert
          # Arbeitszimmer, Kinderzimmer und Ankleide.
          min_brightness: "{{ 40 if is_state('input_boolean.schlafenszeit', 'on') else 20 }}"
      - alias: "Re-enable Living Room Adaptive Lighting with conflict check"
        action: script.scene_enable_adaptive_lighting
        data:
          room: "wohnzimmer"
          exclude_scenes: "kochen,essen,party,party_wohnzimmer"
      - alias: "Re-enable Kitchen Adaptive Lighting with conflict check"
        action: script.scene_enable_adaptive_lighting
        data:
          room: "kueche"
          exclude_scenes: "kochen,abwaschen,party,party_wohnzimmer"
      - target:
          entity_id:
          - light.hyperhdr
          - light.alle_kuche_nachtlichter
          - light.alle_wohnzimmer_nachtlichter
        data: {}
        action: light.turn_off
      - alias: "Wohnzimmer Lichter nach Film"
        choose:
        - conditions:
          - condition: sun
            after: sunset
            before: sunrise
          sequence:
          - delay:
              minutes: 5
          - action: light.turn_off
            target:
              entity_id: light.alle_wohnzimmer_lichter
        default:
        - action: light.turn_off
          target:
            entity_id: light.alle_wohnzimmer_lichter
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - alias: "Brightness-Reset nur außerhalb Schlafenszeit"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.schlafenszeit
            state: 'off'
          sequence:
          - action: adaptive_lighting.change_switch_settings
            target:
              entity_id:
              - switch.adaptive_lighting_wohnzimmer
              - switch.adaptive_lighting_kueche
            data:
              max_brightness: 80
              # Fest 20, der Tageswert beider Raeume. Kein Schlafenszeit-Zweig noetig:
              # der umgebende choose laeuft ohnehin nur bei Schlafenszeit off.
              min_brightness: 20
      - target:
          entity_id: light.hyperhdr
        data:
          effect: Cinema dim lights
        action: light.turn_on
      - alias: "Wohnzimmer Wand 1-6 + Kindertisch einschalten (AL regelt Helligkeit/Farbe)"
        action: light.turn_on
        target:
          entity_id:
          - light.ikea_light_18_wand_1
          - light.ikea_light_19_wand_2
          - light.ikea_light_20_wand_3
          - light.ikea_light_21_wand_4
          - light.ikea_light_22_wand_5
          - light.ikea_light_23_wand_6
          - light.ikea_light_24
          - light.ikea_light_25
        data:
          transition: 2
      - if:
        - condition: sun
          after: sunset
          before: sunrise
        then:
        - data:
            brightness_step_pct: 10
          target:
            entity_id:
            - light.alle_kuche_nachtlichter
            - light.alle_wohnzimmer_nachtlichter
          action: light.turn_on
      - alias: "Motion-Automationen wiederherstellen"
        action: script.movie_motion_restore
  mode: restart
- id: 'movie_off_motion_restore'
  alias: Wohnzimmer » Film Ende Motion-Wiederherstellung
  description: >-
    Reaktiviert die waehrend des Films deaktivierten Motion-Automationen, sobald
    input_boolean.movie ausgeht. Faengt alle Wege ab (AVR aus, TV Auto off,
    manuelles Umschalten), damit man abends sofort wieder sieht, wo man hinlaeuft.
  triggers:
  - trigger: state
    entity_id: input_boolean.movie
    from: 'on'
    to: 'off'
  actions:
  - action: script.movie_motion_restore
  mode: single
- id: '1671133998236'
  alias: Wohnzimmer » Weihnachtsbaum
  description: Steuert Weihnachtsbaum-Beleuchtung mit erweiterten Features
  triggers:
  - event: sunset
    offset: -00:30:00
    id: sunset
    trigger: sun
  - at: 00:00:00
    id: midnight
    trigger: time
  - at: '22:00:00'
    id: dim_lights
    trigger: time
  - entity_id: input_boolean.alle_sind_weg
    from: 'on'
    to: 'off'
    id: coming_home
    trigger: state
  conditions:
  - condition: template
    value_template: >-
      {% set today = now().strftime('%m-%d') %}
      {% set start = '11-24' %}
      {% set end = '01-06' %}
      {{ (today >= start) or (today <= end) }}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      sequence:
      - if:
        - condition: template
          value_template: "{{ has_value('light.weihnachtsbaum') }}"
        then:
        - target:
            entity_id: light.weihnachtsbaum
          data:
            brightness_pct: "{% if now().hour >= 22 %}\n  {{ brightness_late }}\n{%\
              \ else %}\n  {{ brightness_normal }}\n{% endif %}\n"
            effect: '{{ effect_name }}'
            transition: 3
          action: light.turn_on
      - if:
        - condition: template
          value_template: "{{ has_value('switch.steckdose_avr') }}"
        then:
        - target:
            entity_id: switch.steckdose_avr
          action: switch.turn_on
    - conditions:
      - condition: trigger
        id: dim_lights
      - condition: template
        value_template: "{{ has_value('light.weihnachtsbaum') and is_state('light.weihnachtsbaum', 'on') }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ has_value('light.weihnachtsbaum') }}"
        then:
        - target:
            entity_id: light.weihnachtsbaum
          data:
            brightness_pct: '{{ brightness_late }}'
            transition: 10
          action: light.turn_on
      - if:
        - condition: template
          value_template: "{{ has_value('switch.steckdose_avr') }}"
        then:
        - target:
            entity_id: switch.steckdose_avr
          action: switch.turn_off
    - conditions:
      - condition: trigger
        id: coming_home
      - condition: sun
        after: sunset
      - condition: time
        before: 00:00:00
      sequence:
      - if:
        - condition: template
          value_template: "{{ has_value('light.weihnachtsbaum') }}"
        then:
        - target:
            entity_id: light.weihnachtsbaum
          data:
            brightness_pct: "{% if now().hour >= 22 %}\n  {{ brightness_late }}\n{%\
              \ else %}\n  {{ brightness_normal }}\n{% endif %}\n"
            effect: '{{ effect_name }}'
            transition: 3
          action: light.turn_on
      - if:
        - condition: template
          value_template: "{{ has_value('switch.steckdose_avr') and now().hour < 22 }}"
        then:
        - target:
            entity_id: switch.steckdose_avr
          action: switch.turn_on
    - conditions:
      - condition: trigger
        id: midnight
      sequence:
      - if:
        - condition: template
          value_template: "{{ has_value('light.weihnachtsbaum') }}"
        then:
        - target:
            entity_id: light.weihnachtsbaum
          data:
            transition: 5
          action: light.turn_off
      - if:
        - condition: template
          value_template: "{{ has_value('switch.steckdose_avr') }}"
        then:
        - target:
            entity_id: switch.steckdose_avr
          action: switch.turn_off
  mode: single
  max_exceeded: silent
  variables:
    turn_off_time_hour: 0
    turn_off_time_minute: 0
    sunset_offset: -00:30:00
    brightness_normal: 50
    brightness_late: 30
    effect_name: 4 Peachy
    start_date: 11-24
    end_date: 01-06
- id: '1737546250763'
  alias: Scenen » Party Wohnzimmer
  description: Aktiviert Party-Modus im Wohnzimmer mit dynamischer Beleuchtung und
    deaktivierten Bewegungsmeldern
  triggers:
  - entity_id:
    - input_boolean.party_wohnzimmer
    to: 'on'
    id: 'on'
    trigger: state
  - entity_id:
    - input_boolean.party_wohnzimmer
    to: 'off'
    id: 'off'
    trigger: state
  conditions: []
  # Eine Liste fuer beide Richtungen: laufen mark und clear auseinander, bleiben
  # Raeume dauerhaft als manuell markiert und AL adaptiert sie nie wieder.
  variables:
    party_wz_raeume:
    - wohnzimmer
    - kueche
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      # 1. Disable motion automations FIRST (stop new triggers)
      - alias: "Disable motion automations"
        action: automation.turn_off
        target:
          entity_id:
          - automation.motion_kuche_2
          - automation.motion_flur_wohnung
          - automation.motion_spieletisch
      - alias: "Deaktiviere Esstisch-Motion wenn nicht gegessen wird"
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.essen
            state: 'off'
          sequence:
          - action: automation.turn_off
            target:
              entity_id: automation.motion_esstisch
      # 2. Weisslicht-Gruppen als manuell markieren (haelt AL von ihnen fern)
      - alias: "Weisslicht-Gruppen als manuell markieren"
        action: script.al_set_manual_control
        data:
          manual_control: true
          rooms: "{{ party_wz_raeume }}"
      # 3. Disable AL switches (prevents any adaptation)
      - alias: "Disable adaptive lighting"
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_wohnzimmer
          - switch.adaptive_lighting_kueche
      # 4. Wait for in-flight commands to complete
      - alias: "Wait for in-flight commands"
        delay:
          milliseconds: 500
      # 5. Turn off ALL lights (clean slate)
      - alias: "Turn off all lights"
        action: light.turn_off
        target:
          entity_id:
          - light.alle_wohnzimmer_lichter
          - light.alle_kuche_lichter
      - alias: "Turn off kitchen appliances switch"
        action: switch.turn_off
        target:
          entity_id: switch.steckdose_kuechengeraete
      - alias: "Leselicht wiederherstellen falls aktiv"
        action: script.restore_leselicht
      # 6. Start Hue effect on RGB lights ONLY
      - alias: "Start Hue effect: colorloop (Party Wohnzimmer)"
        action: light.turn_on
        target:
          entity_id:
          - light.alle_wohnzimmer_rgb_lichter
          - light.alle_kuche_rgb_lichter
        data:
          effect: colorloop
          brightness_pct: 100
          transition: 10
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - alias: "Hue-Effekt stoppen und Lichter ausschalten"
        action: script.scene_stop_rgb_effect
        data:
          rgb_lights:
          - light.alle_wohnzimmer_rgb_lichter
          - light.alle_kuche_rgb_lichter
          off_lights:
          - light.alle_wohnzimmer_lichter
          - light.alle_kuche_lichter
      - delay:
          seconds: 6
      # Manual-Control-Markierungen loeschen, bevor AL wieder anlaeuft
      - alias: "Manual-Control-Markierungen loeschen"
        action: script.al_set_manual_control
        data:
          manual_control: false
          rooms: "{{ party_wz_raeume }}"
      - alias: "Adaptive Lighting und Motion mit Konflikt-Pruefung reaktivieren"
        parallel:
        - action: script.scene_enable_adaptive_lighting
          data:
            room: "wohnzimmer"
            exclude_scenes: "movie,party"
        - action: script.scene_enable_adaptive_lighting
          data:
            room: "kueche"
            exclude_scenes: "movie,kochen,party"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_kuche_2"
            exclude_scenes: "movie,kochen,party"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_flur_wohnung"
            exclude_scenes: "movie,party"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_esstisch"
            exclude_scenes: "essen,movie,party"
        - action: script.scene_enable_motion_automations
          data:
            automations: "automation.motion_spieletisch"
            exclude_scenes: "movie,party"
    default: []
  mode: restart
- id: '1744714272996'
  alias: Scenen » Esstisch reinigen
  description: 'Helles Licht zum Reinigen des Esstisch Bereichs'
  triggers:
  - entity_id:
    - input_boolean.esstisch
    to: 'on'
    id: 'on'
    trigger: state
  - entity_id:
    - input_boolean.esstisch
    to: 'off'
    id: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: vacuum.send_command
        data:
          command: app_zoned_clean
          params:
          - - 24638
            - 26629
            - 27433
            - 30765
            - 1
        target:
          entity_id: vacuum.s7_maxv
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.esstisch
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - data: {}
        target:
          entity_id: input_boolean.essen
        action: input_boolean.turn_off
  mode: single
- id: '1745924154398'
  alias: Motion » Esstisch
  description: Bewegungsgesteuerte Beleuchtung im Esszimmer mit Nachtlicht-Modus und
    Kochmodus-Bypass
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.aqara_vibration_02_vibration
      light_switch:
        entity_id:
        - light.philips_light_18_1
        - light.philips_light_19_2
        - light.philips_light_20_3
      include_light_control:
      - use_brightness
      - use_transition
      light_transition_on: 2
      light_transition_off: 10
      include_night_lights: night_lights_enabled
      night_lights:
        entity_id:
        - light.philips_light_18_1
        - light.philips_light_19_2
        - light.philips_light_20_3
      night_lights_after_time: '23:00:00'
      night_lights_before_time: 06:00:00
      night_time_delay: 0
      time_delay: 0
      include_ambient: ambient_enabled
      ambient_light_sensor: sensor.balkon_motion_illuminance_safe
      ambient_light_options: ambient_light_option_enabled
      ambient_light_value: 300
      include_time: time_disabled
      after_time: 06:00:00
      before_time: '23:00:00'
      night_lights_conditions:
      - entity_state_enabled
      night_lights_entity_state:
      - input_boolean.nachtlicht
      - input_boolean.schlafenszeit
      include_sun: sun_disabled
      include_night_light_control:
      - use_brightness
      - use_transition
      night_light_brightness: 30
      night_light_transition_on: 2
      night_light_transition_off: 10
      ambient_light_high_value: 400
      # 2200K statt RGB-Amber: sonst setzt die Blueprint erst Rot und Adaptive
      # Lighting korrigiert eine Sekunde spaeter auf 2200K, sichtbar als Farbsprung.
      include_night_light_colour_control: use_colour_temperature
      night_light_colour_temperature: 2200
      include_bypass:
      - bypass_enabled_stop
      motion_bypass_lights_stop:
      - binary_sensor.wohnzimmer_manual_control
- id: '1737900000002'
  alias: Motion » Spieletisch
  description: Vibrationsgesteuerte Beleuchtung an der Kinder-Werkbank (Kindertisch
    1+2, seit 21.08.2026). Der Vibrationssensor an der Werkbank schaltet beide
    Lampen ein, Auto-off wie bei den anderen Motion-Automationen.
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.aqara_vibration_01_vibration
      light_switch:
        entity_id:
        - light.ikea_light_24
        - light.ikea_light_25
      include_light_control:
      - use_brightness
      - use_transition
      light_transition_on: 2
      light_transition_off: 10
      include_night_lights: night_lights_enabled
      night_lights:
        entity_id:
        - light.ikea_light_24
        - light.ikea_light_25
      night_lights_conditions:
      - entity_state_enabled
      night_lights_entity_state:
      - input_boolean.nachtlicht
      - input_boolean.schlafenszeit
      include_night_light_control:
      - use_brightness
      - use_transition
      night_light_brightness: 30
      night_light_transition_on: 2
      night_light_transition_off: 10
      # KAJPLATS sind CCT-only, RGB-Amber geht hier nicht - 2200K wie der AL-Fallback
      include_night_light_colour_control: use_colour_temperature
      night_light_colour_temperature: 2200
      night_time_delay: 0
      time_delay: 0
      include_ambient: ambient_enabled
      ambient_light_sensor: sensor.balkon_motion_illuminance_safe
      ambient_light_options: ambient_light_option_enabled
      ambient_light_value: 800
      ambient_light_high_value: 400
      include_time: time_disabled
      include_sun: sun_disabled
      include_bypass:
      - bypass_enabled_stop
      motion_bypass_lights_stop:
      - binary_sensor.wohnzimmer_manual_control
- id: 'scene_leselicht'
  alias: 'Scenen » Leselicht'
  description: Leselicht im Wohnzimmer ein-/ausschalten
  triggers:
  - trigger: state
    entity_id: input_boolean.leselicht
    to: 'on'
    id: 'on'
  - trigger: state
    entity_id: input_boolean.leselicht
    to: 'off'
    id: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - alias: "Manual Control zuruecksetzen falls aktiv"
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_wohnzimmer
          lights:
          - light.ikea_light_19_wand_2
          manual_control: false
      - action: light.turn_on
        target:
          entity_id: light.ikea_light_19_wand_2
      - alias: "Adaptive Lighting Werte anwenden"
        action: adaptive_lighting.apply
        data:
          entity_id: switch.adaptive_lighting_wohnzimmer
          lights:
          - light.ikea_light_19_wand_2
          turn_on_lights: true
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.ikea_light_19_wand_2
        data:
          transition: 2
      - delay:
          seconds: 3
      - alias: "Manual Control zuruecksetzen"
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_wohnzimmer
          lights:
          - light.ikea_light_19_wand_2
          manual_control: false
  mode: restart

- id: '1652698714339'
  alias: Wohnzimmer » Luftreiniger
  description: >-
    Steuert den Xiaomi Air Purifier 4 Pro im Wohnzimmer rein luftqualitaetsgesteuert
    (PM2.5/Feuchtigkeit) mit Fenster-Guard (Wohnzimmer + Balkontuer), Anwesenheit
    und Auto-Preset.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zhimi_vb4_bce4_pm25_density
    above: 20
    for:
      minutes: 1
    id: pm25-high
  - trigger: numeric_state
    entity_id: sensor.zhimi_vb4_bce4_pm25_density
    below: 10
    for:
      minutes: 5
    id: pm25-low
  - trigger: numeric_state
    entity_id: sensor.zhimi_vb4_bce4_relative_humidity
    above: 65
    for:
      minutes: 5
    id: humidity-high
  - trigger: state
    entity_id:
    - binary_sensor.aqara_contact_08
    - binary_sensor.aqara_contact_02
    to: 'on'
    for:
      minutes: 2
    id: window-open
  - trigger: state
    entity_id:
    - binary_sensor.aqara_contact_08
    - binary_sensor.aqara_contact_02
    to: 'off'
    for:
      minutes: 2
    id: window-closed
  - trigger: state
    entity_id: input_boolean.alle_sind_weg
    to: 'on'
    id: away
  - trigger: state
    entity_id: input_boolean.alle_sind_weg
    to: 'off'
    id: home
  conditions:
  - alias: "Luftreiniger ist verfügbar"
    condition: template
    value_template: "{{ has_value('fan.zhimi_vb4_bce4_air_purifier') }}"
  actions:
  - choose:
    - alias: "PM2.5 hoch — einschalten"
      conditions:
      - condition: trigger
        id: pm25-high
      - alias: "Luftreiniger läuft nicht"
        condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'off'
      - alias: "Jemand ist zu Hause"
        condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      - alias: "Fenster geschlossen"
        condition: template
        value_template: >-
          {{ not is_state('binary_sensor.aqara_contact_08', 'on')
             and not is_state('binary_sensor.aqara_contact_02', 'on') }}
      - alias: "Sensor verfügbar"
        condition: template
        value_template: "{{ has_value('sensor.zhimi_vb4_bce4_pm25_density') }}"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier
      - alias: "Auto-Modus setzen wenn noetig"
        action: script.luftreiniger_auto_modus

    - alias: "Feuchtigkeit hoch — einschalten"
      conditions:
      - condition: trigger
        id: humidity-high
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'off'
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.aqara_contact_08', 'on')
             and not is_state('binary_sensor.aqara_contact_02', 'on') }}
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier
      - alias: "Auto-Modus setzen wenn noetig"
        action: script.luftreiniger_auto_modus

    - alias: "PM2.5 gut — ausschalten"
      conditions:
      - condition: trigger
        id: pm25-low
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'on'
      - alias: "Feuchtigkeit auch OK"
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.zhimi_vb4_bce4_relative_humidity
          below: 65
        - condition: template
          value_template: "{{ not has_value('sensor.zhimi_vb4_bce4_relative_humidity') }}"
      sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier

    - alias: "Fenster offen — ausschalten"
      conditions:
      - condition: trigger
        id: window-open
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'on'
      sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier

    - alias: "Fenster geschlossen — einschalten wenn PM2.5 oder Feuchte hoch"
      conditions:
      - condition: trigger
        id: window-closed
      - alias: "Beide Fenster geschlossen"
        condition: template
        value_template: >-
          {{ not is_state('binary_sensor.aqara_contact_08', 'on')
             and not is_state('binary_sensor.aqara_contact_02', 'on') }}
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'off'
      - condition: state
        entity_id: input_boolean.alle_sind_weg
        state: 'off'
      - alias: "PM2.5 oder Feuchtigkeit problematisch"
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.zhimi_vb4_bce4_pm25_density
          above: 20
        - condition: numeric_state
          entity_id: sensor.zhimi_vb4_bce4_relative_humidity
          above: 65
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier
      - alias: "Auto-Modus setzen wenn noetig"
        action: script.luftreiniger_auto_modus

    - alias: "Alle weg — ausschalten"
      conditions:
      - condition: trigger
        id: away
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'on'
      sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier

    - alias: "Jemand kommt heim — einschalten wenn PM2.5 hoch"
      conditions:
      - condition: trigger
        id: home
      - condition: state
        entity_id: fan.zhimi_vb4_bce4_air_purifier
        state: 'off'
      - condition: template
        value_template: "{{ has_value('sensor.zhimi_vb4_bce4_pm25_density') }}"
      - condition: numeric_state
        entity_id: sensor.zhimi_vb4_bce4_pm25_density
        above: 20
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.aqara_contact_08', 'on')
             and not is_state('binary_sensor.aqara_contact_02', 'on') }}
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.zhimi_vb4_bce4_air_purifier
      - delay:
          seconds: 10
      - alias: "Retry wenn Air Purifier nicht reagiert hat"
        if:
        - condition: state
          entity_id: fan.zhimi_vb4_bce4_air_purifier
          state: 'off'
        then:
        - action: fan.turn_on
          target:
            entity_id: fan.zhimi_vb4_bce4_air_purifier
        - delay:
            seconds: 10
        - if:
          - condition: state
            entity_id: fan.zhimi_vb4_bce4_air_purifier
            state: 'off'
          then:
          - action: fan.turn_on
            target:
              entity_id: fan.zhimi_vb4_bce4_air_purifier
      - alias: "Auto-Modus setzen wenn noetig"
        action: script.luftreiniger_auto_modus
  mode: single
  max_exceeded: silent

- id: 'luftreiniger_filter_warnung'
  alias: "Benachrichtigung » Luftreiniger Filter"
  description: "Warnt wenn der Filterstand des Xiaomi Air Purifier unter 15% fällt."
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zhimi_vb4_bce4_filter_life_level
    below: 15
    for:
      hours: 1
  conditions:
  - alias: "Nicht Schlafenszeit"
    condition: state
    entity_id: input_boolean.schlafenszeit
    state: 'off'
  - condition: time
    after: '08:00:00'
    before: '22:00:00'
  - alias: "Letzte Notification > 24h her"
    condition: template
    value_template: >-
      {% set last = state_attr('automation.benachrichtigung_luftreiniger_filter', 'last_triggered') %}
      {{ last is none or (now() - last).total_seconds() > 24 * 60 * 60 }}
  actions:
  - action: notify.rafael
    data:
      title: "Luftreiniger — Filter wechseln"
      message: "Filterstand bei {{ states('sensor.zhimi_vb4_bce4_filter_life_level') }}%. Bitte Filter bestellen/wechseln."
  - action: persistent_notification.create
    data:
      title: "Luftreiniger — Filter wechseln"
      message: "Der Filter des Xiaomi Air Purifier im Wohnzimmer ist bei {{ states('sensor.zhimi_vb4_bce4_filter_life_level') }}%. Bitte zeitnah ersetzen."
      notification_id: luftreiniger_filter
  mode: single
  max_exceeded: silent

- id: 'wohnzimmer_mueckenlampe'
  alias: Wohnzimmer » Mückenlampe
  description: >-
    UV-Mückenlampe nur in der Abenddämmerung (Sonnenuntergang bis 23:00) und nur,
    wenn das Wohnzimmerlicht aus ist: UV lockt nur als hellste Lichtquelle im Raum.
    Aus um 23:00, bei Sonnenaufgang oder sobald das Raumlicht angeht. Schlafenszeit
    holt den Start nach, falls HA bei Sonnenuntergang nicht lief.
  triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 0
    id: dunkel
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 0
    id: hell
  - trigger: time
    at: '23:00:00'
    id: ende
  - trigger: state
    entity_id: light.alle_wohnzimmer_lichter
    to: 'off'
    for:
      minutes: 2
    id: licht-aus
  - trigger: state
    entity_id: light.alle_wohnzimmer_lichter
    to: 'on'
    id: licht-an
  - trigger: state
    entity_id: input_boolean.schlafenszeit
    to: 'on'
    id: schlafenszeit
  conditions:
  - alias: "Steckdose ist verfügbar"
    condition: template
    value_template: "{{ has_value('light.wohnzimmer_wohnzimmer_muckenlampe_outlet') }}"
  variables:
    nacht: "{{ state_attr('sun.sun', 'elevation') | float(0) < 0 }}"
    # Saison nach Tageshöchsttemperatur statt nach Kalendermonat. Der Monatsfilter
    # April bis Oktober liess die Lampe auch an kalten Rand-Tagen laufen, an denen
    # draussen nichts fliegt und die Balkontür zu bleibt, also gar nichts hereinkommt.
    # Culex fliegt unter rund 15 C kaum; 18 C Tagesmaximum ist die Schwelle, ab der
    # abends gelüftet wird. Quelle wie bei der Heizung: sensor.fuerth_daily.
    # Fällt die Prognose aus, entscheidet die aktuelle Aussentemperatur.
    saison: >-
      {% set f = state_attr('sensor.fuerth_daily', 'forecast') %}
      {% if f is not none and f | length > 0 and f[0].temperature is not none %}
        {{ f[0].temperature | float(0) >= 18 }}
      {% else %}
        {{ states('sensor.temperatur_aussen') | float(0) >= 18 }}
      {% endif %}
  actions:
  - choose:
    - alias: "23:00, Sonnenaufgang oder Raumlicht an — aus"
      conditions:
      - condition: trigger
        id:
        - ende
        - hell
        - licht-an
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.wohnzimmer_wohnzimmer_muckenlampe_outlet

    - alias: "Dämmerung vor 23:00, Saison, Raum dunkel — an"
      conditions:
      - condition: trigger
        id:
        - dunkel
        - licht-aus
        - schlafenszeit
      - condition: template
        value_template: "{{ nacht and saison }}"
      # Nur das Abendfenster. `nacht` allein wäre auch um 03:00 wahr, die
      # untere Grenze 12:00 schliesst den Morgen aus.
      - condition: time
        after: '12:00:00'
        before: '23:00:00'
      - condition: state
        entity_id: light.alle_wohnzimmer_lichter
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.wohnzimmer_wohnzimmer_muckenlampe_outlet
  mode: queued
  max_exceeded: silent

- id: 'mueckenlampe_reinigung'
  alias: "Benachrichtigung » Mückenlampe reinigen"
  description: >-
    Erinnert daran, die Auffangschale zu leeren, wenn die Lampe in den letzten
    14 Tagen über 20 Stunden lief. Höchstens einmal pro Woche.
    Schwelle war 100 h, solange die Lampe von Sonnenuntergang bis Sonnenaufgang
    lief (rund 10,5 h pro Nacht). Seit dem Abendfenster bis 23:00 sind es je nach
    Jahreszeit 1,5 bis 3,5 h, 100 h wären unerreichbar. 20 h entspricht rund zehn
    Betriebsabenden.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.muckenlampe_betriebsstunden_14_tage
    above: 20
  conditions:
  - condition: time
    after: '08:00:00'
    before: '22:00:00'
  - alias: "Letzte Notification > 7 Tage her"
    condition: template
    value_template: >-
      {% set last = state_attr('automation.benachrichtigung_muckenlampe_reinigen', 'last_triggered') %}
      {{ last is none or (now() - last).total_seconds() > 7 * 24 * 60 * 60 }}
  actions:
  - action: notify.rafael
    data:
      title: "Mückenlampe reinigen"
      message: "Die Mückenlampe lief in den letzten 14 Tagen {{ states('sensor.muckenlampe_betriebsstunden_14_tage') | round(0) }} Stunden. Auffangschale leeren."
  - action: persistent_notification.create
    data:
      title: "Mückenlampe reinigen"
      message: "Die Mückenlampe im Wohnzimmer lief in den letzten 14 Tagen {{ states('sensor.muckenlampe_betriebsstunden_14_tage') | round(0) }} Stunden. Auffangschale leeren."
      notification_id: mueckenlampe_reinigung
  mode: single
  max_exceeded: silent
