- id: '1672929418223'
  alias: Motion » Badezimmer Gross
  description: Bewegungsgesteuerte Beleuchtung im Badezimmer mit Nachtlicht-Modus
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.badezimmer_motion_all
      include_night_lights: night_lights_enabled
      night_lights:
        entity_id: light.alle_badezimmer_nachtlichter
      night_lights_after_time: '23:00:00'
      night_lights_before_time: 06:00:00
      light_switch:
        entity_id: light.alle_badezimmer_lichter
      include_ambient: ambient_enabled
      # Raumsensor statt Balkon: der Balkonwert sagt nur, wie hell es draussen
      # ist, und lag praktisch immer ueber der Schwelle.
      # Schwelle nach Nutzerrueckmeldung, nicht nach Statistik: bei 101 lx und
      # ausgeschaltetem Licht war das Bad subjektiv zu dunkel. 101 lx ist in
      # der 7-Tage-Historie erst Perzentil 12, die Statistik haette also viel
      # zu niedrig angesetzt. 150 lx laesst das Licht in rund 20 % der
      # Tagesmesswerte angehen, p25 liegt bei 167 lx.
      # ambient_light_option_enabled = "Sensor wird vom Licht beeinflusst";
      # der Blueprint verlangt dafuer low == high, also kein Offset.
      ambient_light_sensor: sensor.tuya_motion_01_illuminance
      ambient_light_options: ambient_light_option_enabled
      ambient_light_value: 150
      ambient_light_high_value: 150
      night_lights_conditions:
      - entity_state_enabled
      night_lights_entity_state:
      - input_boolean.nachtlicht
      - input_boolean.schlafenszeit
      include_light_control:
      - use_brightness
      - use_transition
      light_transition_on: 2
      light_transition_off: 10
      include_night_light_control:
      - use_brightness
      - use_transition
      night_light_brightness: 30  # Indirekte Lichter (Schrank, Fenster)
      night_light_transition_on: 3
      night_light_transition_off: 9
      # 2200K statt RGB-Amber: sonst setzt die Blueprint erst Rot und Adaptive
      # Lighting korrigiert eine Sekunde spaeter auf 2200K, sichtbar als Farbsprung.
      include_night_light_colour_control: use_colour_temperature
      night_light_colour_temperature: 2200
      boolean_scenes_scripts: input_boolean.musik_badezimmer
      time_delay: 0
      night_time_delay: 0
      # Bypass motion turn-off when manual control is active
      include_bypass:
      - bypass_enabled_stop
      motion_bypass_lights_stop:
      - binary_sensor.badezimmer_manual_control
